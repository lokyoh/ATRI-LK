# 肉鸽爬塔配置（任务书 §12）。全部数值外置；用户可见文案在 texts.yaml 的 rogue 块。
# 局内资源（局内生命、局内金币、局内增益）只存在于 run 状态里，永不落盘到养成数据。
# 结构：5 个区域 × 20 层 = 100 层；每区域一个主题，基础数值跨区域成倍跳升（难度差距显著）。
#   · 区域中点（relic_floor）固定为**遗物奖励层**（三选一）；
#   · 区域末层为**区域首领**（候选三选一，首通另给首通奖励，击杀掉 Boss 专属遗物）；
#   · 首领前一层必定刷出**回血补给事件**（supply），同层的战斗路线也必定是精英守门。
# 事件在 rogue_events.yaml（每区域 30 个）；遗物在 rogue_relics.yaml（普通 ≥50 + Boss 专属 15）。

tower:
  floors: 100             # 5 区域 × 20 层
  entry_cost_key: rogue       # 入场行动点，对应 daily.yaml action_points.costs 的键
  step_cost_key: rogue_step   # 每前进一步的行动点
  regions:
    - id: plains
      name: 青草平原
      desc: 开阔的草原，风里混着青草与野花的气息——最温和的试炼。
      start: 1
      end: 20
      relic_floor: 10     # 区域中点：固定遗物奖励层
      boss_floor: 20
      # 怪物面板统一走 monster_templates（1 级基准 + 成长 × 怪物等级）；
      # 区域只决定**强度档位** power_mult，不再各写一套 base/growth。
      # 校准口径：与改造前的当层数值对齐（plains 末层 ≈ 97hp/19atk/10def）。
      power_mult: 0.70
      monsters:
        - { name: 草原狼, traits: [swift], desc: 成群巡弋的灰狼，总是先派一只试探，再一起扑上来。, archetype: swift, stats: { spd: 1.2 } }
        - { name: 野猪, traits: [strong], desc: 肩胛隆起的独行野猪，低头冲刺时连灌木都能连根拱起。, archetype: brute, stats: { hp: 1.25, atk: 1.3, spd: 0.85 } }
        - { name: 巨眼田鼠, traits: [thin], desc: 眼睛占了半个脑袋，挖出的洞口密得像筛子，一受惊就钻进土里。, archetype: swift, stats: { hp: 0.75, spd: 1.3 } }
        - { name: 带刺花妖, traits: [thorns, volatile], desc: 花瓣背面全是细刺，被碰到时会整朵炸开，把刺喷你一脸。, archetype: tank, stats: { def: 1.3, spd: 0.7 } }
        - { name: 泥潭史莱姆, traits: [leech, regen], desc: 半透明的泥浆团，吞下东西后能看见它在体内慢慢变色。, archetype: tank, stats: { hp: 1.3, spd: 0.6, atk: 0.85 } }
        - { name: 风灵, traits: [swift, evasive], desc: 一缕有了形状的风，掠过草地时只留下倒伏的痕迹。, archetype: swift, stats: { hp: 0.7, spd: 1.45 } }
        - { name: 野蛮蜂群, traits: [swarm], desc: 没有巢的流蜂，顺着甜味与汗味找到你，一拥而上。, archetype: swift, stats: { hp: 0.65, spd: 1.4 } }
        - { name: 强盗野兔, traits: [crit], desc: 后腿蹬地的瞬间弹射，专挑膝盖与喉咙这种软处下手。, archetype: swift, stats: { atk: 1.2, spd: 1.35, hp: 0.85 } }
        - { name: 磷光蝶群, traits: [swarm, thin, volatile], desc: 翅膀的磷粉有毒，落在皮肤上会亮起一小片痒。, archetype: swift, stats: { hp: 0.6, spd: 1.4, atk: 0.9 } }
        - { name: 稻草傀儡, traits: [thick, slow], desc: 田里立了一季的稻草人自己走下来了，塞满稻壳的身体很耐打。, archetype: tank, stats: { hp: 1.5, def: 1.3, spd: 0.5 } }
        - { name: 旱地蜥, traits: [tough, slow], desc: 腹鳞擦过干土发出沙沙声，晒了一整天的石头就是它的家。, archetype: tank, stats: { hp: 1.2, def: 1.4, spd: 0.6 } }
        - { name: 落单的牧羊犬, traits: [swift, crit], desc: 项圈上还挂着半截绳子，它已经分不清谁是羊群了。, archetype: swift, stats: { atk: 1.15, spd: 1.25 } }
        - { name: 麦田乌鸦群, traits: [swarm], desc: 一整片麦子忽然黑了一下，然后才听见翅膀声。, archetype: swift, stats: { hp: 0.6, spd: 1.35 } }
        - { name: 鼹鼠掘工, traits: [thick], desc: 前爪像两把小铲，一晚上能把整条田埂翻过来。, archetype: tank, stats: { hp: 1.35, def: 1.2, spd: 0.7 } }
        - { name: 迷路的商队骡, traits: [strong], desc: 驮货的骡子被什么吓疯了，包里的锅碗一路响。, archetype: brute, stats: { hp: 1.3, spd: 0.8 } }
        - { name: 花粉团, traits: [thin, crit, volatile], desc: 一团浓得看不清的花粉，吸进去就开始打喷嚏。, archetype: caster, stats: { hp: 0.7, atk: 1.25 } }
        - { name: 石磨精, traits: [tough], desc: 废弃磨坊的石盘自己转了起来，碾碎的东西没人想知道。, archetype: tank, stats: { hp: 1.35, def: 1.5, spd: 0.45 } }
        - { name: 田埂土蛇, traits: [thin, crit], desc: 藏在干草里的一截会动的东西，咬完就溜。, archetype: swift, stats: { hp: 0.8, atk: 1.2, spd: 1.25 } }
        - { name: 啄谷麻雀群, traits: [swarm], desc: 落在田里像一阵灰雨，飞走时谷穗全空。, archetype: swift, stats: { hp: 0.55, spd: 1.4 } }
        - { name: 流浪稻草犬, traits: [thick], desc: 用稻草和旧布缝的，跑起来掉一路草屑。, archetype: tank, stats: { hp: 1.2, def: 1.15 } }
        - { name: 暴晒南瓜怪, traits: [leech], desc: 熟过头之后裂开的东西，里面不是瓤。, archetype: tank, stats: { hp: 1.4, spd: 0.75 } }
        - { name: 犁头铁虫, traits: [tough], desc: 壳硬得像犁头崩下来的铁片。, archetype: tank, stats: { hp: 1.1, def: 1.6, spd: 0.5 } }
        - { name: 野蜂后, traits: [crit], desc: 蜂群绕着她转，她自己几乎不动。, archetype: caster, stats: { atk: 1.3, hp: 0.85 } }
        - { name: 干涸水鬼, traits: [fragile, leech], desc: 井干了，它还在井底等水。, archetype: caster, stats: { hp: 0.75, atk: 1.3, spd: 1.15 } }
        - { name: 碎石傀儡, traits: [thick, slow], desc: 田里的碎石头攒成了人形。, archetype: tank, stats: { hp: 1.3, def: 1.35, spd: 0.5 } }
        - { name: 迷路的羊羔, traits: [thin], desc: 叫着往你这边跑，身后跟着一整片阴影。, archetype: swift, stats: { hp: 0.7, spd: 1.3 } }
        - { name: 麦浪精灵, traits: [swift, crit], desc: 风一过，麦浪里就多出一道影子。, archetype: swift, stats: { atk: 1.2, spd: 1.35, hp: 0.85 } }
        - { name: 蚯蚓巨怪, traits: [thick, dull], desc: 被雨水泡胀了的一截土，在泥里翻。, archetype: tank, stats: { hp: 1.45, atk: 0.8, spd: 0.55 } }
        - { name: 稻草人新郎, traits: [strong], desc: 穿着不合身的礼服，手里攥着一束枯花。, archetype: brute, stats: { hp: 1.2, atk: 1.35, spd: 0.85 } }
        - { name: 晚归的牧童, traits: [leech, crit], desc: 天都黑了还站在坡上，数着不该数的东西。, archetype: caster, stats: { atk: 1.3, spd: 1.1 } }
      rewards: { coins: 2, coins_per_floor: 1, exp: 20, exp_per_floor: 2 }
      shop: { heal_mult: 1 }
      elites:  # 每区域 7 个精英备选（战斗路线按区域 seed 抽，遭遇次数受 elite.max_per_region 限制）
        - { name: 铁角原牛, desc: 低头犁地的巨牛，一对铁角能掀翻货车。, archetype: brute, preset: charger, passive: bulwark }
        - { name: 疾风隼王, traits: [swift], desc: 循风而猎的巨隼，俯冲时像一支白羽箭。, archetype: swift, stats: { atk: 1.15, spd: 1.35, hp: 0.85 }, skills: ["e_dive", "e_haste"], passive: rage }
        - { name: 毒刺巨蜂, desc: 尾针有小指长，振翅声像锯木头。, archetype: swift, preset: selfdestruct, passive: erode }
        - { name: 老田鼠王, desc: 肥得像一袋谷子，牙齿却能咬穿铁锹。, archetype: tank, preset: undying, passive: erode }
        - { name: 走失的战马, traits: [strong, swift], desc: 鞍上没人，蹄铁却还是新的。, archetype: brute, stats: { hp: 1.2, atk: 1.3, spd: 1.2 }, skills: ["e_roll", "e_mirror_edge"], passive: bulwark }
        - { name: 断牙头狼, traits: [crit], desc: 狼群的王，左犬齿断了一半，从不落单。, archetype: brute, stats: { hp: 1.15, atk: 1.25 }, skills: ["e_summon_wolf", "e_blood_whirl"], phase: ph_frenzy, passive: rage }
        - { name: 禾田稻魔, traits: [thick], desc: 稻草束成的人形，夜里在田里自己走路。, archetype: tank, stats: { hp: 1.4, def: 1.3, spd: 0.35 }, skills: ["e_root", "e_plague"], phase: ph_plague, passive: siphon }
    - id: forest
      name: 迷雾森林
      desc: 终年不散的浓雾吞掉路径与声音，树影里藏着不属于林地的眼睛。
      start: 21
      end: 40
      relic_floor: 30
      boss_floor: 40
      power_mult: 0.80
      monsters:
        - { name: 雾影狸, traits: [evasive], desc: 只在雾气最浓处显形，你挥空三次才可能碰到它一次。, archetype: swift, stats: { hp: 0.75, spd: 1.4 } }
        - { name: 毒牙蜘蛛, traits: [crit], desc: 垂在路中央的蛛丝上，两颗毒牙磨得发亮，专等抬头的猎物。, archetype: brute, stats: { atk: 1.35, hp: 0.9 } }
        - { name: 树精哨兵, traits: [thick, slow], desc: 被雾泡软的老树忽然睁眼，树皮缝里嵌着前人的破甲片。, archetype: tank, stats: { hp: 1.5, def: 1.35, spd: 0.45 } }
        - { name: 腐化野鹿, traits: [strong], desc: 鹿角上挂满腐叶，呼吸带着甜腻的烂味，撞人时毫不减速。, archetype: brute, stats: { hp: 1.2, atk: 1.3, spd: 0.95 } }
        - { name: 迷途怨灵, traits: [leech, undying], desc: 雾里反复问路的影子，靠近后才发现它在问的是你的名字。, archetype: caster, stats: { hp: 0.8, atk: 1.3, spd: 1.15 } }
        - { name: 苔藓巨蟾, traits: [thick, dull, regen], desc: 背上的苔藓厚得能养出小虫，蹲着不动时和一块石头没区别。, archetype: tank, stats: { hp: 1.45, def: 1.2, atk: 0.85, spd: 0.5 } }
        - { name: 藤蔓缠人者, traits: [thorns, regen], desc: 脚踝先被缠住，接着整片林子都在往回拽你。, archetype: tank, stats: { hp: 1.3, def: 1.4, spd: 0.55 } }
        - { name: 枯叶刃魔, traits: [swift], desc: 由成千片干枯落叶拼成，掠过时像一阵刮在皮肤上的噪音。, archetype: swift, stats: { atk: 1.2, spd: 1.35, hp: 0.85 } }
        - { name: 夜梟, traits: [thin, crit, dodgy], desc: 无声地贴着树冠滑过，只有翅膀带起的冷风提醒你还活着。, archetype: swift, stats: { hp: 0.75, atk: 1.2, spd: 1.3 } }
        - { name: 蛊惑花, traits: [leech, thin], desc: 花心散发你最喜欢的气味，凑近时才发现根须已经缠上脚踝。, archetype: caster, stats: { hp: 0.85, atk: 1.25, spd: 1.05 } }
        - { name: 腐叶虫群, traits: [swarm], desc: 落叶底下的一层会动的东西，一脚踩下去才知道有多少只。, archetype: swift, stats: { hp: 0.6, spd: 1.3 } }
        - { name: 雾苔行者, traits: [thick, slow], desc: 走得很慢，但每一步都踩在你刚才站过的地方。, archetype: tank }
        - { name: 绣眼鬼面蛛, traits: [crit, swift], desc: 背上的花纹像一张笑脸，只是笑得位置不对。, archetype: swift }
        - { name: 断枝麋鹿, traits: [strong], desc: 鹿角断了一半，剩下的那半挂着不属于它的东西。, archetype: brute }
        - { name: 腐木嚎客, traits: [tough], desc: 从空心树里钻出来的声音，先听见嚎叫才看见形状。, archetype: caster }
        - { name: 蛛卵囊, traits: [thin, thorns], desc: 半透明的卵囊挂在枝条上，里面有东西在缓慢地动。, archetype: caster }
        - { name: 拾荒地精, traits: [crit], desc: 手里的刀是从三具尸体上拼出来的。, archetype: swift }
        - { name: 雾中吹笛人, traits: [leech, dodgy], desc: 笛声从雾里飘出来，跟着跟着就走了岔路。, archetype: caster, stats: { hp: 0.8, atk: 1.3 } }
        - { name: 缠藤幼兽, traits: [tough], desc: 被藤蔓裹了一半的身体，还在试着往前扑。, archetype: tank, stats: { hp: 1.25, def: 1.35, spd: 0.7 } }
        - { name: 苔藓獾, traits: [thick], desc: 一身绿毛，钻进腐木里就再也找不出来。, archetype: tank, stats: { hp: 1.3, def: 1.2 } }
        - { name: 腐果蝇群, traits: [swarm, thin], desc: 落在烂果子上的东西，一起飞起来像一团烟。, archetype: swift, stats: { hp: 0.55, spd: 1.45 } }
        - { name: 树瘤人, traits: [tough, slow], desc: 树干上鼓起的那一坨，忽然睁开了眼。, archetype: tank, stats: { hp: 1.4, def: 1.4, spd: 0.5 } }
        - { name: 迷雾走蛾, traits: [fragile, swift], desc: 翅膀上的粉在雾里发着微弱的光。, archetype: swift, stats: { hp: 0.6, spd: 1.35 } }
        - { name: 寄根草, traits: [leech, regen], desc: 根须扎在别的活物身上，慢慢把颜色抽走。, archetype: caster, stats: { hp: 0.9, atk: 1.3 } }
        - { name: 断角公鹿, traits: [strong, crit], desc: 鹿角只剩一边，撞过来时整个林子都在抖。, archetype: brute, stats: { hp: 1.15, atk: 1.4, spd: 1.1 } }
        - { name: 菌伞巫医, traits: [crit], desc: 伞盖下挂着一圈小瓶子，里面装的东西还在动。, archetype: caster, stats: { atk: 1.3, hp: 0.85 } }
        - { name: 林间灯笼, traits: [fragile, dodgy], desc: 提着自己脑袋走路的火，照到谁谁就迷路。, archetype: caster, stats: { hp: 0.65, atk: 1.25, spd: 1.25 } }
        - { name: 腐尸搬运工, traits: [thick, leech], desc: 背着比自己还大的东西，走得很稳。, archetype: tank, stats: { hp: 1.45, def: 1.2, spd: 0.6 } }
        - { name: 湿苔爬行者, traits: [slow, thorns], desc: 贴在潮湿岩面上移动的一层绿。, archetype: tank, stats: { hp: 1.2, def: 1.35, spd: 0.5 } }
        - { name: 林中低语群, traits: [swarm, thin], desc: 听不清在说什么，但明显在叫你的名字。, archetype: swift, stats: { hp: 0.55, spd: 1.35 } }
      rewards: { coins: 5, coins_per_floor: 1, exp: 60, exp_per_floor: 4 }
      shop: { heal_mult: 2.5 }
      elites:
        - { name: 苔皮巨熊, desc: 背上生满青苔，一掌能拍断百年树干。, archetype: brute, preset: guardian, passive: bulwark }
        - { name: 织网女巫蛛, desc: 腹部的纹路像一张皱眉的人脸。, archetype: caster, preset: summoner, passive: siphon }
        - { name: 腐沼鳄, traits: [thick], desc: 潜在浮萍之下，背脊看去只是一截烂木。, archetype: brute, stats: { hp: 1.35, atk: 1.3, spd: 0.6 }, skills: ["e_roll", "e_devour"], passive: erode }
        - { name: 巨钳螳螂, desc: 双臂镰刃磨得发亮，专剪经过的脖子。, archetype: swift, preset: duelist, passive: rage }
        - { name: 雾隐枭人, desc: 半人半枭，雾越浓越难被看见。, archetype: caster, preset: reaper, passive: rage }
        - { name: 苍苔石像鬼, desc: 在雨里泡了几十年，忽然想起自己是有翅膀的。, archetype: tank, preset: guardian, passive: bulwark }
        - { name: 瘴气鹿母, desc: 呼吸带着甜腥，走近的草木都低着头。, archetype: caster, preset: plaguebearer, passive: erode }
    - id: lava
      name: 熔岩洞窟
      desc: 地面滚烫、岩浆在暗处发亮，呼吸都带着硫磺味的灼热迷宫。
      start: 41
      end: 60
      relic_floor: 50
      boss_floor: 60
      power_mult: 1.02
      monsters:
        - { name: 熔岩犬, traits: [strong], desc: 皮毛下透出烧红的裂纹，一步一个焦黑的爪印。, archetype: brute, stats: { atk: 1.3, spd: 1.15 } }
        - { name: 火甲虫, traits: [tough], desc: 甲壳像烧过头的陶片，撞上去时反震得手发麻。, archetype: tank, stats: { hp: 1.1, def: 1.5, spd: 0.6 } }
        - { name: 灰烬幽魂, traits: [swift, thin, undying], desc: 一团没烧干净的灰，飘过时带走的都是皮肤上的水分。, archetype: swift, stats: { hp: 0.75, spd: 1.3 } }
        - { name: 岩浆史莱姆, traits: [leech, regen], desc: 吞下石块后体内会亮起橘红的光，贴着它就会被烫掉一层。, archetype: tank, stats: { hp: 1.35, spd: 0.65 } }
        - { name: 烈焰秃鹫, traits: [swift, crit], desc: 俯冲时拖出的火尾，能在地面烧出一道焦线。, archetype: swift, stats: { atk: 1.25, spd: 1.3, hp: 0.85 } }
        - { name: 赤鳞蜥, traits: [thorns, volatile], desc: 鳞片边缘全是凝固的熔渣，抓上去比抓刺猬还糟。, archetype: tank, stats: { def: 1.45, hp: 1.1, spd: 0.7 } }
        - { name: 硫磺喷兽, traits: [strong], desc: 鼓胀的囊袋里全是硫磺气，喷出来时连石头都在冒烟。, archetype: caster, stats: { hp: 1.2, spd: 0.75 } }
