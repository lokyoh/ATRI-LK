# 商店 = 遗物商店（原道具下架）：
#   · 每层货架 3 件遗物 = 普通 1 + 稀有 1 + 商店专属 1（本区域/全局池按 seed 抽、排除本局已持有）
#   · 可刷商店的层按 chance 逐层判定（区域级 seed，可复现），不再每层必出；
#     区域前 5 层（no_before_gap）不刷
#   · 一旦本层刷出，商店必定占三选一的第 1 个名额（不参与事件概率抽取）
#   · 遗物只在本局生效；价格按 rarity 由 tier_price 统一定
#   · **可刷层按楼层构成算**：遗物层 / 补给层 / 首领层这三种固定内容层不刷商店；
#     精英守门层（exclude_elite_gate，默认第 18 层）默认也不刷——那一层的职责是
#     打首领前的最后一道精英消耗，再叠一个商店会让单层里出现互相冲突的决策。
#   · 一个区域的 20 层里，普通层只有 17 个，且被第 10 层遗物层劈成 6-9 / 11-18 两段：
#     保底（gap_guarantee）只在**段内**计算，绝不跨段；min_per_region 兜底整区。
shop:
  no_before_gap: 5        # 区域前 5 层（start … start+4）不出现商店
  chance: 0.25            # 可刷商店的层逐层判定的出现概率（seed 可复现）
  exclude_elite_gate: true  # 精英守门层（end - elite.guaranteed_offset，默认第 18 层）不刷商店
  gap_guarantee: 0        # 段内间隔保底：同一连续段内距上个商店超过 N 层就强制补（0 = 关）
  min_per_region: 1       # 每区域至少刷出的商店数（0 = 关）；消灭「整区一个商店都没有」
  stock_tiers: [normal, rare, shop]
  tier_price: { normal: 25, rare: 60, shop: 50 }

# 普通层三选一的生成规则（首领层 / 补给层 / 遗物层不适用，它们各自只有唯一内容）：
#   1. 商店规则优先：允许出现的层（shop.no_before_gap 之后）按 shop.chance（0.25）
#      逐层判定，不再每层必出；一旦刷出则占**第 1 个名额**，先于事件判定定下来，
#      不参与概率抽取；
#   2. 事件判定：剩下的名额按顺序用 event_chance 逐个判定（0.1 / 0.2 / 0.3），
#      **顺序判定、只会出现一个事件**——一旦命中就停止，后面的选项直接成为战斗。
#      因此第 1 位命中即 10%，第 2 位 90%×20% = 18%，第 3 位 90%×80%×30% = 21.6%；
#      无商店的层总事件率 ≈ 1 - 0.9×0.8×0.7 = 49.6%，有商店的层 ≈ 1 - 0.9×0.8 = 28%；
#   3. 战斗位：普通层从 region.monsters、精英层从 region.elites 抽**互不相同**的敌人填满
#      （同一层的几条战斗路线不会是同一只怪）。抽取方式是**区域级牌堆**：把该区域
#      敌人池用区域级 seed 洗开，按层顺序一路发牌、发完重洗——相邻两层几乎不会撞同一只怪
#      （实测相邻层重叠率 14.2% → 7.4%），且每区域出现的不同敌人数量不变；
#      精英遭遇的概率/保底规则不变，只改层内各战斗位的抽取方式；
#   4. 排列：生成顺序即展示顺序（商店第 1 位、其余顺延），不再打乱。
floor_choice:
  option_count: 3                  # 普通层选项数
  event_chance: [0.1, 0.2, 0.3]    # 除商店外的选项依次判定事件的概率（只出一个事件）

rewards:                  # 成就点（§12.2：按到达层数结算，写入 PETREINCARNATION）
  per_floor: 2            # 到达每层
  boss_bonus: 10          # 每通关一个区域首领（不限首通）
  clear_bonus: 200        # 通关第 100 层的大奖
  battle_exp: true        # 战斗经验随结算写回宠物 exp

# 区域首领首通解锁的专属奖励（首通记录存 PETROGUE，已解锁的不重复发放）。
# key = 首领层号（20/40/60/80/100）；type = equipment / title。
# **技能奖励不走这里**：每阶段的精英首通 / 首领首通技能见下方 stage_skill_rewards。
boss_unlocks:
  "20":
    type: equipment
    slot: ring
    item: { name: 守塔者之戒, bonus: { atk: 5 } }
  "60":
    type: equipment
    slot: armor
    item: { name: 霜纹胸甲, bonus: { def: 8 } }
  "100":
    type: title
    title: 五域统御

# 每阶段（= 塔的每个区域）2 个技能奖励：首次击败该区域**精英**、首次击败该区域
# **首领**各 1 个。id 必须存在于 skills.yaml（来源标记为 rogue，跨轮回保留）。
# 首通记录沿用 PETROGUE.UNLOCKED，键为 "elite:<区域id>" / "boss:<区域id>"，幂等不重复发放。
stage_skill_rewards:
  plains:
    elite: rogue_slash
    boss: boss_plains_guard
  forest:
    elite: elite_forest_venom
    boss: boss_forest_whisper
  lava:
    elite: elite_lava_magma
    boss: boss_lava_core
  frost:
    elite: elite_frost_lance
    boss: boss_frost_throne
  abyss:
    elite: elite_abyss_rend
    boss: boss_abyss_crown
