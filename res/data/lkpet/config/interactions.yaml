# 互动效果。喂食自 2026-10-16 起不再区分食物：饱食恢复取 effects.feed.hunger 固定值。
# （字段名沿用 hunger 这个历史键：它表示「饱食」值，越大越饱，存量数据无需迁移。）
# 喂食/玩耍/洗澡/休息 的好感收益统一为 3d10（见下方 affection_roll）。
#
# 2026-10-18 平衡：训练原先「2 行动点 + 饱食 -15 / 疲劳 +15 / 心情 -10」，
# 一次训练连同补状态的实际开销约 4.25 行动点，10 点/天只够练 2.35 次。
# 本次**不动行动点消耗**，只下调训练消耗、上调四项状态回复：
#   常规照护下约 2.35 → 3.03 次/天（+29%），经验约 +49%。
# 训练消耗按 2/3 缩放（-15→-10、+15→+12、-10→-7），四项回复各上调约 1/4。
#
# 训练资源门槛：训练必须确保练完之后仍有余粮——饱食 / 心情不会掉到照护线以下、
# 疲劳不会越过照护上限，否则整条指令直接拒绝并提示先补哪一项（见 core/interaction.py
# 的 check_train_resources）。门槛只作用于训练，其余互动不受影响。
# requirements 三项留空/删掉时，默认取 daily.yaml 的 affection_decay.thresholds
# （好感衰减的照护线）——两处同源，练完不会刚好掉出照护线。

effects:
  feed: { hunger: 38, mood: 0 }
  play: { mood: 13, fatigue: 8 }
  bathe: { cleanliness: 38, mood: -4 }
  rest: { fatigue_recover: 25, mood: 7 }
  train:
    hunger: -10      # 训练消耗饱食（原 -15）
    fatigue: 12      # 训练增加疲劳（原 +15）
    mood: -7         # 训练降低心情（原 -10）
    requirements:      # 训练「结束后」必须仍然满足的区间，任一项不满足就拒绝训练
      hunger_min: 30   # 饱食下限；删掉这一行则回落到 daily.yaml 的照护阈值
      mood_min: 30     # 心情下限
      fatigue_max: 80  # 疲劳上限
    exp_base: 500    # 基础经验值
    exp_tiers:       # 根据肉鸽最高层数动态调整经验
      - { floor: 0, exp: 500 }
      - { floor: 21, exp: 1000 }
      - { floor: 41, exp: 2000 }
      - { floor: 61, exp: 5000 }
      - { floor: 81, exp: 10000 }
      - { floor: 100, exp: 20000 }

affection_roll:
  count: 3
  sides: 10
