# 肉鸽遗物（任务书 §12）：**只在本局生效**（存 run 内，结算随 run 清空）。
# PETROGUE.RELICS 保留作「见过的遗物」图鉴（含 Boss 专属），不再提供加成。
#
# rarity 分类：
#   normal  普通——遗物奖励层三选一从普通池抽取
#   rare    稀有——商店「稀有」位（原 50 件中效果最强的 15 件升格）
#   shop    商店专属（20 件）——只在商店出现
#   event   事件专属（10 件）——由指定事件掉落（rogue_events.yaml 的 effect.relic）
#   boss_only: true  Boss 专属（15 件）——击杀对应 Boss 获得（roguelike.yaml bosses[].relic）
#
# effect 键（只作用于肉鸽，不改养成数据）：
#   atk / def / spd / mp / max_hp  战斗属性（max_hp 获得时立即抬局内上限并回血）
#   crit_rate                      暴击率（倍率见 battle.crit_mult）
#   coins_mult / exp_mult          掉落与经验乘区
#   shop_discount                  商店价格乘区（<1 更便宜；多件**乘算**叠乘）
#   vs_boss_mult                   对首领/精英伤害乘区
#   boss_heal                      击杀首领后回复的局内生命
# 价格由 rogue.yaml 的 shop.tier_price 按 rarity 定（normal / rare / shop），
# 实际成交价 = 基础价 × 本局所有 shop_discount 的**乘积**（商店展示同此口径）。

