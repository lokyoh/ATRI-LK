# 敌方形态（阶段）：首领/精英生命跌破 at_hp 比例时触发一次，按顺序检查、各自只触发一次。
#   name       形态名（战报展示）
#   at_hp      触发阈值：当前生命 / 生命上限 ≤ at_hp
