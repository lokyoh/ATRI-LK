  e_meteor:      { name: 陨火坠击, desc: 火雨在头顶聚成一枚坠星。, power: 84, mp_cost: 42, charge: 3, interrupt: 0.2, cooldown: 4, priority: 5, unactionable: 1.5 }
  e_annihilate:  { name: 湮灭之息, desc: 光与声先被吸走，然后才是爆裂。, power: 90, mp_cost: 48, charge: 3, interrupt: 0.22, cooldown: 4, priority: 6, unactionable: 1.5 }
  # —— 状态与削弱系 ——
  e_venom_sting: { name: 毒刺, desc: 尾针注入的毒会在血管里慢慢走。, power: 27, mp_cost: 8, cooldown: 2, priority: 2,
