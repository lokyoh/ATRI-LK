  # 【群攻型技能】strikes 更多，配合 crit/leech 打爆发
  e_storm_rake:   { name: 风暴撕裂, desc: 四道爪影几乎同时落下。, power: 18, mp_cost: 26, strikes: 4, cooldown: 3, priority: 4, crit_rate: 0.15 }
  e_blood_whirl:  { name: 血旋, desc: 转起来的时候，四周的东西都在往外甩。, power: 16, mp_cost: 30, strikes: 5, cooldown: 4, priority: 4, leech: 0.25 }
  e_mirror_edge:  { name: 镜刃, desc: 每一道反光都可能是一刀。, power: 22, mp_cost: 24, strikes: 3, cooldown: 3, priority: 4, crit_rate: 0.3 }

# 敌方形态（阶段）：首领/精英生命跌破 at_hp 比例时触发一次，按顺序检查、各自只触发一次。
#   name       形态名（战报展示）
#   at_hp      触发阈值：当前生命 / 生命上限 ≤ at_hp
#   *_mult     该形态施加的自身属性乘区（永久）
#   heal       触发时回复自身生命上限的比例
#   add_skills 追加技能（写入该单位的技能表）
enemy_phases:
  ph_enrage:     { name: 暴怒, at_hp: 0.5, atk_mult: 1.25, spd_mult: 1.1, add_skills: [e_rage] }
  ph_berserk:    { name: 狂乱, at_hp: 0.3, atk_mult: 1.4, def_mult: 0.9, add_skills: [e_triple] }
  ph_guard:      { name: 坚壁, at_hp: 0.6, def_mult: 1.3, add_skills: [e_harden] }
  ph_swift:      { name: 疾走, at_hp: 0.5, spd_mult: 1.25, add_skills: [e_haste] }
  ph_undying:    { name: 不灭, at_hp: 0.25, heal: 0.08, def_mult: 1.2, add_skills: [e_mend] }
  ph_desperate:  { name: 垂死挣扎, at_hp: 0.2, atk_mult: 1.5, heal: 0.05 }
  # —— 追加形态组 ——
  # 三个方向：更早的预警形态（高阈值）、带召唤的转阶段、以及专门给三阶段首领用的中段形态。
  ph_awaken:     { name: 苏醒, at_hp: 0.75, atk_mult: 1.1, spd_mult: 1.05 }              # 早段预警，只小幅强化
  ph_frenzy:     { name: 沸腾, at_hp: 0.45, atk_mult: 1.2, spd_mult: 1.15, add_skills: [e_mirror_edge] }
  ph_bulwark:    { name: 铁壁, at_hp: 0.65, def_mult: 1.4, spd_mult: 0.9, add_skills: [e_harden] }
  ph_regen:      { name: 增生, at_hp: 0.5, heal: 0.1, def_mult: 1.15, add_skills: [e_reknit] }
  ph_swarmlord:  { name: 巢母, at_hp: 0.55, heal: 0.06, add_skills: [e_summon_spider] }   # 转阶段叫援军
  ph_necro:      { name: 招魂, at_hp: 0.4, def_mult: 1.1, add_skills: [e_summon_shade] }
  ph_plague:     { name: 疫变, at_hp: 0.5, atk_mult: 1.15, add_skills: [e_plague] }       # 转阶段上 DoT
  ph_last:       { name: 终末, at_hp: 0.12, atk_mult: 1.6, spd_mult: 1.2, heal: 0.05 }    # 残血爆发

