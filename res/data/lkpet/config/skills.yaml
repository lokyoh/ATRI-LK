# 技能系统（主动 / 被动 + 收集池 + 装备槽）
#
# 结构总览
#   · ``skills``  技能定义表（**列表**，每条带稳定的 ``id``）
#   · ``pools``   发放池：开局 / 常规 / 轮回。肉鸽阶段奖励池在 roguelike.yaml 的
#                 ``stage_skill_rewards``（id 引用本表）
#   · ``grants``  等级里程碑与轮回抽取规则
#   · ``limits``  装备槽、熟练度参数
#
# 收集池 vs 装备槽
#   ``pet.skills``          已掌握的技能库（收集池，无上限，只增不减）
#   ``pet.skill_equipped``  当前装备的技能（主动 / 被动各至多 limits.*_slots 个）
#   战斗与被动加成**只结算装备中的技能**；未装备的留在技能库里，随时可换。
#
# 技能来源（决定「轮回时保留什么」）
#   starter        开局技能（每世开局都发，见 pools.starter）
#   regular        常规技能（每 5 级 1 个主动 / 每 10 级 1 个被动，轮回时清空）
#   reincarnation  轮回技能（满级轮回额外抽取，**跨世保留**）
#   rogue          肉鸽阶段奖励（首次击败精英 / 首领，**跨世保留**）
#   来源由池子归属推导，不在技能条目里重复声明。
#
# === id 约定（重要）===
#   每条技能的 ``id`` 是**稳定引用**：旧存档的收集池、肉鸽奖励、配置里的池子列表
#   都靠它引用。要重做某个技能的内容（改名、改数值、甚至改主动/被动类型）时，
#   **保留同一个 id** 即可，玩家已掌握的那个技能会就地变成新内容，不会凭空消失。
#   新增技能才需要新 id。id 里刻意用到的历史命名（如 rogue_slash）同样不能再改。
#
# === 主动技能字段 ===
#   power      伤害系数基准，实际伤害 = 普攻伤害 × power / 30（30 = 一次普通攻击）
#   strikes    出击次数（每次独立结算，默认 1）
#   leech      吸血比例：造成伤害按此比例回复局内生命
#   mp_cost    消耗局内 MP
#   cooldown   冷却，单位 = 计时条周期（计时条每轮 +10，满 100 全体冷却 -1）
#   target     single / self（self 目前仅用于治疗类）
#   effects    [{ type: heal, amount }] 回血（要求 power: 0）｜[{ type: mp, amount }] 回蓝
#
# === 被动技能字段 ===
#   effect     战斗加成，可用键：atk / def / spd / mp / max_hp / crit_rate / dmg_mult
#              atk/def/spd/mp 加在入场战斗属性上，max_hp 加在局内生命上限上，
#              crit_rate 为我方暴击率（倍率见 roguelike.yaml battle.crit_mult），
#              dmg_mult 为我方输出乘区（0.1 = +10%）。
#              多个被动叠加为平值相加。

limits:
  active_slots: 4          # 主动装备槽
  passive_slots: 4         # 被动装备槽
  proficiency_gain: 0.01   # 每施放一次涨的熟练度
  proficiency_max: 1.0
  proficiency_power_bonus: 0.3   # 熟练度满时的威力加成上限（+30%）

grants:
  active_every: 5          # 每 5 级从 pools.regular.active 抽 1 个主动
  passive_every: 10        # 每 10 级从 pools.regular.passive 抽 1 个额外被动
  reincarnation_draw: 1    # 满级轮回时从 pools.reincarnation 额外抽取 1 个技能
  # 满级判定沿用 reincarnation.yaml 的 max_level，不在这里重复配置。

pools:
  # 开局技能：每世（创建 / 轮回后）开局必得，与旧版行为一致。
  starter: [tackle]

  # 常规池：等级里程碑的发放来源。池内技能强度刻意拉平（威力 30-60），
  # 差异体现在耗魔、冷却与功能（多段 / 吸血 / 回血 / 回蓝），抽到哪个都不亏。
  regular:
    active:
      - tackle
      - fireball
      - break_strike
      - heal
      - heavy_slash
      - mana_bolt
      - pierce
      - twin_fangs
      - whirl
      - flame_wave
      - ice_shard
      - thunder_clap
      - stone_fist
      - wind_blade
      - shadow_cut
      - venom_spit
      - drain_bite
      - mend_light
      - mana_flow
      - last_stand
    passive:
      - iron_will
      - iron_wall
      - wind_blood
      - mana_spring
      - giant_heart
      - battle_instinct
      - tough_skin
      - sharp_claw
      - swift_step
      - deep_breath

  # 轮回池：满级轮回时额外抽取，且**跨世保留**。强度明显高于常规池。
  reincarnation:
    active:
      - sam_soul_cleave
      - sam_void_pierce
      - sam_starfall
      - sam_blood_ritual
      - sam_phoenix
      - sam_tempest
      - sam_eternal_blade
      - sam_aether_bolt
      - sam_life_drain
      - sam_judgment
    passive:
      - sam_might
      - sam_bulwark
      - sam_wind
      - sam_spring
      - sam_heart
      - sam_eye
      - sam_bond
      - sam_memory
      - sam_unyielding
      - sam_swift

