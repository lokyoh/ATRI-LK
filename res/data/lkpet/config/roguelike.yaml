        skills: [e_ice_lance, e_frost_nova], skills: ["e_ice_lance", "e_frost_nova", "e_reknit"], phases: ["ph_bulwark", "ph_undying", "ph_last"] }
    - { name: 极光巫妖, desc: 法袍上的极光缓缓流动，指尖悬着不化的冰晶。, relic: rel_b12, hp_mult: 3.5, atk_mult: 2.4, def_mult: 1.3, spd_mult: 1.3, coins: [230, 290], exp: 1520,
