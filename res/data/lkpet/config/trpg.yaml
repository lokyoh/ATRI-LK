# 跑团配置（任务书 §13，COC 风格 d100）。文案见 texts.yaml 的 trpg 块；
# 章节剧情在 trpg_chapters.yaml（chapters.file 指向它）。
# 跑团属性与技能存 PETTRPG 表，与养成五维互不覆盖、互不换算。

attributes:
  dice_count: 3
  dice_sides: 6
  multiplier: 5          # 3d6 × 5 → 区间 15–90
  rerolls: 1             # 建卡时整体重掷的可用次数
  order: [STR, CON, DEX, POW, INT, APP]
  names:
    STR: 力量
    CON: 体质
    DEX: 敏捷
    POW: 意志
    INT: 智力
    APP: 外貌

derived:                 # 派生值 = floor(base + Σ per[attr] × 属性)
  hp:   { base: 10, per: { CON: 0.2 } }
  mp:   { base: 5,  per: { POW: 0.2 } }
  move: { base: 5,  per: { STR: 0.03, DEX: 0.03 } }

skills:                  # 百分比技能；base 固定初始值，per 按六维派生（floor）
  侦查:   { base: 25 }
  聆听:   { base: 20 }
  说服:   { base: 10 }
  攀爬:   { base: 40 }
  图书馆: { base: 20 }
  射击:   { base: 20 }
  医学:   { base: 15 }
  神秘学: { base: 5 }
  生存:   { base: 10 }
  闪避:   { base: 0, per: { DEX: 0.5 } }

check:
  critical: 1            # 掷出 1 → 大成功
  hard_scale: 0.5        # 困难成功 ≤ 技能 × 0.5
  extreme_scale: 0.2     # 极难成功 ≤ 技能 × 0.2
  fumble_at: 100         # 技能 ≥ 50 时，掷出 100 → 大失败
  fumble_skill_below: 50 # 技能 < 50 时，96–100 均为大失败

growth:                  # 成长检定：d100 > 当前技能值 → +1d10
  gain_die: 10
  cap: 95

forms:
  party:
    min_members: 2
    max_members: 5
  short:
    max_minutes: 30      # 单场短团本时长上限，超时自动散团（无通关奖励）

chapters:
  file: trpg_chapters    # 章节剧情所在配置名（config_loader 加载 trpg_chapters.yaml）
  order: [c_manor, c_well, c_lighthouse, c_train, c_market]   # 单人剧情线：共 5 个剧本，按序推进
  party_ids: [p_inn, p_caravan, p_temple]                      # 多人（组队）剧本：共 3 个，开团时随机取一
  short_ids: [c_tunnel]      # 短团本候选（short: true 的章节）

rewards:                 # 通关发放的轮回成就点（写入 PETREINCARNATION）
  solo_chapter: 15
  short_run: 8
  party_member: 12

daily_limits:            # 每日次数限制（防刷）：key 为统计槽，按服务器自然日重置
  short: 2               # 短团本每日通关上限（每成员）
  party: 2               # 组队团每日通关上限（每成员）
