                   self_buff: { spd_mult: 1.2 } }
  # —— 召唤系 ——
  e_summon_spider: { name: 召唤蛛群, desc: 腹囊抖落出一地幼蛛。, power: 0, mp_cost: 24, cooldown: 4, priority: 6,
                     summon: { name: 幼蛛, desc: 刚孵化就学会了咬人。, count: 2, hp_mult: 0.06, atk_mult: 0.5, def_mult: 0.5, spd_mult: 1.2 } }
  e_summon_bat:    { name: 召唤蝠群, desc: 翼影从洞顶泼下来。, power: 0, mp_cost: 30, cooldown: 4, priority: 6,
                     summon: { name: 灰烬蝠, desc: 抖落的粉尘还带着火星。, count: 3, hp_mult: 0.05, atk_mult: 0.45, def_mult: 0.4, spd_mult: 1.4 } }
