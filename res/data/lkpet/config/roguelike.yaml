  e_cataclysm:    { name: 天倾, desc: 头顶的东西开始往下压，压力先到，声音后到。, power: 96, mp_cost: 54, charge: 4, interrupt: 0.14, cooldown: 5, priority: 7, unactionable: 2.0 }
