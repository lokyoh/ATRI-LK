        - { name: 塔底守望者, traits: [strong, tough], desc: 从第一层就站在那儿，一直没换过姿势。, archetype: brute, stats: { hp: 1.35, atk: 1.4, def: 1.35, spd: 0.55 } }
        - { name: 沉星祭坛兽, traits: [thick, strong], desc: 趴在祭坛上的东西，祭坛早被它压塌了。, archetype: brute, stats: { hp: 1.5, atk: 1.3, spd: 0.55 } }
      rewards: { coins: 30, coins_per_floor: 4, exp: 560, exp_per_floor: 20 }
      shop: { heal_mult: 15 }
      elites:
        - { name: 虚空之眼, traits: [crit], desc: 悬浮的巨眼，瞳孔里倒转着星光。, archetype: caster, stats: { hp: 0.9, atk: 1.4 }, skills: ["e_void_gaze", "e_mana_burn"], phase: ph_awaken, passive: siphon }
        - { name: 星坠猎犬, desc: 由陨屑拼成的猎犬，奔跑时拖出火尾。, archetype: swift, preset: evasive, passive: rage }
        - { name: 裂魂双子, desc: 共享一具身体的两个影子，各朝一方拉扯。, archetype: swift, preset: necromancer, passive: siphon }
        - { name: 深渊灯水母, desc: 伞盖下的光是诱饵，触须垂进虚无。, archetype: caster, preset: plaguebearer, passive: erode }
        - { name: 影噬巨口, traits: [thick], desc: 没有身体，只有一张缓缓张开的嘴。, archetype: brute, stats: { hp: 1.55, atk: 1.4, def: 1.2, spd: 0.5 }, skills: ["e_annihilate", "e_devour"], phase: ph_berserk, passive: rage }
        - { name: 万籁执笔人, traits: [crit], desc: 记录每个登塔者的结局，写到你时停了笔。, archetype: caster, stats: { hp: 0.85, atk: 1.35 }, skills: ["e_void_gaze", "e_oblivion"], phase: ph_last, passive: erode }
        - { name: 逆时巨像, desc: 每挡住一次攻击，它就年轻一分。, archetype: tank, preset: juggernaut, passive: bulwark }

# ===========================================================================
# 怪物模板：**1 级基准 + 每级成长**，怪物等级 = 层号。
#
# 设计口径（与 pet.yaml 的 base_attributes / growth 同一套公式）：
#   属性 = base[stat] + growth[stat] × 怪物等级
# 于是「第 N 层的怪就是 N 级」，与宠物等级可以直接对比——
# 战斗里的等级差修正因此有了明确含义（见 battle.level_power）。
#
#   tier        层级：normal / elite / boss。**类型决定数值**（倍率与基础值）
#   archetype   定位：swift / tank / brute / caster / balanced。**定位决定成长方向**
#               （把成长值在 hp/atk/def/spd 之间温和偏移，不改变总量）
#   stats       **单只怪的特色覆盖**（可选，写在 monsters[]/elites[] 的条目里）：
#               stats: { hp: 1.4, atk: 0.7, def: 0.9, spd: 1.3 }
#               以倍率形式乘在模板面板上，未写的项 = 1.0（不改）。
#               与 archetype 的分工：
#                 archetype = 同类共享的成长方向（粗粒度，决定曲线形状）
#                 stats     = 这一只怪自己的特色（细粒度，只影响它自己）
#               例：『野蛮蜂群』血量薄、速度快 → stats: { hp: 0.7, spd: 1.4 }
#                   『稻草傀儡』血厚防高但极慢 → stats: { hp: 1.5, def: 1.3, spd: 0.5 }
#
# 怪物实例 = 1级模板 × archetype 成长方向 × **stats 个体特色**
#          × 区域 power_mult × tier 倍率 × 特点 traits × ±variance
# ===========================================================================

# ===========================================================================
# 精英预设：把「traits + skills + phase + stats」打包成一套可复用的模板。
#
# 精英条目现在动辄四五个字段，同一类战斗定位（狂暴型、守护型、召唤型…）
# 反复出现。预设让精英写成：
#
#   - { name: 狂暴野猪, preset: berserker, desc: "...", archetype: brute }
#
# **合并规则**（后者覆盖前者）：
#   1. 先取 preset 里的 traits / skills / phase / stats；
#   2. 再用条目自己写的同名字段**整体覆盖**（不是追加，避免「预设 2 技能 +
#      条目 2 技能」变成 4 技能这种意外）；
#   3. archetype / name / desc 不受预设影响，永远以条目为准。
# ===========================================================================
monster_presets:
  # —— 输出型 ——
  berserker:    # 狂暴：攻高皮薄，越打越凶
    name: 狂暴
    traits: [strong, fragile]
    skills: [e_rage, e_blood_whirl]
    phase: ph_frenzy
    stats: { atk: 1.35, def: 0.8, hp: 0.95 }
  duelist:      # 决斗者：高暴击多段，靠连续命中压制
    name: 决斗
    traits: [crit, swift]
    skills: [e_mirror_edge, e_haste]
    phase: ph_swift
    stats: { atk: 1.2, spd: 1.2, hp: 0.9 }
  reaper:       # 收割者：吸血 + 裂魂，越拖回得越多
    name: 收割
    traits: [leech, crit]
    skills: [e_soul_reap, e_shadow_brand]
    phase: ph_frenzy
    stats: { atk: 1.25, hp: 1.05 }
  # —— 防守型 ——
  guardian:     # 守护者：血厚防高，转阶段自我修复
    name: 守护
    traits: [tough, thick]
    skills: [e_harden, e_reknit]
    phase: ph_bulwark
    stats: { hp: 1.4, def: 1.5, spd: 0.6 }
  juggernaut:   # 重装：极慢极硬，一记蓄力
    name: 重装
    traits: [thick, slow]
    skills: [e_cataclysm, e_harden]
    phase: ph_bulwark
    stats: { hp: 1.5, def: 1.4, atk: 1.15, spd: 0.4 }
  undying:      # 不死：持续自愈，必须速杀
    name: 不死
    traits: [regen, tough]
    skills: [e_reknit, e_devour]
    phase: ph_regen
    stats: { hp: 1.35, def: 1.2, spd: 0.75 }
  # —— 机制型 ——
  summoner:     # 召唤者：靠援军拖时间
    name: 召唤
    traits: [thick]
    skills: [e_summon_spider, e_summon_bat]
    phase: ph_swarmlord
    stats: { hp: 1.2, atk: 0.9, spd: 0.85 }
  necromancer:  # 招魂者：召分身 + 影袭
    name: 招魂
    traits: [leech]
    skills: [e_summon_shade, e_shadow_raid]
    phase: ph_necro
    stats: { hp: 1.1, atk: 1.15 }
  plaguebearer: # 瘟疫携带者：DoT 叠满
    name: 瘟疫
    traits: [leech, thin]
    skills: [e_plague, e_corrode]
    phase: ph_plague
    stats: { hp: 1.15, atk: 1.1, spd: 0.95 }
  # —— 特殊型 ——
  evasive:      # 飘忽：高闪避 + 多段
    name: 飘忽
    traits: [evasive, swift]
    skills: [e_storm_rake, e_haste]
    phase: ph_swift
    stats: { hp: 0.85, spd: 1.35, def: 0.8 }
  selfdestruct: # 自爆：死后炸一下，血薄
    name: 自爆
    traits: [unstable, fragile]
    skills: [e_inferno_mark, e_mirror_edge]
    phase: ph_last
    stats: { hp: 0.75, atk: 1.3, spd: 1.1 }
  frostbinder:  # 缚霜者：减速控场
    name: 缚霜
    traits: [tough, slow]
    skills: [e_frost_bind, e_frost_nova]
    phase: ph_bulwark
    stats: { hp: 1.25, def: 1.3, atk: 1.05 }
  charger:      # 冲锋者：蓄力撞击
    name: 冲锋
    traits: [strong]
    skills: [e_charge_horn, e_slam]
    phase: ph_awaken
    stats: { hp: 1.2, atk: 1.3, def: 1.1 }

monster_templates:
  # 1 级基准：略低于 1 级宠物（hp101/atk13/def11/spd12），因为小怪常成群出现。
  base: { hp: 44, atk: 7, def: 4, spd: 9 }
  # 每级成长。hp 成长最快（保证后期血量跟得上伤害），spd 最慢（避免出手频率失控）。
  growth: { hp: 6.2, atk: 0.95, def: 0.42, spd: 0.26 }

  # —— 类型：决定数值倍率（在 archetype 之后作用）——
  tiers:
    normal: { hp_mult: 1.0, atk_mult: 1.0, def_mult: 1.0, spd_mult: 1.0,
              reward_coins: 1.0, reward_exp: 1.0 }
    elite:  { hp_mult: 1.6, atk_mult: 1.6, def_mult: 1.6, spd_mult: 1.6,
              reward_coins: 2.0, reward_exp: 2.0 }
    # 首领的倍率来自 bosses[] 的 hp_mult / atk_mult / …（每个首领不同），
    # 这里只放兜底值，避免 bosses 缺字段时没有乘区。
    boss:   { hp_mult: 3.5, atk_mult: 2.0, def_mult: 1.5, spd_mult: 1.2,
              reward_coins: 1.0, reward_exp: 1.0 }

  # —— 定位：决定成长方向（让成长值在四项之间**温和**偏移）——
  # weight 是相对权重，但归一化后按 `archetype_strength` 与原值插值：
  #   growth_new = growth × (1 + strength × (权重 / 平均权重 - 1))
  # strength = 0 表示完全不受定位影响，1 表示完全重分配（会拉出极值，不推荐）。
  # 默认 0.3：定位明显可感，但不会让「迅捷怪」的速度飙到普通怪的两倍。
  #
  # 注意 spd 的权重刻意压得比其它项更紧：速度直接影响 ATB 出手频率，
  # 而且 battle.spd_exponent=0.5 只把收益开方，倍数放大会让高速怪变成墙。
  archetype_strength: 0.3
  archetypes:
    balanced: { name: 均衡, weight: { hp: 1.0, atk: 1.0, def: 1.0, spd: 1.0 } }
    swift:    { name: 迅捷, weight: { hp: 0.82, atk: 0.95, def: 0.72, spd: 1.35 } }
    tank:     { name: 坚韧, weight: { hp: 1.35, atk: 0.78, def: 1.5, spd: 0.68 } }
    brute:    { name: 凶蛮, weight: { hp: 1.12, atk: 1.45, def: 0.82, spd: 0.9 } }
    caster:   { name: 术法, weight: { hp: 0.86, atk: 1.3, def: 0.96, spd: 1.0 } }

  # 属性随机浮动：同一层同一种怪也有强弱差（0.92~1.08 = ±8%）。
  variance: [0.92, 1.08]

elite:
  chance: 0.3              # 候选层逐层判定的概率（区域级 seed，可复现）
  max_per_region: 4        # 每区域至多生成 4 次精英遭遇（保底精英计入其中）
  min_floor_gap: 5         # 区域前 5 层（start…start+4）不生成精英，候选从 start+gap 起
  guaranteed_offset: 2     # end - offset 层必定精英（首领前一层是纯补给层，故保底在倒数第二层）
  stats_mult: 1.6          # 精英 = 当层普通公式 × 1.6（介于小怪与首领之间）
  reward_mult: { coins: 2, exp: 2 }   # 精英掉落倍率（金币/经验）

# 强化精英战斗（事件触发）：事件选项可以写 effect: { elite_fight: {...} }，
# 选中即**立刻进入**一场强化精英战，胜利才继续前进，失败照常结束本局。
#   stat_bonus    在普通精英基础上再乘的属性倍率（1.3 = 再强化 30%）
#   relic         胜利后额外掉落的遗物（固定 id）；写 auto 时从「本局未持有的
#                 普通遗物」里按 seed 抽一件。留空 = 不掉遗物。
#   phases        额外追加的形态 id（取自 enemy_phases），追加在精英自带形态之后
#   skills        额外追加的技能 id（取自 enemy_skills）
#   hp_pct/mp_pct 开战前先回复的当前生命/魔力百分比（给玩家一点缓冲）
#   title         战报标题里显示的强化名（如「狂暴形态」）
#
# 注意：强化精英**不做金币/经验翻倍**——它的回报就是那件遗物。
elite_fight:
  enabled: true
  defaults:
    stat_bonus: 1.3
    relic: auto
    phases: []
    skills: []
    hp_pct: 0.15
    mp_pct: 0.15
    title: 强化形态
  # 可选形态池：事件不指定 phases 时，按区域从本区域的池里抽一个追加形态。
  phase_pool:
    plains: [ph_enrage]
    forest: [ph_swift, ph_guard]
    lava: [ph_enrage, ph_berserk]
    frost: [ph_guard, ph_undying]
    abyss: [ph_berserk, ph_desperate]

# 精英专属机制（elite_passives）
# ---------------------------------------------------------------------------
# 精英与普通小怪的区别不只是「血厚、技能多」：带 passive 的精英在**整场战斗**
# 里持续施加一种压力，让玩家一眼认出「这只不好打」。与怪物特点（monster_traits）
# 的分工：
#   * monster_traits 是**被动数值/行为**，小怪也能有，随机性弱、几乎不播报；
#   * elite_passives 是**战斗机制**，只有精英（及事件强化的精英）会带，每个回合/
#     每次受击都会在战报里留痕，玩家能复盘「为什么这场输了」。
# 数值全部在这里；elites[].passive 只写 id，展示用名称与说明在 texts.yaml 的
# rogue.elite_passives / rogue.elite_passive_desc。
#   rage    受击叠怒：每次被命中 +1 层，攻击按层数线性提高（封顶 max_stacks）
#   siphon  抽蓝：**开场一次 + 每个回合结束各一次**，抽走我方 pct% 魔力上限
#           （至少 min 点）并转成自身魔力
#   bulwark 护盾：入场带着生命上限 pct% 的护盾，先扣护盾再扣生命，护盾不回补
#   erode   蚀骨：它**每次行动**都剥掉一层我方护甲，每层防御 ×(1 - def_per_stack)
#
# 配平口径（重要）：一场精英战通常只有 **1 个回合**左右（ATB 一回合 10 帧，
# 双方各出手 4~6 次），很多战斗跑不满 10 帧就结束了。所以：
#   * 只在「回合结束」触发的机制会几乎不出现 —— 抽蓝因此额外补了一次开场抽取，
#     蚀骨改成挂在「它的每次行动」上；
#   * 数值是按「一场只触发 1~3 次」定的。想让某条机制更有存在感，先调数值，
#     不要改成「每次出手都触发」，否则一场 5 次出手会连报 5 行同样的日志。
elite_passives:
  rage:
    atk_per_stack: 0.08
    max_stacks: 5
  siphon:
    pct: 0.15
    min: 4
  bulwark:
    pct: 0.15
  erode:
    def_per_stack: 0.15
    max_stacks: 3

# 怪物特点：数值乘区/行为参数全部外置在这里（展示用中文标签在 texts.yaml 的 rogue.traits）。
# region.monsters[].traits 列 0-2 个特点 id；没有特点的怪不显示标注。
#   *_mult        该属性乘区（特点在精英/首领倍率**之前**作用）
#   crit_rate     敌方暴击概率（倍率沿用 battle.crit_mult）
#   leech         吸血：造成损害的回复比例（封顶自身生成时生命）
#   thorns        棘刺：我方打出的伤害按比例反弹到局内生命
#   pack          **真正的一群**：拆成 count 只独立单位，各自一条命、各攒各的攻击条
monster_traits:
  # 群怪**不是一个共用血条**，而是场上真的站着 count 只：我方一次只能打掉其中一只，
  # 其余仍在，它们各自按自己的速度攒条、各自出手。带技能的单位（精英/首领）不拆分。
  #   count      分裂只数（再受 battle.max_units 约束；被压到 1 时退化为普通单体）
  #   hp_share   群体**总**生命 = 当层公式生命 × hp_share，再平摊给每一只
  #   *_mult     每只的个体属性乘区
  # 输出口径：每只攻击 ×0.4、共 3 只各自独立行动 → 群体总输出约为单体的 1.2 倍，
  # 比普通怪凶一点，但可以被逐只蚕食掉（打死的不会再出手）。
  swarm:
    pack: { count: 3, hp_share: 0.9, atk_mult: 0.4, def_mult: 0.8, spd_mult: 1.0 }
  thick:   { hp_mult: 1.35 }
  thin:    { hp_mult: 0.7 }
  strong:  { atk_mult: 1.3 }
  dull:    { atk_mult: 0.75 }
  tough:   { def_mult: 1.5 }
  fragile: { def_mult: 0.6 }
  swift:   { spd_mult: 1.3 }
  slow:    { spd_mult: 0.7 }
  crit:    { crit_rate: 0.25 }
  leech:   { leech: 0.3 }
  thorns:  { thorns: 0.2 }
  # —— 动态机制特点（需要引擎支持，与上面纯数值的不同）——
  #   dodge        闪避率：我方对它的每次命中都有这个概率落空
  #                （落空不造成伤害、不计打断累积、不触发棘刺反弹）
  #   regen_pct    每回合回复**生命上限**的这个比例（按回合结算，不按出手）
  #   death_burst  被击倒时对我方造成 自身攻击 × 本值 的伤害；
  #                **不致死**（最多压到 1 血），与 DoT/棘刺同一口径
  dodgy:   { dodge: 0.2 }
  evasive: { dodge: 0.35, hp_mult: 0.8 }
  regen:   { regen_pct: 0.06 }
  undying: { regen_pct: 0.1, spd_mult: 0.85 }
  volatile: { death_burst: 0.6 }
  unstable: { death_burst: 1.0, hp_mult: 0.75 }

supply:
  floor_offset: 1          # end - offset 层（首领前一层）**唯一选项就是回血补给**（不再有三选一）
  event:
    id: supply_cache
    text: >
      首领战前的补给点：墙龛里堆着绷带、药膏与半壶温热的肉汤——前人留下的应急储备，
      盖子上用木炭写着「给还活着的人」。
    choices:
      - { text: 痛饮热汤回复生命, effect: { run_hp: 60, run_mp_pct: 0.5 } }
      - { text: 仔细包扎处理伤口, effect: { run_hp: 40, exp: 20, run_mp: 20 } }
      - { text: 打包带走干粮和药, effect: { coins: 15, run_hp: 20, run_mp_pct: 0.35 } }

battle:
  # 回合上限：超过即判平局（按到达层数结算）。单位是**回合**，不是内部帧：
  # 1 回合 = 计时条走满一次 = 100 / timer_gain = 10 帧。实测绝大多数战斗
  # 只跑 2-12 帧（不到 2 回合），这个上限只用于兜住异常僵持。
  max_rounds: 500
  variance: [0.85, 1.15]  # 伤害浮动区间
  # 防御减伤：**百分比减伤**，减伤率 = def / (def_softness + def)
  #   伤害 = atk × def_softness / (def_softness + def) × 浮动
  # def_softness 是「减伤 50% 所需的防御值」（n/(n+def) 里的 n）：
  #   · def = 100 时减伤 50%、保留 50% 伤害
  #   · def = 177（深渊首领）时减伤 64%
  #   · def = 70（满级宠物）时减伤 41%
  #   · 防御越高收益越小，但永远到不了 100%（不会无敌）
  # 旧公式是线性相减 atk - def × 0.5，等效减伤率随攻击力变化：
  # 攻击越高防御越没用（深渊首领只有 10%），前期攻击低时又会把伤害
  # 压到 1 点下限（小怪几乎打不动宠物）。改百分比后防御价值与攻击力解耦。
  def_softness: 100
  # 等级战力：**等级进入战斗公式**，让「练级」真的变强，而不是只靠遗物与技能。
  # 怪物等级 = 层号（见 monster_templates），所以这里就是**双方等级直接对比**：
  #   我方输出乘区 = 1 + (宠物等级 - 怪物等级) × atk_per_level
  #   我方承伤乘区 = 1 / (1 + (宠物等级 - 怪物等级) × def_per_level)   ← <1 表示更耐打
  # 两个乘区都钳制在 [min_mult, max_mult]。
  #
  # 参考（怪物 80 级）：
  #   18 级（差 -62）→ 输出 ×0.50(下限)、承伤 ×1.90(上限)  ← 明显的墙
  #   50 级（差 -30）→ 输出 ×0.70、承伤 ×1.44
  #   80 级（差   0）→ 输出 ×1.00、承伤 ×1.00            ← 持平
  #   100 级（差 +20）→ 输出 ×1.20、承伤 ×0.86          ← 练级有回报
  # 乘区在**入场时算一次**并固定：局内升级不会临时变强，避免刷级流。
  level_power:
    enabled: true
    atk_per_level: 0.01        # 每高于怪物 1 级，输出 +1%
    def_per_level: 0.012       # 每高于怪物 1 级，耐打 +1.2%
    min_mult: 0.5              # 乘区下限（低于此不再更差，避免低级完全打不动）
    max_mult: 1.9              # 乘区上限（避免高等级无脑碾压）
    apply_to: both             # both / atk / def：只影响我方，敌方不吃这个乘区
  # 攻击条机制（ATB）：取 100 为个人攻击条上限，每**帧**按速度攒
  #   gauge_rate_mult × spd ** spd_exponent 点
  # 先满者出击（-100），同帧都满时速度快者先动——速度值决定出击频率。
  # 注意「帧」是内部时钟：入场前几帧可能无人攒满，所以对外展示的回合数
  # 按 100 / timer_gain 帧折算，不能直接把帧号当回合。
  #
  # spd_exponent 是**速度收益曲线**：1.0 = 线性（旧行为，速度翻倍出手也翻倍，
  # 后期完全失控），0.5 = 开平方（速度翻 4 倍才让出手频率翻倍）。
  # 默认 0.5，让整体呈现「增长变慢」的趋势：
  #   spd 12 → 22 → 33 → 44 → 55 → 66 → 77
  #   出手 4  →  5 →  6 →  7 →  8 →  9 → 10   次/回合（系数 12 时）
  # 行动条**不封顶**：攒够 200 点同一帧可以连动两次，多出的点数不会丢失。
  gauge_rate_mult: 12
  spd_exponent: 0.5
  # 战斗计时条：每帧结束固定 +timer_gain，满 100 触发「计时条满」：
  # 所有技能剩余冷却 -1、计时 Buff 剩余时长 -1（预留），随后计时条清零。
  # 满一次 == 一个「回合」，故 frames_per_turn = 100 / timer_gain（默认 10）。
  timer_gain: 10
  # 暴击倍率：被动技能 crit_rate 命中时我方输出 × crit_mult
  crit_mult: 1.8
  # 逐回合战报：战斗日志最多回放的条数（取最后 N 条）。
  # 定为 10 条，既能看清关键几手（打断、形态、击杀），又不会把消息刷得太长。
  # 设 0 = 完全不显示逐条战报（只留标题、描述、节奏与结果）。
  log_limit: 10
  # 场上敌人数量上限（首领本体 + 召唤物）：超过则不再召唤。
  max_units: 4
  # 群体技能（skills.yaml 里 target: all）：一次打**全部存活敌人**，
  # 每个目标的伤害再乘 factor —— 打 3 只时总伤 = 威力 × 0.6 × 3 = 1.8 倍，
  # 打 1 只时只有 0.6 倍。所以群攻清群怪、单体打首领，各有各的场合。
  #   factor       每目标伤害乘区（默认 0.6）
  #   max_targets  最多命中几个目标（0 = 跟随 max_units）
  aoe:
    factor: 0.6
    max_targets: 0
  # 敌方技能资源（仅精英/首领及其召唤物使用）：入场满蓝，计时条每满一次回复 regen。
  enemy_mp: { base: 50, elite_mult: 1.6, boss_mult: 2.4, minion_mult: 0.6, regen: 8 }

  # —— 我方局内魔力（MP）——
  # MP 是**跨层保留**的局内资源，不再是每场战斗重置：
  #   · 入场满蓝（上限 = 养成 mp × 遗物 mp_mult + 被动 mp + 遗物平值 mp）
  #   · 每前进一层回复上限的 per_floor_pct（20%）
  #   · 每个战斗**回合结束时**回复上限的 per_turn_pct（5%）
  #     回合 = 计时条走满一次 = 100 / timer_gain = 10 帧，**不是每次行动**：
  #     一回合内双方可各行动 8~10 次，挂在行动上会变成「每出手都回蓝」。
  #     开局那一回合不回复，回补从第 1 回合结束之后开始。
  #   · 休息层（区域倒数第二层，即首领前的补给层）在 per_floor_pct 之上
  #     额外回复 rest_floor_pct（40%），因为这一层没有战斗
  # 回合是对外计时单位；「帧」只是内部时钟（攻击条/冷却/DoT 用），不对外展示。
  mp:
    per_floor_pct: 0.20    # 每层回复（跨层累积的关键）
    per_turn_pct: 0.05     # 每回合结束回复（不是每次行动）
    rest_floor_pct: 0.40   # 休息层额外回复

  # —— 「不可行动」（打断蓄力后的硬控）——
  # 只有这一种硬控状态，统一叫「不可行动」（不要再用「眩晕」命名）。
  # 数值单位是**速度点**：施加值 = 目标当前速度 × 回合数。每轮先用速度抵扣，
  # 抵扣完的速度才用于攒行动条——所以高速首领被扣得更多，节奏按比例回到与
  # 低速单位一致，不会「速度越高越容易被永久锁住」。
  # 平衡旋钮：
  #   default_rounds     技能没写 unactionable 时的默认控制回合数
  #   max_rounds         单次打断的控制回合数上限（压住单次爆发）
  #   stack_limit_rounds 连续打断的累计上限（防止无限连控首领）
  #   boss_resist        首领抵抗系数（<1 表示首领被控更短）
  #   charge_bonus       蓄力越久惩罚越重：额外回合 = (charge-1) × charge_bonus
  #   reset_gauge        打断时清空其行动条（不清的话它当轮照常出手，控制无效）
  unactionable:
    enabled: true
    default_rounds: 1.0
    max_rounds: 2.5
    stack_limit_rounds: 4.0
    boss_resist: 0.8
    charge_bonus: 0.5
    reset_gauge: true

# 敌方技能表：**精英/首领专属**，小怪永远只有普攻。
# 精英在 elites[] 里用 skill/skills 引用，首领在 bosses[] 里用 skills 引用。
# 字段说明（未写的字段取默认值 = 无效果）：
#   name/desc     展示名与描述（内容文本写在 YAML；展示模板在 texts.yaml）
#   power         威力系数：伤害 = atk × power / 30（除数为 30，与宠物技能同一基准；power 30 = 一次普通攻击，
#                 普通技能约 1.2-2.0× 敌方攻击，蓄力终极技 2.4-3.0×）
#   strikes       出击命中次数（每击按 power 独立结算）
#   crit_rate     该技能附加暴击率（暴击倍率沿用 battle.crit_mult）
#   leech         吸血比例：造成伤害按比例回复自身（封顶自身生命上限）
#   heal          自我治疗：回复自身生命上限的比例
#   self_buff     自身增益乘区 { atk_mult / def_mult / spd_mult }（持续整场）
#   debuff        削弱我方 { atk_mult / def_mult / spd_mult, rounds }（rounds 单位 = 计时条周期数）
#   dot           我方持续伤害 { frac, rounds }：按敌方攻击力比例，每轮结算一次、不致死
#   charge        蓄力次数：>0 即蓄力终极技。单位是**该单位自己的行动次数**，不是帧也不是回合：
#                 开始蓄力用掉一次行动，之后每出手一次 left-1，归零时释放。
#                 所以速度越快的首领，同样的 charge 会用更少的帧数/回合数完成。
#                 蓄力期间可被打断（阈值见下）。
#   interrupt     打断阈值：判定依据是蓄力期间的**累积伤害**，而非单次伤害 —— 某单位蓄力中时，
#                 我方对它造成的每一次伤害都会累加，累计达到 自身生命上限 × interrupt 即被打断
#   summon        召唤 { name, desc, count, hp_mult, atk_mult, def_mult, spd_mult, skills }
#   cooldown      冷却（单位 = 回合，与宠物技能同口径）。内部换算成帧记「剩余帧数」，
#                 每帧 -1——所以冷却只取决于释放时刻，不会因为刚跨过回合边界就白减 1。
#   mp_cost       消耗敌方 MP：从敌方自身蓝池（battle.enemy_mp）扣除，越贵的技能越受蓝量自然制约
#   priority      行动优先级（数值越大越优先；同优先级比 power）
enemy_skills:
  # —— 物理猛击系 ——
  e_maul:        { name: 撕咬猛击, desc: 低头蓄势后的一记重咬。, power: 45, mp_cost: 0, cooldown: 2, priority: 1 }
  e_slam:        { name: 巨掌拍击, desc: 携全身重量的一掌。, power: 50, mp_cost: 0, cooldown: 2, priority: 1 }
  e_double:      { name: 双钳连斩, desc: 两只前肢交替劈落。, power: 28, mp_cost: 0, strikes: 2, cooldown: 1, priority: 2 }
  e_triple:      { name: 狂乱连击, desc: 失去节奏的连续撕抓。, power: 20, mp_cost: 0, strikes: 3, cooldown: 2, priority: 2 }
  e_crit_stab:   { name: 贯穿突刺, desc: 瞄准要害的一击。, power: 46, mp_cost: 0, cooldown: 3, crit_rate: 0.35, priority: 3 }
  e_roll:        { name: 死亡翻滚, desc: 咬住后原地翻滚撕扯。, power: 48, mp_cost: 0, cooldown: 3, crit_rate: 0.2, priority: 2 }
  e_dive:        { name: 疾风俯冲, desc: 借高度换速度的两连扑击。, power: 27, mp_cost: 0, strikes: 2, cooldown: 2, priority: 2 }
  e_ice_lance:   { name: 寒冰枪, desc: 凝霜成枪，穿透后拖慢脚步。, power: 45, mp_cost: 12, cooldown: 2, priority: 2,
                   debuff: { spd_mult: 0.85, rounds: 2 } }
  e_shadow_raid: { name: 影袭, desc: 从影子里递出的一刀。, power: 52, mp_cost: 18, cooldown: 2, crit_rate: 0.3, priority: 3 }
  e_soul_reap:   { name: 裂魂收割, desc: 镰影掠过，带走一部分生机。, power: 54, mp_cost: 24, cooldown: 3, leech: 0.35, priority: 3 }
  e_void_gaze:   { name: 虚空凝视, desc: 被注视时力量从指缝漏走。, power: 44, mp_cost: 18, cooldown: 3, priority: 3,
                   debuff: { atk_mult: 0.8, rounds: 2 } }
  # —— 蓄力终极技（可打断）——
  # unactionable = 被打断时施加的「不可行动」回合数（速度点 = 自身速度 × 该值）。
  # 蓄力越久、威力越大的技能，被打断的惩罚越重（数值见 battle.unactionable 的配平说明）。
  e_charge_horn: { name: 冲锋撞角, desc: 后蹄刨地蓄势，随后全场直撞。, power: 72, mp_cost: 30, charge: 2, interrupt: 0.16, cooldown: 3, priority: 5, unactionable: 1.0 }
  e_quake:       { name: 大地震击, desc: 举拳砸地，裂纹沿地面铺开。, power: 78, mp_cost: 36, charge: 2, interrupt: 0.18, cooldown: 4, priority: 5, unactionable: 1.0 }
  e_meteor:      { name: 陨火坠击, desc: 火雨在头顶聚成一枚坠星。, power: 84, mp_cost: 42, charge: 3, interrupt: 0.2, cooldown: 4, priority: 5, unactionable: 1.5 }
  e_annihilate:  { name: 湮灭之息, desc: 光与声先被吸走，然后才是爆裂。, power: 90, mp_cost: 48, charge: 3, interrupt: 0.22, cooldown: 4, priority: 6, unactionable: 1.5 }
  # —— 状态与削弱系 ——
  e_venom_sting: { name: 毒刺, desc: 尾针注入的毒会在血管里慢慢走。, power: 27, mp_cost: 8, cooldown: 2, priority: 2,
                   dot: { frac: 0.05, rounds: 3 } }
  e_web:         { name: 缚网, desc: 黏丝缠住手脚，动作变得迟钝。, power: 24, mp_cost: 8, cooldown: 2, priority: 3,
                   debuff: { atk_mult: 0.85, def_mult: 0.85, rounds: 2 } }
  e_root:        { name: 缠根, desc: 根须破土，绕住脚踝往下拽。, power: 27, mp_cost: 8, cooldown: 2, priority: 2,
                   debuff: { spd_mult: 0.8, rounds: 2 } }
  e_frost_nova:  { name: 冰爆领域, desc: 寒气以自身为中心炸开。, power: 27, mp_cost: 15, strikes: 2, cooldown: 3, priority: 3,
                   debuff: { spd_mult: 0.8, rounds: 2 } }
  e_siphon:      { name: 血雾汲取, desc: 雾气裹上来，伤口开始回流。, power: 36, mp_cost: 12, cooldown: 2, leech: 0.5, priority: 2 }
  e_drain:       { name: 暗影汲取, desc: 影子贴上影子，力气被抽走。, power: 39, mp_cost: 14, cooldown: 2, leech: 0.6, priority: 2 }
  # —— 自我强化系 ——
  e_mend:        { name: 再生愈合, desc: 断口处重新长出新的组织。, power: 0, mp_cost: 15, heal: 0.06, cooldown: 3, priority: 4 }
  e_harden:      { name: 坚甲硬化, desc: 表层迅速角质化。, power: 0, mp_cost: 12, cooldown: 3, priority: 3,
                   self_buff: { def_mult: 1.25 } }
  e_rage:        { name: 狂怒, desc: 双眼充血，攻势变得更凶。, power: 0, mp_cost: 12, cooldown: 3, priority: 3,
                   self_buff: { atk_mult: 1.25 } }
  e_haste:       { name: 疾影, desc: 身形一阵模糊，节奏陡然加快。, power: 0, mp_cost: 12, cooldown: 3, priority: 3,
                   self_buff: { spd_mult: 1.2 } }
  # —— 召唤系 ——
  e_summon_spider: { name: 召唤蛛群, desc: 腹囊抖落出一地幼蛛。, power: 0, mp_cost: 24, cooldown: 4, priority: 6,
                     summon: { name: 幼蛛, desc: 刚孵化就学会了咬人。, count: 2, hp_mult: 0.06, atk_mult: 0.5, def_mult: 0.5, spd_mult: 1.2 } }
  e_summon_bat:    { name: 召唤蝠群, desc: 翼影从洞顶泼下来。, power: 0, mp_cost: 30, cooldown: 4, priority: 6,
                     summon: { name: 灰烬蝠, desc: 抖落的粉尘还带着火星。, count: 3, hp_mult: 0.05, atk_mult: 0.45, def_mult: 0.4, spd_mult: 1.4 } }
  e_summon_wolf:   { name: 召唤狼群, desc: 长嗥招来同族，白影排开。, power: 0, mp_cost: 30, cooldown: 4, priority: 6,
                     summon: { name: 霜狼, desc: 呼吸结成白雾的狼。, count: 2, hp_mult: 0.08, atk_mult: 0.6, def_mult: 0.6, spd_mult: 1.3 } }
  e_summon_eye:    { name: 张开群眼, desc: 黑暗里睁开更多只眼睛。, power: 0, mp_cost: 24, cooldown: 4, priority: 6,
                     summon: { name: 窥视之眼, desc: 只为注视而生的碎片。, count: 3, hp_mult: 0.04, atk_mult: 0.5, def_mult: 0.3, spd_mult: 1.0 } }
  e_summon_shade:  { name: 召唤影分身, desc: 影子从脚下剥离，站成了另一个你。, power: 0, mp_cost: 36, cooldown: 5, priority: 6,
                     summon: { name: 影分身, desc: 与你同形，只是眼神更冷。, count: 1, hp_mult: 0.14, atk_mult: 0.8, def_mult: 0.8, spd_mult: 1.1, skills: [e_shadow_raid] } }
  # —— 追加技能组：补足 dot / heal / 组合机制 / 更长蓄力 ——
  # 设计口径同前：power 30 = 一次普攻，蓄力终极技 2.4-3.0×；mp_cost 越贵的越受蓝量制约。
  # 【持续伤害系】原来只有 e_venom_sting 一个，这里补齐不同强度与叠加方式
  e_corrode:      { name: 蚀骨雾, desc: 雾贴着皮肤渗进去，骨头开始发酸。, power: 24, mp_cost: 14, cooldown: 3, priority: 2,
                    dot: { frac: 0.08, rounds: 4 } }
  e_inferno_mark: { name: 焚印, desc: 掌心按在胸口，印痕持续烧着。, power: 30, mp_cost: 20, cooldown: 3, priority: 3,
                    dot: { frac: 0.12, rounds: 3 } }
  e_plague:       { name: 瘟疫喷吐, desc: 喷出的东西落在哪里，哪里就开始腐烂。, power: 21, mp_cost: 22, cooldown: 4, priority: 4,
                    dot: { frac: 0.15, rounds: 5 }, debuff: { def_mult: 0.85, rounds: 3 } }
  # 【治疗系】原来只有 e_mend 一个
  e_devour:       { name: 吞噬复原, desc: 咽下去的东西正在替它补上缺口。, power: 30, mp_cost: 18, cooldown: 3, priority: 3,
                    heal: 0.1, leech: 0.4 }
  e_reknit:       { name: 血肉重织, desc: 断口处的肉自己找了回去。, power: 0, mp_cost: 26, cooldown: 4, priority: 5,
                    heal: 0.15, self_buff: { def_mult: 1.15 } }
  e_phoenix:      { name: 焚身重生, desc: 烧掉旧壳，从灰里重新长出来。, power: 0, mp_cost: 40, cooldown: 5, priority: 6,
                    heal: 0.25, self_buff: { atk_mult: 1.2 } }
  # 【组合机制】多效果同时命中，单看每一项都不强，叠起来很难受
  e_frost_bind:   { name: 霜缚, desc: 冰从脚底爬上来，动作和呼吸一起变慢。, power: 27, mp_cost: 18, cooldown: 3, priority: 3,
                    debuff: { spd_mult: 0.7, atk_mult: 0.9, rounds: 3 } }
  e_shadow_brand: { name: 影烙印, desc: 伤口不流血，只留下一个不会消退的印。, power: 33, mp_cost: 22, cooldown: 3, priority: 4,
                    crit_rate: 0.25, dot: { frac: 0.06, rounds: 3 } }
  e_soul_burn:    { name: 燃魂, desc: 烧的不是身体，是撑着身体的那点东西。, power: 42, mp_cost: 30, cooldown: 4, priority: 4,
                    dot: { frac: 0.1, rounds: 3 }, debuff: { atk_mult: 0.85, rounds: 2 } }
  e_mana_burn:    { name: 焚魔, desc: 触到的魔力先沸腾再消失。, power: 36, mp_cost: 24, cooldown: 3, priority: 4,
                    debuff: { atk_mult: 0.8, spd_mult: 0.9, rounds: 3 } }
