# 养成系统所有用户可见文案。
# `{...}` 为占位符，由 utils/texts.text() 用命名参数填充。
# 指令统一在主命令 `宠物` 的命名空间下，即 `/宠物.xxx`。
# 说明：参数校验类提示（性格不合法、行动点不足、属性名错误等）属于校验信息而非展示文案，
#       仍留在代码中，便于与 raise 的异常一一对应。

