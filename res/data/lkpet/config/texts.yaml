# 养成系统所有用户可见文案。
# `{...}` 为占位符，由 utils/texts.text() 用命名参数填充。
# 指令统一在主命令 `宠物` 的命名空间下，即 `/宠物.xxx`。
# 说明：参数校验类提示（性格不合法、行动点不足、属性名错误等）属于校验信息而非展示文案，
#       仍留在代码中，便于与 raise 的异常一一对应。

tutorial:
  steps:
    - id: welcome
      day: 0
      text: "欢迎来到宠物世界！你的小可爱已经来到身边啦～"
    - id: choose_personality
      day: 0
      text: "创建时选择的性格会决定它的经验成长速度与战斗倾向。"
    - id: choose_name
      day: 0
      text: "名字就是你们之间的第一份羁绊。"
    - id: first_feed
      day: 0
      text: "使用「/宠物.喂食」喂它吃点东西吧。"
    - id: first_play
      day: 0
      text: "使用「/宠物.玩耍」陪它玩一会儿。"
    - id: first_status
      day: 0
      text: "使用「/宠物.状态」随时查看它的状态与属性。"
    - id: day1_summary
      day: 1
      text: "第 1 天结束啦，使用「/宠物.结算」查看今天的报告。"
    - id: tutorial_done
      day: 3
      text: "新手引导完成！祝你和宠物旅途愉快～"
  hint: "📖 引导：{text}"

