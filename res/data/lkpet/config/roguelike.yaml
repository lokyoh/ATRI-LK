# 肉鸽爬塔配置（任务书 §12）。全部数值外置；用户可见文案在 texts.yaml 的 rogue 块。
# 局内资源（局内生命、局内金币、局内增益）只存在于 run 状态里，永不落盘到养成数据。
# 结构：5 个区域 × 20 层 = 100 层；每区域一个主题，基础数值跨区域成倍跳升（难度差距显著）。
#   · 区域中点（relic_floor）固定为**遗物奖励层**（三选一）；
#   · 区域末层为**区域首领**（候选三选一，首通另给首通奖励，击杀掉 Boss 专属遗物）；
#   · 首领前一层必定刷出**回血补给事件**（supply），同层的战斗路线也必定是精英守门。
# 事件在 rogue_events.yaml（每区域 30 个）；遗物在 rogue_relics.yaml（普通 ≥50 + Boss 专属 15）。

tower:
  floors: 100             # 5 区域 × 20 层
  entry_cost_key: rogue       # 入场行动点，对应 daily.yaml action_points.costs 的键
  step_cost_key: rogue_step   # 每前进一步的行动点
  regions:
    - id: plains
      name: 青草平原
      desc: 开阔的草原，风里混着青草与野花的气息——最温和的试炼。
      start: 1
      end: 20
      relic_floor: 10     # 区域中点：固定遗物奖励层
      boss_floor: 20
      monster:
        base: { hp: 40, atk: 8, def: 4, spd: 8 }
        growth: { hp: 3, atk: 0.6, def: 0.3, spd: 0.2 }
      monsters:
        - { name: 草原狼, traits: [swift], desc: 成群巡弋的灰狼，总是先派一只试探，再一起扑上来。 }
        - { name: 野猪, traits: [strong], desc: 肩胛隆起的独行野猪，低头冲刺时连灌木都能连根拱起。 }
        - { name: 巨眼田鼠, traits: [thin], desc: 眼睛占了半个脑袋，挖出的洞口密得像筛子，一受惊就钻进土里。 }
        - { name: 带刺花妖, traits: [thorns], desc: 花瓣背面全是细刺，被碰到时会整朵炸开，把刺喷你一脸。 }
        - { name: 泥潭史莱姆, traits: [leech], desc: 半透明的泥浆团，吞下东西后能看见它在体内慢慢变色。 }
        - { name: 风灵, traits: [swift, thin], desc: 一缕有了形状的风，掠过草地时只留下倒伏的痕迹。 }
        - { name: 野蛮蜂群, traits: [swarm], desc: 没有巢的流蜂，顺着甜味与汗味找到你，一拥而上。 }
        - { name: 强盗野兔, traits: [crit], desc: 后腿蹬地的瞬间弹射，专挑膝盖与喉咙这种软处下手。 }
        - { name: 磷光蝶群, traits: [swarm, thin], desc: 翅膀的磷粉有毒，落在皮肤上会亮起一小片痒。 }
        - { name: 稻草傀儡, traits: [thick, slow], desc: 田里立了一季的稻草人自己走下来了，塞满稻壳的身体很耐打。 }
      rewards: { coins: 2, coins_per_floor: 1, exp: 20, exp_per_floor: 2 }
      shop: { heal_mult: 1 }
      elites:  # 每区域 5 个精英备选（战斗路线按区域 seed 抽，遭遇次数受 elite.max_per_region 限制）
        - { name: 铁角原牛, traits: [strong], skills: [e_charge_horn], desc: 低头犁地的巨牛，一对铁角能掀翻货车。 }
        - { name: 疾风隼王, traits: [swift], skills: [e_dive], desc: 循风而猎的巨隼，俯冲时像一支白羽箭。 }
        - { name: 毒刺巨蜂, traits: [crit], skills: [e_venom_sting], desc: 尾针有小指长，振翅声像锯木头。 }
        - { name: 断牙头狼, traits: [swarm], skills: [e_summon_wolf], desc: 狼群的王，左犬齿断了一半，从不落单。 }
        - { name: 禾田稻魔, traits: [thick], skills: [e_root], desc: 稻草束成的人形，夜里在田里自己走路。 }
    - id: forest
      name: 迷雾森林
      desc: 终年不散的浓雾吞掉路径与声音，树影里藏着不属于林地的眼睛。
      start: 21
      end: 40
      relic_floor: 30
      boss_floor: 40
      monster:
        base: { hp: 110, atk: 18, def: 9, spd: 11 }
        growth: { hp: 5, atk: 1.0, def: 0.5, spd: 0.3 }
      monsters:
        - { name: 雾影狸, traits: [fragile, swift], desc: 只在雾气最浓处显形，你挥空三次才可能碰到它一次。 }
        - { name: 毒牙蜘蛛, traits: [crit], desc: 垂在路中央的蛛丝上，两颗毒牙磨得发亮，专等抬头的猎物。 }
        - { name: 树精哨兵, traits: [thick, slow], desc: 被雾泡软的老树忽然睁眼，树皮缝里嵌着前人的破甲片。 }
        - { name: 腐化野鹿, traits: [strong], desc: 鹿角上挂满腐叶，呼吸带着甜腻的烂味，撞人时毫不减速。 }
        - { name: 迷途怨灵, traits: [leech], desc: 雾里反复问路的影子，靠近后才发现它在问的是你的名字。 }
        - { name: 苔藓巨蟾, traits: [thick, dull], desc: 背上的苔藓厚得能养出小虫，蹲着不动时和一块石头没区别。 }
        - { name: 藤蔓缠人者, traits: [thorns], desc: 脚踝先被缠住，接着整片林子都在往回拽你。 }
        - { name: 枯叶刃魔, traits: [swift], desc: 由成千片干枯落叶拼成，掠过时像一阵刮在皮肤上的噪音。 }
        - { name: 夜梟, traits: [thin, crit], desc: 无声地贴着树冠滑过，只有翅膀带起的冷风提醒你还活着。 }
        - { name: 蛊惑花, traits: [leech, thin], desc: 花心散发你最喜欢的气味，凑近时才发现根须已经缠上脚踝。 }
      rewards: { coins: 5, coins_per_floor: 1, exp: 60, exp_per_floor: 4 }
      shop: { heal_mult: 2.5 }
      elites:
        - { name: 苔皮巨熊, traits: [tough], skills: [e_maul], desc: 背上生满青苔，一掌能拍断百年树干。 }
        - { name: 织网女巫蛛, traits: [crit], skills: [e_web], desc: 腹部的纹路像一张皱眉的人脸。 }
        - { name: 腐沼鳄, traits: [thick], skills: [e_roll], desc: 潜在浮萍之下，背脊看去只是一截烂木。 }
        - { name: 巨钳螳螂, traits: [swift], skills: [e_double], desc: 双臂镰刃磨得发亮，专剪经过的脖子。 }
        - { name: 雾隐枭人, traits: [leech], skills: [e_siphon], phase: ph_swift, desc: 半人半枭，雾越浓越难被看见。 }
    - id: lava
      name: 熔岩洞窟
      desc: 地面滚烫、岩浆在暗处发亮，呼吸都带着硫磺味的灼热迷宫。
      start: 41
      end: 60
      relic_floor: 50
      boss_floor: 60
      monster:
        base: { hp: 240, atk: 34, def: 16, spd: 14 }
        growth: { hp: 8, atk: 1.75, def: 0.8, spd: 0.4 }
      monsters:
        - { name: 熔岩犬, traits: [strong], desc: 皮毛下透出烧红的裂纹，一步一个焦黑的爪印。 }
        - { name: 火甲虫, traits: [tough], desc: 甲壳像烧过头的陶片，撞上去时反震得手发麻。 }
        - { name: 灰烬幽魂, traits: [swift, thin], desc: 一团没烧干净的灰，飘过时带走的都是皮肤上的水分。 }
        - { name: 岩浆史莱姆, traits: [leech], desc: 吞下石块后体内会亮起橘红的光，贴着它就会被烫掉一层。 }
        - { name: 烈焰秃鹫, traits: [swift, crit], desc: 俯冲时拖出的火尾，能在地面烧出一道焦线。 }
        - { name: 赤鳞蜥, traits: [thorns], desc: 鳞片边缘全是凝固的熔渣，抓上去比抓刺猬还糟。 }
        - { name: 硫磺喷兽, traits: [strong, dull], desc: 鼓胀的囊袋里全是硫磺气，喷出来时连石头都在冒烟。 }
        - { name: 黑曜傀儡, traits: [thick, slow], desc: 黑曜石拼成的巨块，转身很慢，但碰一下就是满手血。 }
        - { name: 火苗精灵, traits: [fragile], desc: 一小簇活着的火苗，呼吸就能吹得它摇晃，也最会烧人。 }
        - { name: 熔岩蟹, traits: [thick, tough], desc: 壳缝里嵌着冷却的岩浆，横着走过来时像一堵移动的矮墙。 }
      rewards: { coins: 10, coins_per_floor: 2, exp: 140, exp_per_floor: 7 }
      shop: { heal_mult: 5 }
      elites:
        - { name: 赤甲火蝎, traits: [tough], skills: [e_crit_stab], desc: 尾钩滴落的毒液在石头上烧出小洞。 }
        - { name: 熔岩蟒, traits: [leech], skills: [e_maul], desc: 体内流动着岩浆，爬过的地方留下火痕。 }
        - { name: 灰烬骑士, traits: [thick], skills: [e_quake], desc: 甲胄里空无一人，灰烬从缝隙不断漏出。 }
        - { name: 火山凶豚, traits: [strong], skills: [e_slam], desc: 拱起的背像一块烧红的铁砧。 }
        - { name: 焰翅蝠王, traits: [swarm], skills: [e_summon_bat], phase: ph_swift, desc: 翅膜上跳动着细小的火苗。 }
    - id: frost
      name: 冰封王座
      desc: 永冻的宫殿与断裂的冰桥，呼出的白霜会立刻在睫毛上结冰。
      start: 61
      end: 80
      relic_floor: 70
      boss_floor: 80
      monster:
        base: { hp: 500, atk: 66, def: 32, spd: 18 }
        growth: { hp: 12, atk: 2.75, def: 1.25, spd: 0.5 }
      monsters:
        - { name: 霜狼, traits: [swift], desc: 毛上结着霜，跑起来像一道白影很快消失在雪面。 }
        - { name: 冰晶傀儡, traits: [thick, slow], desc: 冰做的躯干里冻着一具旧铠甲，动起来有冰块摩擦的声音。 }
        - { name: 雪怪, traits: [strong, tough], desc: 浑身白毛的高大躯体，一巴掌能把你拍进雪里埋住。 }
        - { name: 冻尸兵, traits: [thick, dull], desc: 冻硬的前朝士兵，甲片脆了，力气却没怎么减。 }
        - { name: 极地幽魂, traits: [leech], desc: 贴上来时你呼出的白汽会被它吸走，跟着体温一起掉。 }
        - { name: 冰锥蝠, traits: [crit], desc: 翅骨像冰锥，擦着脖子飞过时能带走一条细细的血线。 }
        - { name: 霜花妖, traits: [thorns], desc: 看着像窗花，碰到才知道花瓣边缘是能割开皮肉的薄冰。 }
        - { name: 寒风元素, traits: [swift, fragile], desc: 一股有了方向的寒气，吹散它很容易，被它穿身则很难受。 }
        - { name: 白熊, traits: [thick], desc: 厚膘挡刀，站起来比两个你还高，通常是被吵醒的。 }
        - { name: 冰面猎手, traits: [swift, crit], desc: 在镜面一样的冰上滑行，只在三步之内才让你看见它的脸。 }
      rewards: { coins: 18, coins_per_floor: 3, exp: 300, exp_per_floor: 12 }
      shop: { heal_mult: 9 }
      elites:
        - { name: 冰棘猛犸, traits: [thorns], skills: [e_quake], desc: 象牙结满冰棱，吼一声能冻住呼吸。 }
        - { name: 霜翼巨鹰, traits: [swift], skills: [e_ice_lance], desc: 爪下抓着整块浮冰在空中巡弋。 }
        - { name: 冻原食人魔, traits: [strong], skills: [e_maul], desc: 肩上扛着半截结冰的路牌。 }
        - { name: 雪腹巨蛛, traits: [swarm], skills: [e_summon_spider], desc: 白色绒毛与雪地融为一体。 }
        - { name: 冰镜魅影, traits: [leech], skills: [e_frost_nova], phase: ph_undying, desc: 从冰面里坐起来的另一个"你"。 }
    - id: abyss
      name: 深渊之巅
      desc: 塔顶之上的倒悬深渊，星光从脚下坠落，连影子都会背叛你。
      start: 81
      end: 100
      relic_floor: 90
      boss_floor: 100
      monster:
        base: { hp: 1000, atk: 120, def: 60, spd: 24 }
        growth: { hp: 17, atk: 4.0, def: 1.75, spd: 0.6 }
      monsters:
        - { name: 虚空之影, traits: [leech, swift], desc: 没有实体，靠你的影子靠近；影子的边缘一淡，血就少了一截。 }
        - { name: 星蚀兽, traits: [strong], desc: 皮肤像被星光啃过的陨石，撞上来带着一阵耳鸣。 }
        - { name: 坠落守卫, traits: [tough, slow], desc: 从塔顶摔了千百年仍在坠落的守卫，甲胄厚重得不像话。 }
        - { name: 裂隙爬虫, traits: [swarm], desc: 从空间的缝里钻出来，一只很小，成百上千只就很吵也很疼。 }
        - { name: 回声魔偶, traits: [thick], desc: 由重复过太多次的声音凝成人形，打散一次会再聚一次。 }
        - { name: 深渊水母, traits: [thorns, fragile], desc: 伞盖下的触须带电，碰到就麻，而它自己一戳就破。 }
        - { name: 虚无信徒, traits: [swarm, thin], desc: 虔诚得只剩执念的信徒，个体很轻，来的人却永远不少。 }
        - { name: 黑日鸦, traits: [crit, swift], desc: 栖在看不见的枝上，扑下的瞬间像一小块日食。 }
        - { name: 失重骷髅, traits: [fragile], desc: 骨头浮在身上没有重量，一推就散，但会被它重新拼回一次。 }
        - { name: 命运织蛛, traits: [leech, crit], desc: 把可能的结局织成网，你每一次挣扎都在帮它收紧。 }
      rewards: { coins: 30, coins_per_floor: 4, exp: 560, exp_per_floor: 20 }
      shop: { heal_mult: 15 }
      elites:
        - { name: 虚空之眼, traits: [crit], skills: [e_void_gaze], desc: 悬浮的巨眼，瞳孔里倒转着星光。 }
        - { name: 星坠猎犬, traits: [swift], skills: [e_meteor], desc: 由陨屑拼成的猎犬，奔跑时拖出火尾。 }
        - { name: 裂魂双子, traits: [swarm], skills: [e_summon_shade], desc: 共享一具身体的两个影子，各朝一方拉扯。 }
        - { name: 深渊灯水母, traits: [leech], skills: [e_drain], desc: 伞盖下的光是诱饵，触须垂进虚无。 }
        - { name: 影噬巨口, traits: [thick], skills: [e_annihilate], phase: ph_berserk, desc: 没有身体，只有一张缓缓张开的嘴。 }

elite:
  chance: 0.3              # 候选层逐层判定的概率（区域级 seed，可复现）
  max_per_region: 4        # 每区域至多生成 4 次精英遭遇（保底精英计入其中）
  min_floor_gap: 5         # 区域前 5 层（start…start+4）不生成精英，候选从 start+gap 起
  guaranteed_offset: 2     # end - offset 层必定精英（首领前一层是纯补给层，故保底在倒数第二层）
  stats_mult: 1.6          # 精英 = 当层普通公式 × 1.6（介于小怪与首领之间）
  reward_mult: { coins: 2, exp: 2 }   # 精英掉落倍率（金币/经验）

# 怪物特点：数值乘区/行为参数全部外置在这里（展示用中文标签在 texts.yaml 的 rogue.traits）。
# region.monsters[].traits 列 0-2 个特点 id；没有特点的怪不显示标注。
#   *_mult        该属性乘区（特点在精英/首领倍率**之前**作用）
#   strikes       每次出击命中次数（群袭）；strike_mult 每击伤害乘区
#   crit_rate     敌方暴击概率（倍率沿用 battle.crit_mult）
#   leech         吸血：造成损害的回复比例（封顶自身生成时生命）
#   thorns        棘刺：我方打出的伤害按比例反弹到局内生命
monster_traits:
  swarm:   { strikes: 2, strike_mult: 0.6 }
  thick:   { hp_mult: 1.35 }
  thin:    { hp_mult: 0.7 }
  strong:  { atk_mult: 1.3 }
  dull:    { atk_mult: 0.75 }
  tough:   { def_mult: 1.5 }
  fragile: { def_mult: 0.6 }
  swift:   { spd_mult: 1.3 }
  slow:    { spd_mult: 0.7 }
  crit:    { crit_rate: 0.25 }
  leech:   { leech: 0.3 }
  thorns:  { thorns: 0.2 }

supply:
  floor_offset: 1          # end - offset 层（首领前一层）**唯一选项就是回血补给**（不再有三选一）
  event:
    id: supply_cache
    text: >
      首领战前的补给点：墙龛里堆着绷带、药膏与半壶温热的肉汤——前人留下的应急储备，
      盖子上用木炭写着「给还活着的人」。
    choices:
      - { text: 痛饮热汤回复生命, effect: { run_hp: 60, run_mp_pct: 0.5 } }
      - { text: 仔细包扎处理伤口, effect: { run_hp: 40, exp: 20, run_mp: 20 } }
      - { text: 打包带走干粮和药, effect: { coins: 15, run_hp: 20, run_mp_pct: 0.35 } }

battle:
  # 回合上限：超过即判平局（按到达层数结算）。单位是**回合**，不是内部帧：
  # 1 回合 = 计时条走满一次 = 100 / timer_gain = 10 帧。实测绝大多数战斗
  # 只跑 2-12 帧（不到 2 回合），这个上限只用于兜住异常僵持。
  max_rounds: 500
  variance: [0.85, 1.15]  # 伤害浮动区间
  def_factor: 0.5         # 防御减伤系数：atk - def * def_factor
  # 攻击条机制（ATB）：取 100 为个人攻击条上限，每**帧**按速度攒 gauge_rate_mult × spd；
  # 先满者出击（-100），同帧都满时速度快者先动——速度值决定出击频率。
  # 注意「帧」是内部时钟：入场前几帧可能无人攒满（如速度 17 × 5 = 85 < 100 要两帧），
  # 所以对外展示的回合数按 100 / timer_gain 帧折算，不能直接把帧号当回合。
  gauge_rate_mult: 5
  # 战斗计时条：每帧结束固定 +timer_gain，满 100 触发「计时条满」：
  # 所有技能剩余冷却 -1、计时 Buff 剩余时长 -1（预留），随后计时条清零。
  # 满一次 == 一个「回合」，故 frames_per_turn = 100 / timer_gain（默认 10）。
  timer_gain: 10
  # 暴击倍率：被动技能 crit_rate 命中时我方输出 × crit_mult
  crit_mult: 1.8
  # 逐回合战报：战斗日志最多回放的条数（取最后 N 条；0 = 不输出逐回合战报）
  log_limit: 12
  # 场上敌人数量上限（首领本体 + 召唤物）：超过则不再召唤。
  max_units: 4
  # 敌方技能资源（仅精英/首领及其召唤物使用）：入场满蓝，计时条每满一次回复 regen。
  enemy_mp: { base: 50, elite_mult: 1.6, boss_mult: 2.4, minion_mult: 0.6, regen: 8 }

  # —— 我方局内魔力（MP）——
  # MP 是**跨层保留**的局内资源，不再是每场战斗重置：
  #   · 入场满蓝（上限 = 养成 mp × 遗物 mp_mult + 被动 mp + 遗物平值 mp）
  #   · 每前进一层回复上限的 per_floor_pct（20%）
  #   · 每个战斗**回合结束时**回复上限的 per_turn_pct（5%）
  #     回合 = 计时条走满一次 = 100 / timer_gain = 10 帧，**不是每次行动**：
  #     一回合内双方可各行动 8~10 次，挂在行动上会变成「每出手都回蓝」。
  #     开局那一回合不回复，回补从第 1 回合结束之后开始。
  #   · 休息层（区域倒数第二层，即首领前的补给层）在 per_floor_pct 之上
  #     额外回复 rest_floor_pct（40%），因为这一层没有战斗
  # 回合是对外计时单位；「帧」只是内部时钟（攻击条/冷却/DoT 用），不对外展示。
  mp:
    per_floor_pct: 0.20    # 每层回复（跨层累积的关键）
    per_turn_pct: 0.05     # 每回合结束回复（不是每次行动）
    rest_floor_pct: 0.40   # 休息层额外回复

  # —— 「不可行动」（打断蓄力后的硬控）——
  # 只有这一种硬控状态，统一叫「不可行动」（不要再用「眩晕」命名）。
  # 数值单位是**速度点**：施加值 = 目标当前速度 × 回合数。每轮先用速度抵扣，
  # 抵扣完的速度才用于攒行动条——所以高速首领被扣得更多，节奏按比例回到与
  # 低速单位一致，不会「速度越高越容易被永久锁住」。
  # 平衡旋钮：
  #   default_rounds     技能没写 unactionable 时的默认控制回合数
  #   max_rounds         单次打断的控制回合数上限（压住单次爆发）
  #   stack_limit_rounds 连续打断的累计上限（防止无限连控首领）
  #   boss_resist        首领抵抗系数（<1 表示首领被控更短）
  #   charge_bonus       蓄力越久惩罚越重：额外回合 = (charge-1) × charge_bonus
  #   reset_gauge        打断时清空其行动条（不清的话它当轮照常出手，控制无效）
  unactionable:
    enabled: true
    default_rounds: 1.0
    max_rounds: 2.5
    stack_limit_rounds: 4.0
    boss_resist: 0.8
    charge_bonus: 0.5
    reset_gauge: true

# 敌方技能表：**精英/首领专属**，小怪永远只有普攻。
# 精英在 elites[] 里用 skill/skills 引用，首领在 bosses[] 里用 skills 引用。
# 字段说明（未写的字段取默认值 = 无效果）：
#   name/desc     展示名与描述（内容文本写在 YAML；展示模板在 texts.yaml）
#   power         威力系数：伤害 = atk × power / 30（除数为 30，与宠物技能同一基准；power 30 = 一次普通攻击，
#                 普通技能约 1.2-2.0× 敌方攻击，蓄力终极技 2.4-3.0×）
#   strikes       出击命中次数（每击按 power 独立结算）
#   crit_rate     该技能附加暴击率（暴击倍率沿用 battle.crit_mult）
#   leech         吸血比例：造成伤害按比例回复自身（封顶自身生命上限）
#   heal          自我治疗：回复自身生命上限的比例
#   self_buff     自身增益乘区 { atk_mult / def_mult / spd_mult }（持续整场）
#   debuff        削弱我方 { atk_mult / def_mult / spd_mult, rounds }（rounds 单位 = 计时条周期数）
#   dot           我方持续伤害 { frac, rounds }：按敌方攻击力比例，每轮结算一次、不致死
#   charge        蓄力轮数：>0 即蓄力终极技，蓄力期间可被打断
#   interrupt     打断阈值：判定依据是蓄力期间的**累积伤害**，而非单次伤害 —— 某单位蓄力中时，
#                 我方对它造成的每一次伤害都会累加，累计达到 自身生命上限 × interrupt 即被打断
#   summon        召唤 { name, desc, count, hp_mult, atk_mult, def_mult, spd_mult, skills }
#   cooldown      冷却（单位 = 计时条周期数，与宠物技能同口径）
#   mp_cost       消耗敌方 MP：从敌方自身蓝池（battle.enemy_mp）扣除，越贵的技能越受蓝量自然制约
#   priority      行动优先级（数值越大越优先；同优先级比 power）
enemy_skills:
  # —— 物理猛击系 ——
  e_maul:        { name: 撕咬猛击, desc: 低头蓄势后的一记重咬。, power: 45, mp_cost: 0, cooldown: 2, priority: 1 }
  e_slam:        { name: 巨掌拍击, desc: 携全身重量的一掌。, power: 50, mp_cost: 0, cooldown: 2, priority: 1 }
  e_double:      { name: 双钳连斩, desc: 两只前肢交替劈落。, power: 28, mp_cost: 0, strikes: 2, cooldown: 1, priority: 2 }
  e_triple:      { name: 狂乱连击, desc: 失去节奏的连续撕抓。, power: 20, mp_cost: 0, strikes: 3, cooldown: 2, priority: 2 }
  e_crit_stab:   { name: 贯穿突刺, desc: 瞄准要害的一击。, power: 46, mp_cost: 0, cooldown: 3, crit_rate: 0.35, priority: 3 }
  e_roll:        { name: 死亡翻滚, desc: 咬住后原地翻滚撕扯。, power: 48, mp_cost: 0, cooldown: 3, crit_rate: 0.2, priority: 2 }
  e_dive:        { name: 疾风俯冲, desc: 借高度换速度的两连扑击。, power: 27, mp_cost: 0, strikes: 2, cooldown: 2, priority: 2 }
  e_ice_lance:   { name: 寒冰枪, desc: 凝霜成枪，穿透后拖慢脚步。, power: 45, mp_cost: 12, cooldown: 2, priority: 2,
                   debuff: { spd_mult: 0.85, rounds: 2 } }
  e_shadow_raid: { name: 影袭, desc: 从影子里递出的一刀。, power: 52, mp_cost: 18, cooldown: 2, crit_rate: 0.3, priority: 3 }
  e_soul_reap:   { name: 裂魂收割, desc: 镰影掠过，带走一部分生机。, power: 54, mp_cost: 24, cooldown: 3, leech: 0.35, priority: 3 }
  e_void_gaze:   { name: 虚空凝视, desc: 被注视时力量从指缝漏走。, power: 44, mp_cost: 18, cooldown: 3, priority: 3,
                   debuff: { atk_mult: 0.8, rounds: 2 } }
  # —— 蓄力终极技（可打断）——
  # unactionable = 被打断时施加的「不可行动」回合数（速度点 = 自身速度 × 该值）。
  # 蓄力越久、威力越大的技能，被打断的惩罚越重（数值见 battle.unactionable 的配平说明）。
  e_charge_horn: { name: 冲锋撞角, desc: 后蹄刨地蓄势，随后全场直撞。, power: 72, mp_cost: 30, charge: 2, interrupt: 0.16, cooldown: 3, priority: 5, unactionable: 1.0 }
