# 肉鸽区域事件（任务书 §12）：每个区域 30 个，按区域分组。
# 抽取规则：进入该区域的非首领层后，三选一选中「事件」时按层与 seed 从本区域事件中抽一个；
#           一次 run 每个事件只触发一次（seen_events）。
#
# 效果只作用于局内资源：run_hp（局内生命，事件伤害下限 1，不致死）、run_mp / run_mp_pct（局内魔力）、
# coins（局内金币）、exp（本局经验，结算时才写回宠物）、relic（局内遗物）。
# 数值按区域难度分档，跨区域不可直接比较。
#
# 事件分类（kind）—— 八类，每区域配比 4/5/4/4/4/3/2/4：
#   blessing 福缘  纯收益，怎么选都不亏
#   trade    抉择  每个选项都有代价，按当前血量/金币取舍
#   disaster 灾厄  全是损失，只能选怎么亏得少
#   gamble   赌局  结果由 roll 随机决定，可能大赚也可能大亏
#   trap     诱饵  表面是收益，实际是坑
#   peril    险境  明示的高风险高回报
#   boon     机遇  稀有大奖
#   flavor   见闻  纯氛围，几乎无影响
#
# 结构：
#   - id: xxNN                # 区域前缀 + 序号，used by seen_events 与 choice 历史
#     kind: 分类
#     text: "场景描述"
#     choices:
#       - text: 行动
#         effect: {...}                                  # 固定效果
#         effect: { roll: [ {weight, text, effect}, … ] }  # 随机效果（按权重抽一个分支）
#
# roll 的随机源以 (seed, floor, "event:<事件id>:<选项号>") 派生，同 seed 同层可复现。
# roll 分支的 text 会在结算回执里显示（「骰子滚出三个六。」），让玩家知道抽到了什么。

events:

  # ============ 青草平原（第 1-20 层）============
  plains:
    # —— blessing（4）——
    - { id: pl01, kind: blessing, text: "路边的野果熟透了，红得发亮，藤蔓上还挂着晨露。", choices: [ { text: "摘下来吃个饱", effect: { run_hp: 16 } }, { text: "装一兜带走", effect: { run_hp: 8 } }, { text: "摘几颗收进包里慢慢吃", effect: { run_hp: 8, coins: 5 } } ] }
    - { id: pl02, kind: blessing, text: "一口泉水从石缝里渗出来，清得能看见底下的沙。", choices: [ { text: "痛饮一通", effect: { run_hp: 16 } }, { text: "灌满水囊", effect: { run_hp: 8, coins: 5 } }, { text: "洗把脸提神", effect: { run_hp: 4, run_mp: 8 } } ] }
    - { id: pl03, kind: blessing, text: "前人留下的营火还没熄，灰烬下压着半块干粮和一枚铜钱。", choices: [ { text: "烤火取暖", effect: { run_hp: 16 } }, { text: "翻找遗留", effect: { coins: 10 } }, { text: "摊开地图研究", effect: { exp: 15 } } ] }
    - { id: pl04, kind: blessing, text: "一株开着白花的老药草长在背阴处，叶片肥厚，根茎有淡淡的苦香。", choices: [ { text: "生嚼止血", effect: { run_hp: 16 } }, { text: "收起来备用", effect: { run_hp: 8, run_mp: 10 } }, { text: "试着辨识药性", effect: { exp: 15 } } ] }
    # —— trade（5）——
    - { id: pl05, kind: trade, text: "溪水对岸有一片没被踩过的野果林，但水有点深，石头滑。", choices: [ { text: "脱鞋淌过去", effect: { run_hp: -5, coins: 20 } }, { text: "绕远路找浅滩", effect: { run_hp: -3, exp: 15 } }, { text: "先扔石头试深浅", effect: { exp: 8 } }, { text: "不去了", effect: { exp: 8 } } ] }
    - { id: pl06, kind: trade, text: "一只受伤的野兔蜷在草丛里，后腿上的伤口还在渗血。", choices: [ { text: "撕下衣襟替它包扎", effect: { run_hp: -5, exp: 30 } }, { text: "留着布料自己用", effect: { run_hp: 8, coins: 10 } }, { text: "当作今天的口粮", effect: { run_hp: 24, coins: 5, exp: -15 } } ] }
    - { id: pl07, kind: trade, text: "赶车的行商停下来，说愿意捎你一段，但要你帮他推上那个坡。", choices: [ { text: "帮他推车", effect: { run_hp: -11, coins: 20 } }, { text: "付钱搭车", effect: { coins: -20, run_hp: 8 } }, { text: "讲讲价", effect: { coins: -10, exp: 15 } } ] }
    - { id: pl08, kind: trade, text: "田埂边的稻草堆里露出一个布包，看着有些年头了。", choices: [ { text: "整个抱走", effect: { coins: 10, run_hp: -11 } }, { text: "先抖开看看", effect: { exp: 15, run_hp: -3 } }, { text: "原样放回去", effect: { run_hp: 8 } } ] }
    - { id: pl09, kind: trade, text: "同行的旅人想换你一包干粮，说前头的村子会重重报答。", choices: [ { text: "换给他", effect: { run_hp: -11, exp: 15, coins: 20 } }, { text: "只要他手里的旧地图", effect: { run_hp: 8, coins: 5 } }, { text: "不留情面", effect: { run_hp: 8 } } ] }
    # —— disaster（4）——
    - { id: pl10, kind: disaster, text: "脚下一块土埂塌了，你半个身子滑进沟里，小腿被碎石划开几道口子。", choices: [ { text: "忍着痛先爬出来", effect: { run_hp: -11 } }, { text: "花时间慢慢挪", effect: { run_hp: -5, exp: 15 } }, { text: "用背包垫脚硬撑", effect: { run_hp: -5, coins: -10 } } ] }
    - { id: pl11, kind: disaster, text: "一阵怪风卷过，你护住头，但背上的包袱系带断了。", choices: [ { text: "回头捡回大半", effect: { run_hp: -5, coins: -10 } }, { text: "优先护住干粮", effect: { run_hp: -3, coins: -20 } }, { text: "只留最要紧的", effect: { run_hp: -3, exp: 15 } } ] }
    - { id: pl12, kind: disaster, text: "夜里有什么东西咬了你的铺盖，醒来时随身的东西被翻得七零八落。", choices: [ { text: "整夜守着伤口", effect: { run_hp: -5 } }, { text: "重新打包清点", effect: { coins: -10, exp: 15 } }, { text: "立刻动身", effect: { run_hp: -3, run_mp: -10 } } ] }
    - { id: pl13, kind: disaster, text: "水囊漏了，你不知道漏了多久，剩下的水只够润润嗓子。", choices: [ { text: "省着分几口喝", effect: { run_hp: -5 } }, { text: "忍到下一处水源", effect: { run_hp: -3, exp: 15 } }, { text: "拿钱找农户买", effect: { run_hp: -3, coins: -10 } } ] }
    # —— gamble（4）——
    - { id: pl14, kind: gamble, text: "路边石头上刻着一盘没下完的棋，旁边压着一句「赢了拿走」。", choices: [ { text: "接这盘棋", effect: { roll: [ { weight: 1, text: "你走出一步妙手，棋盘旁的布袋归你了。", effect: { coins: 30, exp: 15 } }, { weight: 2, text: "这盘棋早就输了，你只是白费力气。", effect: { run_mp: -10 } }, { weight: 2, text: "棋子在指尖碎成了粉。", effect: { run_hp: -5 } } ] } }, { text: "换一盘重开", effect: { roll: [ { weight: 1, text: "竟然真赢了。", effect: { coins: 10, exp: 8 } }, { weight: 2, text: "下到一半觉得没意思。", effect: {  } } ] } }, { text: "不碰", effect: {} } ] }
    - { id: pl15, kind: gamble, text: "岔路口坐着个蒙眼的老太，说能替你指一条「运气好」的路。", choices: [ { text: "听她的", effect: { roll: [ { weight: 3, text: "她指的路确实好走，还捡到东西。", effect: { run_hp: 16, coins: 10 } }, { weight: 1, text: "那条路绕了很远，什么也没有。", effect: { exp: -15 } } ] } }, { text: "自己选一条", effect: { roll: [ { weight: 1, text: "选对了。", effect: { exp: 30 } }, { weight: 2, text: "走进了一片没路的荒草。", effect: { run_hp: -5 } } ] } } ] }
    - { id: pl16, kind: gamble, text: "一只黑猫停在路中间，眼睛一眨不眨地盯着你。老话说跟它走有好运。", choices: [ { text: "跟着它", effect: { roll: [ { weight: 2, text: "它把你领到一堆旧铜钱前。", effect: { coins: 20 } }, { weight: 2, text: "它把你领进了荆棘丛。", effect: { run_hp: -11 } }, { weight: 1, text: "它把你领到了蛇窝。", effect: { run_hp: -11, coins: -5 } } ] } }, { text: "绕开它", effect: { roll: [ { weight: 1, text: "它追上来蹭了蹭你的裤脚。", effect: { run_hp: 8 } }, { weight: 3, text: "它只是看着你走远。", effect: {  } } ] } } ] }
    - { id: pl17, kind: gamble, text: "老槐树的树洞里塞着一只口袋，摸着沉甸甸的，可是洞口边缘有齿痕。", choices: [ { text: "伸手去掏", effect: { roll: [ { weight: 1, text: "里面全是铜钱。", effect: { coins: 30 } }, { weight: 3, text: "被什么东西咬了手。", effect: { run_hp: -11 } } ] } }, { text: "拿棍子捅一捅", effect: { roll: [ { weight: 1, text: "掉出来几枚。", effect: { coins: 10 } }, { weight: 2, text: "捅出来一窝虫子。", effect: { run_hp: -5 } } ] } } ] }
    # —— trap（4）——
    - { id: pl18, kind: trap, text: "一只木箱敞着口放在路中央，里面的铜钱亮得不太自然。", choices: [ { text: "直接伸手", effect: { run_hp: -11, coins: 10 } }, { text: "用长棍拨一拨", effect: { run_hp: -3, coins: 10 } }, { text: "退开", effect: { exp: 15 } } ] }
    - { id: pl19, kind: trap, text: "前面有个和你一模一样的人背对着你，听见脚步也不回头。", choices: [ { text: "拍他肩膀", effect: { run_hp: -11, run_mp: -15 } }, { text: "绕到正面看", effect: { exp: 15, run_hp: -3 } }, { text: "原地等他动", effect: { exp: 8 } } ] }
    - { id: pl20, kind: trap, text: "地上摊着一卷看起来不错的地图，边角写着「通往捷径」。", choices: [ { text: "照着走", effect: { run_hp: -11, exp: 8 } }, { text: "先照抄一份", effect: { exp: 15 } }, { text: "不捡", effect: {} } ] }
    - { id: pl21, kind: trap, text: "一位老汉蹲在路边招手，脚边摆着一只看起来很沉的包袱。", choices: [ { text: "过去帮他", effect: { run_hp: -11, coins: 5 } }, { text: "先问他要什么", effect: { exp: 15, coins: -5 } }, { text: "摆摆手", effect: {} } ] }
    # —— peril（3）——
    - { id: pl22, kind: peril, text: "沟对面立着一把还映着光的柴刀，这沟宽得需要助跑。", choices: [ { text: "助跑跳过去", effect: { run_hp: -16, exp: 30, coins: 20 } }, { text: "扔绳子套", effect: { run_hp: -5, coins: 10 } }, { text: "算了", effect: { run_hp: 8 } } ] }
    - { id: pl23, kind: peril, text: "一头野猪睡在路中间，肚子底下压着几枚发亮的东西。", choices: [ { text: "从它肚子底下拿", effect: { run_hp: -16, coins: 30 } }, { text: "绕开", effect: { run_hp: -3, exp: 15 } }, { text: "等它自己走", effect: { run_hp: 8, exp: 8 } } ] }
    - { id: pl24, kind: peril, text: "一棵老树顶上挂着个蜂巢，树干又高又直。", choices: [ { text: "徒手攀爬", effect: { run_hp: -11, coins: 20 } }, { text: "削一根长杆", effect: { run_hp: -3, coins: 10 } }, { text: "不冒险", effect: {} } ] }
    # —— boon（2）——
    - { id: pl25, kind: boon, text: "路旁的石台上摆着一件东西，像是被人特意留在这里等你。", choices: [ { text: "拿起来仔细看", effect: { coins: 20, exp: 30 } }, { text: "拜三拜再走", effect: { run_hp: 16, exp: 15 } }, { text: "什么也不碰", effect: { run_hp: 8 } } ] }
    - { id: pl26, kind: boon, text: "田埂边的一口旧井居然还有水，井底沉着个锈迹斑斑的铁盒。", choices: [ { text: "想办法捞上来", effect: { coins: 30, run_hp: -3 } }, { text: "只打一桶水", effect: { run_hp: 8, exp: 15 } }, { text: "不惊动", effect: { exp: 15 } } ] }
    # —— flavor（4）——
    - { id: pl27, kind: flavor, text: "夕阳把整片草原染成琥珀色，风把草压向同一个方向。", choices: [ { text: "停下来看一会儿", effect: { exp: 3 } } ] }
    - { id: pl28, kind: flavor, text: "远处有一群雁排成人字飞过，叫声落下来的时候已经听不真切了。", choices: [ { text: "数一共有几只", effect: { exp: 3 } }, { text: "学它们叫", effect: { run_hp: 2 } }, { text: "继续走", effect: {} } ] }
    - { id: pl29, kind: flavor, text: "麦田里立着一个歪戴帽子的稻草人，袖口停着两只麻雀。", choices: [ { text: "替它扶正帽子", effect: { run_hp: 2 } }, { text: "跟它说两句话", effect: { exp: 3 } }, { text: "绕过去", effect: {} } ] }
    - { id: pl30, kind: flavor, text: "夜里的风把云推开一条缝，露出一点很亮的星空。", choices: [ { text: "躺在草地上看", effect: { run_hp: 2 } }, { text: "认一认星星", effect: { exp: 3 } }, { text: "闭眼睡", effect: {} } ] }

  # ============ 迷雾森林（第 21-40 层）============
    # —— elite_fight（1）——
    - { id: pl31, kind: elite_fight, text: "一头野兽被看不见的东西激怒了，鬃毛根根立起，眼睛泛着不正常的红。它没有退路——你也没有。", choices: [ { text: "迎上去", effect: { elite_fight: {title: "狂暴形态"} } }, { text: "先递出食物试探", effect: { elite_fight: {title: "狂暴形态", stat_bonus: 1.15} } }, { text: "绕开它", effect: { run_hp: -8, exp: 8 } } ] }
  forest:
    # —— blessing（4）——
    - { id: fo01, kind: blessing, text: "雾里透出一小块空地，苔藓厚得像毯子，踩上去还有余温。", choices: [ { text: "躺下歇一会儿", effect: { run_hp: 46 } }, { text: "采些苔藓带走", effect: { run_hp: 23, coins: 12 } }, { text: "辨认苔藓种类", effect: { exp: 45 } } ] }
    - { id: fo02, kind: blessing, text: "一丛发光的菌子长在倒木上，光是淡蓝色的，照得见路。", choices: [ { text: "摘下来当灯", effect: { run_hp: 23, run_mp: 12 } }, { text: "小心采进罐子", effect: { coins: 25 } }, { text: "研究它为什么发光", effect: { exp: 45 } } ] }
    - { id: fo03, kind: blessing, text: "树洞里积着一窝雨水，水面浮着几片叶子，干净得能直接喝。", choices: [ { text: "痛饮", effect: { run_hp: 46 } }, { text: "灌满水囊", effect: { run_hp: 23, coins: 12 } }, { text: "洗去脸上血迹", effect: { run_hp: 35 } } ] }
    - { id: fo04, kind: blessing, text: "前人的营地还没完全散架，油布棚子能挡雨，火塘里留着炭。", choices: [ { text: "睡一觉", effect: { run_hp: 46 } }, { text: "搜刮遗留", effect: { coins: 25, exp: 22 } }, { text: "在棚子里读旧笔记", effect: { exp: 45 } } ] }
    # —— trade（5）——
    - { id: fo05, kind: trade, text: "一只被困在藤蔓里的幼鹿正挣扎，藤蔓上有刺。", choices: [ { text: "徒手解开", effect: { run_hp: -9, exp: 90 } }, { text: "用刀慢慢割", effect: { run_hp: -5, exp: 45 } }, { text: "先割断外围的藤", effect: { exp: 22 } }, { text: "不管它", effect: { run_hp: 23 } } ] }
    - { id: fo06, kind: trade, text: "林间小屋里住着个采药人，说愿意给你治伤，但要你替他采一味药。", choices: [ { text: "去采", effect: { run_hp: -19, exp: 45 } }, { text: "付钱", effect: { coins: -50, run_hp: 23 } }, { text: "自己包扎", effect: { run_hp: -9 } } ] }
    - { id: fo07, kind: trade, text: "地上躺着一具猎人的骸骨，背包还完好，只是压在骨头底下。", choices: [ { text: "翻出背包", effect: { coins: 50, run_hp: -9 } }, { text: "就地掩埋", effect: { exp: 45, run_hp: 23 } }, { text: "只取水囊", effect: { run_hp: 23 } } ] }
    - { id: fo08, kind: trade, text: "雾里有个和你同路的影子，它走得比你快，却总在路口等你。", choices: [ { text: "跟紧它", effect: { run_hp: -9, exp: 90 } }, { text: "超过它", effect: { run_hp: -14 } }, { text: "停下来", effect: { run_hp: 11 } } ] }
    - { id: fo09, kind: trade, text: "一棵树的树皮被剥掉一大块，露出里面淡红的新木质，渗着汁液。", choices: [ { text: "接汁液喝", effect: { run_hp: 46, coins: -12 } }, { text: "割更多带走", effect: { coins: 38, run_hp: -9 } }, { text: "替它包上", effect: { exp: 45 } } ] }
    # —— disaster（4）——
    - { id: fo10, kind: disaster, text: "你踩空掉进一个落叶坑，坑底积着腐水和断枝。", choices: [ { text: "立刻爬出来", effect: { run_hp: -19 } }, { text: "先检查有没有划伤", effect: { run_hp: -9, exp: 45 } }, { text: "把能用的枝子带走", effect: { run_hp: -14, coins: 12 } } ] }
    - { id: fo11, kind: disaster, text: "雾太浓，你在一棵树上做了记号，走了半刻钟又看见同一道记号。", choices: [ { text: "认命地重找方向", effect: { run_hp: -14 } }, { text: "坐下来理清思路", effect: { run_hp: -5, exp: 45 } }, { text: "烧掉记号换路", effect: { run_hp: -9, run_mp: -10 } } ] }
    - { id: fo12, kind: disaster, text: "一群毒虫从树冠里掉下来，你护着脸滚进了灌木。", choices: [ { text: "拍打全身", effect: { run_hp: -19 } }, { text: "先冲出这片林子", effect: { run_hp: -9, run_mp: -10 } }, { text: "找泥巴糊住露出的皮肤", effect: { run_hp: -5, exp: 45 } } ] }
    - { id: fo13, kind: disaster, text: "夜里下了整宿的雨，醒来时铺盖湿透，火折子也受了潮。", choices: [ { text: "挤干衣服继续走", effect: { run_hp: -14 } }, { text: "花时间生火烘干", effect: { run_hp: -5, exp: 45 } }, { text: "扔掉湿透的行李", effect: { coins: -38 } } ] }
    # —— gamble（4）——
    - { id: fo14, kind: gamble, text: "雾中传来摇铃声，有人在喊「抽一支签，问问前路」。", choices: [ { text: "抽一支", effect: { roll: [ { weight: 1, text: "上上签，签文说「遇木则吉」。", effect: { run_hp: 46, coins: 25 } }, { weight: 2, text: "中签，签文语焉不详。", effect: { exp: 22 } }, { weight: 2, text: "下下签，签文就一个字：「退」。", effect: { run_hp: -14 } } ] } }, { text: "不抽，只听着", effect: { roll: [ { weight: 1, text: "摇铃声渐渐远去，你觉得安心。", effect: { exp: 45 } }, { weight: 2, text: "摇了很久，吵得你头疼。", effect: { run_mp: -12 } } ] } } ] }
    - { id: fo15, kind: gamble, text: "林间有一座很小的石龛，供着的不是神像，而是一枚硬币。", choices: [ { text: "投一枚换一枚", effect: { roll: [ { weight: 1, text: "换到的硬币是银的。", effect: { coins: 50 } }, { weight: 2, text: "两枚都不见了。", effect: { coins: -25 } }, { weight: 2, text: "石龛里传出笑声。", effect: { run_hp: -14 } } ] } }, { text: "上供不动它", effect: { roll: [ { weight: 2, text: "心里踏实了些。", effect: { exp: 22 } }, { weight: 1, text: "供品被什么叼走了。", effect: { coins: -12 } } ] } } ] }
    - { id: fo16, kind: gamble, text: "一只白鹿停在林间，传说跟着它就能找到宝物。", choices: [ { text: "跟上去", effect: { roll: [ { weight: 1, text: "它领你到一片没人来过的地方。", effect: { coins: 50, exp: 45 } }, { weight: 3, text: "它跳进雾里不见了。", effect: { run_hp: -9 } } ] } }, { text: "远远看着", effect: { roll: [ { weight: 1, text: "它回头看了你很久。", effect: { exp: 45 } }, { weight: 2, text: "它转身走了。", effect: {  } } ] } } ] }
    - { id: fo17, kind: gamble, text: "雾最浓的地方有片蘑菇圈，传说踩进去会被带到别处。", choices: [ { text: "踩进去", effect: { roll: [ { weight: 2, text: "你出现在一片从没见过的林子里。", effect: { coins: 25, exp: 45 } }, { weight: 2, text: "你在原地转了三圈。", effect: { run_hp: -14 } } ] } }, { text: "在外围采蘑菇", effect: { roll: [ { weight: 1, text: "采到几朵能吃的。", effect: { run_hp: 23 } }, { weight: 2, text: "有毒，你赶紧吐了。", effect: { run_hp: -5 } } ] } } ] }
    # —— trap（4）——
    - { id: fo18, kind: trap, text: "一棵树上挂着用绳子捆好的包裹，绳结看起来很讲究。", choices: [ { text: "解开它", effect: { run_hp: -19, coins: 25 } }, { text: "用刀割断", effect: { run_hp: -5, coins: 25 } }, { text: "走开", effect: { exp: 45 } } ] }
    - { id: fo19, kind: trap, text: "雾里坐着个浑身湿透的人，说他只是掉进水里，求你拉一把。", choices: [ { text: "拉他起来", effect: { run_hp: -19, run_mp: -15 } }, { text: "先问清来路", effect: { exp: 45, run_hp: -5 } }, { text: "绕开", effect: {} } ] }
    - { id: fo20, kind: trap, text: "一具鹿的骸骨躺在路上，鹿角完整，断口处泛着不自然的黑。", choices: [ { text: "取下鹿角", effect: { coins: 38, run_hp: -19 } }, { text: "研究黑断口", effect: { exp: 45, run_hp: -5 } }, { text: "掩埋骸骨", effect: { run_hp: 23 } } ] }
    - { id: fo21, kind: trap, text: "树根下有个黑洞，洞口的泥很新，像是刚被挖开的。", choices: [ { text: "伸手进去", effect: { run_hp: -19, coins: 25 } }, { text: "拿棍子探", effect: { run_hp: -5, exp: 45 } }, { text: "不碰", effect: {} } ] }
    # —— peril（3）——
    - { id: fo22, kind: peril, text: "两树之间垂着一座藤桥，下面是深不见底的雾谷。", choices: [ { text: "快速通过", effect: { run_hp: -19, exp: 90, coins: 25 } }, { text: "抓着藤蔓慢慢挪", effect: { run_hp: -9, exp: 45 } }, { text: "退回原路", effect: { run_hp: 11, exp: -22 } } ] }
    - { id: fo23, kind: peril, text: "一只巨大的蜘蛛正在补网，网的中央挂着个发亮的东西。", choices: [ { text: "等它补完再过", effect: { exp: 45, run_hp: 23 } }, { text: "斩网强闯", effect: { run_hp: -28, coins: 50 } }, { text: "收走一把银丝", effect: { coins: 38, run_hp: -9 } } ] }
    - { id: fo24, kind: peril, text: "一汪静止的水洼映出你的脸，但倒影比你先笑了一下。", choices: [ { text: "伸手触碰倒影", effect: { run_hp: -28, exp: 135 } }, { text: "打碎水面", effect: { run_hp: -9, exp: 45 } }, { text: "转身不看", effect: { run_hp: 11 } } ] }
    # —— boon（2）——
    - { id: fo25, kind: boon, text: "雾散开的一瞬间，你看见一小片从没被人踏足的林间空地。", choices: [ { text: "冲进去搜一遍", effect: { coins: 50, exp: 90 } }, { text: "先在外围观察", effect: { exp: 45, run_hp: 23 } }, { text: "谢过就走", effect: { exp: 45 } } ] }
    - { id: fo26, kind: boon, text: "一棵枯死的老树忽然从裂缝里透出金色的光。", choices: [ { text: "掰开看", effect: { coins: 75, run_hp: -5 } }, { text: "退后三步", effect: { exp: 45 } }, { text: "抚过树干", effect: { run_hp: 23, exp: 45 } } ] }
    # —— flavor（4）——
    - { id: fo27, kind: flavor, text: "雾把整片森林泡得发软，声音传出去两步就没了。", choices: [ { text: "站着听一会儿", effect: { exp: 12 } } ] }
    - { id: fo28, kind: flavor, text: "一只猫头鹰歪着头看你，喙里叼着半只老鼠。", choices: [ { text: "回它一个歪头", effect: { run_hp: 5 } }, { text: "注视它", effect: { exp: 9 } }, { text: "走开", effect: {} } ] }
    - { id: fo29, kind: flavor, text: "雨后的苔藓泛着油亮的绿，踩上去滑得很。", choices: [ { text: "小心地走", effect: { exp: 9 } }, { text: "干脆坐下来", effect: { run_hp: 5 } }, { text: "大步趟过去", effect: {} } ] }
    - { id: fo30, kind: flavor, text: "一根倒木横在林间，上面长满了层层叠叠的菌。", choices: [ { text: "数一数有几层", effect: { exp: 9 } }, { text: "在木头上歇脚", effect: { run_hp: 5 } }, { text: "绕过它", effect: {} } ] }

  # ============ 熔岩洞窟（第 41-60 层）============
    # —— elite_fight（1）——
    - { id: fo31, kind: elite_fight, text: "雾里传来沉重的喘息，一个比同类大得多的影子正在逼近，脚步把腐叶踩得粉碎。", choices: [ { text: "握紧武器", effect: { elite_fight: {title: "雾中巨影"} } }, { text: "退到树后观察", effect: { elite_fight: {title: "雾中巨影", stat_bonus: 1.1, hp_pct: 0.25} } }, { text: "悄悄绕路", effect: { run_hp: -14, exp: 15 } } ] }
  lava:
    # —— blessing（4）——
    - { id: la01, kind: blessing, text: "岩壁缝隙里渗出一股不烫的泉水，在熔岩地带显得很不真实。", choices: [ { text: "喝个够", effect: { run_hp: 55 } }, { text: "灌满水囊", effect: { run_hp: 28, coins: 28 } }, { text: "洗去皮肤上的灰", effect: { run_hp: 28, run_mp: 10 } } ] }
    - { id: la02, kind: blessing, text: "一处背风的石凹里还留着前人的铺盖和半锅没吃完的炖菜。", choices: [ { text: "吃干净", effect: { run_hp: 55 } }, { text: "翻找遗留", effect: { coins: 55 } }, { text: "研究前人留下的刻痕", effect: { exp: 95 } } ] }
    - { id: la03, kind: blessing, text: "一丛红色的苔在热石上缓慢生长，贴近能感觉到凉意。", choices: [ { text: "敷在伤口上", effect: { run_hp: 55 } }, { text: "包一片带走", effect: { run_hp: 28, run_mp: 12 } }, { text: "取样观察", effect: { exp: 95 } } ] }
    - { id: la04, kind: blessing, text: "地热喷口的节奏变得平稳，趁这个间隙能安全地烤干衣服。", choices: [ { text: "烤火歇息", effect: { run_hp: 55 } }, { text: "顺便热一热干粮", effect: { run_hp: 28, coins: 28 } }, { text: "观察喷口的规律", effect: { exp: 95 } } ] }
    # —— trade（5）——
    - { id: la05, kind: trade, text: "一只熔岩蟹横着爬过来，壳缝里夹着一小块亮晶晶的碎矿。", choices: [ { text: "按住它取矿", effect: { run_hp: -22, coins: 110 } }, { text: "跟着它走", effect: { exp: 45 } }, { text: "用长杆撬壳缝", effect: { run_hp: -11, coins: 55 } }, { text: "给它让路", effect: { run_hp: 22 } } ] }
    - { id: la06, kind: trade, text: "一条废弃的铁轨伸向黑暗，矿车还能推动，但车上装着东西。", choices: [ { text: "推车探一段", effect: { run_hp: -17, exp: 142 } }, { text: "搬走车上货物", effect: { coins: 110, run_hp: -17 } }, { text: "沿轨做记号返回", effect: { exp: 95 } } ] }
    - { id: la07, kind: trade, text: "硫磺泉咕嘟冒泡，泉底有金属反光，气味刺鼻。", choices: [ { text: "憋气捞", effect: { coins: 110, run_hp: -33 } }, { text: "用蒸汽熏解开疲劳", effect: { run_hp: 41, exp: 48 } }, { text: "绕开", effect: {} } ] }
    - { id: la08, kind: trade, text: "一位烤火的矿工说可以分你一半干粮，但要你替他下一趟深井。", choices: [ { text: "下井", effect: { run_hp: -33, coins: 110, exp: 95 } }, { text: "拿钱换", effect: { coins: -82, run_hp: 28 } }, { text: "不接", effect: { run_hp: 14 } } ] }
    - { id: la09, kind: trade, text: "岩壁上凝着一簇赤色结晶，像冻结的火焰。", choices: [ { text: "整簇敲下", effect: { coins: 110, run_hp: -25 } }, { text: "只取一颗", effect: { coins: 55, exp: 48 } }, { text: "临摹纹路", effect: { exp: 142 } } ] }
    # —— disaster（4）——
    - { id: la10, kind: disaster, text: "洞顶簌簌落灰，小规模塌方开始，碎石像雨点一样砸下来。", choices: [ { text: "顶着硬冲", effect: { run_hp: -42 } }, { text: "躲进凹槽", effect: { run_hp: -17, exp: 95 } }, { text: "抢救装备", effect: { coins: -82, run_hp: -17 } } ] }
    - { id: la11, kind: disaster, text: "脚下的地面忽然发软，一层薄壳下面全是滚烫的灰。", choices: [ { text: "连滚带爬退回去", effect: { run_hp: -33 } }, { text: "先探清楚再走", effect: { run_hp: -17, exp: 95 } }, { text: "用外衣垫脚", effect: { run_hp: -25, coins: -55 } } ] }
    - { id: la12, kind: disaster, text: "热浪一阵阵扑面，皮肤发紧，前方的空气都在扭曲。", choices: [ { text: "浸湿衣服冲过去", effect: { run_hp: -25 } }, { text: "硬抗热浪", effect: { run_hp: -42, exp: 95 } }, { text: "退回阴凉处", effect: { run_hp: -8, exp: -48 } } ] }
    - { id: la13, kind: disaster, text: "一阵火星扑到脸上，眉毛烧掉一小撮，眼睛也涩得睁不开。", choices: [ { text: "用水冲洗", effect: { run_hp: -17 } }, { text: "闭眼缓一缓", effect: { run_hp: -8, exp: 95 } }, { text: "强行前进", effect: { run_hp: -25, run_mp: -15 } } ] }
    # —— gamble（4）——
    - { id: la14, kind: gamble, text: "一池熔金在凹陷处冒泡，表面浮着几枚未熔尽的古币。", choices: [ { text: "长钳去捞", effect: { roll: [ { weight: 2, text: "捞上来三枚。", effect: { coins: 165 } }, { weight: 2, text: "钳子被烫弯了。", effect: { run_hp: -25 } }, { weight: 1, text: "你失手碰到了金液。", effect: { run_hp: -50 } } ] } }, { text: "舀一勺金液", effect: { roll: [ { weight: 1, text: "凝成一块不小的金饼。", effect: { coins: 138 } }, { weight: 2, text: "泼洒了一地。", effect: { run_hp: -33 } } ] } }, { text: "记下位置", effect: { exp: 95 } } ] }
    - { id: la15, kind: gamble, text: "岔路口悬着一盏熄灭的铜灯，灯座上刻着「点灯者得路，吹灯者得眠」。", choices: [ { text: "点亮它", effect: { roll: [ { weight: 2, text: "灯亮起一条清晰的岔道。", effect: { exp: 142, coins: 55 } }, { weight: 1, text: "灯芯爆了一下，差点烧到手。", effect: { run_hp: -17 } } ] } }, { text: "吹一口气", effect: { roll: [ { weight: 1, text: "灯灭了，你睡得格外沉。", effect: { run_hp: 55 } }, { weight: 2, text: "灯没灭，反而烫了你的嘴唇。", effect: { run_hp: -25 } } ] } } ] }
    - { id: la16, kind: gamble, text: "洞壁上一排凹槽，槽里残存的油脂能让火把重新烧起来，但不知道会照亮什么。", choices: [ { text: "全部点着", effect: { roll: [ { weight: 2, text: "整条甬道亮如白昼，你看见地上的暗格。", effect: { coins: 110, exp: 95 } }, { weight: 2, text: "火光惊动了什么，暗处传来爬行声。", effect: { run_hp: -33 } } ] } }, { text: "只点一支", effect: { roll: [ { weight: 1, text: "够看清脚下就行。", effect: { exp: 48 } }, { weight: 2, text: "只照亮了一小片空白。", effect: {  } } ] } } ] }
    - { id: la17, kind: gamble, text: "火蜥的巢里铺着一层温热的卵，其中一颗已经裂开细缝，里面在发光。", choices: [ { text: "等它破壳", effect: { roll: [ { weight: 1, text: "孵出来的小东西蹭了蹭你的手。", effect: { exp: 190, run_hp: 28 } }, { weight: 2, text: "母蜥回来了。", effect: { run_hp: -50 } } ] } }, { text: "取走裂纹卵", effect: { roll: [ { weight: 1, text: "卵在包里一直发热。", effect: { coins: 138 } }, { weight: 2, text: "卵在半路碎了。", effect: { run_hp: -17 } } ] } } ] }
    # —— trap（4）——
    - { id: la18, kind: trap, text: "石台上架着烤架，上面还有一条被遗忘的烤鱼，居然还没凉透。", choices: [ { text: "吃掉它", effect: { run_hp: 55, exp: 48 } }, { text: "检查有没有毒", effect: { exp: 95, run_hp: 14 } }, { text: "带走烤架", effect: { coins: 55, run_hp: 14 } } ] }
    - { id: la19, kind: trap, text: "一条矿道笔直向下，风从里面吹出来是凉的，说明通向外面。", choices: [ { text: "直接下去", effect: { run_hp: -42, exp: 95 } }, { text: "先扔石头听回声", effect: { exp: 95, run_hp: -8 } }, { text: "另找路", effect: { run_hp: 14 } } ] }
    - { id: la20, kind: trap, text: "地上散落着几块成色不错的矿石，旁边有拖拽的痕迹。", choices: [ { text: "全装走", effect: { coins: 82, run_hp: -33 } }, { text: "先看痕迹", effect: { exp: 95, run_hp: -8 } }, { text: "不捡", effect: { run_hp: 14 } } ] }
    - { id: la21, kind: trap, text: "温泉边立着块木牌：「泡浴免费，请勿带走毛巾」。", choices: [ { text: "泡个够", effect: { run_hp: 55, exp: 48 } }, { text: "先看看水色", effect: { exp: 95 } }, { text: "不泡", effect: {} } ] }
    # —— peril（3）——
    - { id: la22, kind: peril, text: "岩浆从洞壁淌成一道火帘，帘后隐约是个能容一人通过的夹缝。", choices: [ { text: "穿火帘而过", effect: { run_hp: -50, exp: 190, coins: 110 } }, { text: "等火势小些", effect: { run_hp: -17, exp: 95 } }, { text: "取一瓢岩浆", effect: { coins: 82, run_hp: -25 } } ] }
    - { id: la23, kind: peril, text: "石桥中段塌了，下面是滚烫的岩浆湖，对面有凉风吹来。", choices: [ { text: "纵身跃过", effect: { run_hp: -50, exp: 238 } }, { text: "搭绳荡过去", effect: { run_hp: -17, exp: 142 } }, { text: "退回找别的路", effect: { run_hp: 14, exp: -48 } } ] }
    - { id: la24, kind: peril, text: "泉眼中心悬浮着一颗拳头大的火珠，它似乎在随着你的心跳明灭。", choices: [ { text: "伸手握珠", effect: { run_hp: -50, exp: 285, coins: 55 } }, { text: "以水汽降温后收下", effect: { coins: 110, run_hp: -17 } }, { text: "观察它的节奏", effect: { exp: 190, run_hp: 14 } } ] }
    # —— boon（2）——
    - { id: la25, kind: boon, text: "通道尽头忽然豁开，一片没被熔岩碰过的石室静静立在那里。", choices: [ { text: "仔细搜一遍", effect: { coins: 138, exp: 190 } }, { text: "先站在门口看", effect: { exp: 95, run_hp: 28 } }, { text: "只取水就走", effect: { run_hp: 28 } } ] }
    - { id: la26, kind: boon, text: "岩缝里开出一株赤晶花，花瓣边缘跳着细小的火苗，根部缠着一枚戒指。", choices: [ { text: "连花带戒取下", effect: { coins: 165, run_hp: -17 } }, { text: "只摘花瓣", effect: { run_hp: 55, exp: 95 } }, { text: "只拿戒指", effect: { coins: 82, exp: 48 } } ] }
    # —— flavor（4）——
    - { id: la27, kind: flavor, text: "熔岩河在脚下缓缓流动，红光把整条通道照得忽明忽暗。", choices: [ { text: "站着看一会儿", effect: { exp: 40 } } ] }
    - { id: la28, kind: flavor, text: "几块浮石在岩浆上慢慢打转，像某种迟钝的舞。", choices: [ { text: "数它们的节奏", effect: { exp: 19 } }, { text: "往里面丢石子", effect: { run_hp: 6 } }, { text: "离开", effect: {} } ] }
    - { id: la29, kind: flavor, text: "洞顶垂下的石钟乳被熏得发黑，一滴水正慢慢地凝。", choices: [ { text: "等它掉下来", effect: { exp: 19 } }, { text: "接一口", effect: { run_hp: 6 } }, { text: "走开", effect: {} } ] }
    - { id: la30, kind: flavor, text: "黑曜石断面像一面黑镜，映出的你比现实慢了半秒眨眼。", choices: [ { text: "练习同步", effect: { exp: 19 } }, { text: "摸摸镜面", effect: { run_hp: 6 } }, { text: "砸碎它", effect: {} } ] }

  # ============ 冰封王座（第 61-80 层）============
    # —— elite_fight（1）——
    - { id: la31, kind: elite_fight, text: "一具被熔岩烧空的躯壳忽然动了，胸腔里的岩浆亮得刺眼，它拦在唯一的通道上。", choices: [ { text: "正面硬拼", effect: { elite_fight: {title: "熔核暴走"} } }, { text: "趁它站起来之前冲过去", effect: { elite_fight: {title: "熔核暴走", stat_bonus: 1.2} } }, { text: "退回岔路", effect: { run_hp: -30, exp: 30 } } ] }
  frost:
    # —— blessing（4）——
    - { id: fr01, kind: blessing, text: "冰缝里居然有一小汪不冻的水，水面浮着薄薄一层雾。", choices: [ { text: "喝个够", effect: { run_hp: 96 } }, { text: "灌满水囊", effect: { run_hp: 48, coins: 52 } }, { text: "洗去脸上的血痂", effect: { run_hp: 48, run_mp: 10 } } ] }
    - { id: fr02, kind: blessing, text: "避风角落里有个小暖炉，火苗只有豆大，却把方圆一米烤得如春。", choices: [ { text: "烤到全身发热", effect: { run_hp: 96 } }, { text: "添柴让火烧旺", effect: { run_hp: 72, exp: 95 } }, { text: "带走火种", effect: { run_hp: 48, coins: 52 } } ] }
    - { id: fr03, kind: blessing, text: "一具冻僵的旅人靠在岩壁上，怀里还抱着个没打开的补给包。", choices: [ { text: "替他合上眼睛，取走补给", effect: { run_hp: 48, coins: 105 } }, { text: "只取食物", effect: { run_hp: 96 } }, { text: "堆雪掩埋", effect: { exp: 190 } } ] }
    - { id: fr04, kind: blessing, text: "冰晶花在墙缝里一瓣瓣绽开，碰一下就簌簌碎成粉，散发出薄荷似的凉。", choices: [ { text: "含一片在嘴里", effect: { run_hp: 96 } }, { text: "收集整簇", effect: { coins: 105 } }, { text: "呵气让它们开得更久", effect: { exp: 285 } } ] }
    # —— trade（5）——
    - { id: fr05, kind: trade, text: "雪堆里露出半截手臂，是个冻僵的人，胸口还有微弱的起伏。", choices: [ { text: "背他到暖处", effect: { run_hp: -55, exp: 250 } }, { text: "取走他的行囊", effect: { coins: 45, run_hp: -22, exp: -40 } }, { text: "只留下火折子", effect: { run_hp: -22, exp: 150 } }, { text: "原地生一堆火", effect: { run_hp: -11, exp: 75 } } ] }
    - { id: fr06, kind: trade, text: "冰层下三尺，一条红鲤被困在气泡里，尾巴还在微弱地摆。", choices: [ { text: "凿冰救鱼", effect: { run_hp: -47, exp: 380 } }, { text: "凿冰抓鱼", effect: { run_hp: 96, coins: 105, exp: -190 } }, { text: "对它哈气", effect: { run_hp: 48, exp: 190 } } ] }
    - { id: fr07, kind: trade, text: "一位披着厚裘的老者坐在冰阶上，说能教你一手，代价是陪他坐一夜。", choices: [ { text: "陪他坐", effect: { run_hp: -63, exp: 570 } }, { text: "给他些食物", effect: { run_hp: -32, coins: -105, exp: 380 } }, { text: "婉拒", effect: { run_hp: 24 } } ] }
    - { id: fr08, kind: trade, text: "一排冰雕士兵举着不同的兵器，冰层里封着真实的甲胄。", choices: [ { text: "取走一柄封存的剑", effect: { coins: 210, run_hp: -63 } }, { text: "按顺序观察招式", effect: { exp: 475 } }, { text: "向冰雕敬礼", effect: { run_hp: 72, exp: 190 } } ] }
    - { id: fr09, kind: trade, text: "风口把雪吹成一面墙，绕过它要多走半天，硬闯则要挨冻。", choices: [ { text: "顶风硬闯", effect: { run_hp: -79, exp: 380 } }, { text: "绕远路", effect: { run_hp: -32, exp: 95 } }, { text: "挖雪洞等风停", effect: { run_hp: -16, exp: 190 } } ] }
    # —— disaster（4）——
    - { id: fr10, kind: disaster, text: "雪坡开始滑动，第一声闷响从背后传来，没有回头的时间。", choices: [ { text: "扑向岩缝", effect: { run_hp: -63 } }, { text: "迎着冲", effect: { run_hp: -95, exp: 285 } }, { text: "滑向下坡", effect: { run_hp: -47 } } ] }
    - { id: fr11, kind: disaster, text: "极寒夜骤然降临，气温在几息之间跌到呵气成冰。", choices: [ { text: "挖雪洞钻进去", effect: { run_hp: -47 } }, { text: "奔跑取暖", effect: { run_hp: -63, exp: 190 } }, { text: "抱紧斗篷硬撑", effect: { run_hp: -79, exp: 285 } } ] }
    - { id: fr12, kind: disaster, text: "冰面裂开一圈细纹，呻吟声正向你蔓延。", choices: [ { text: "冲刺到对岸", effect: { run_hp: -63 } }, { text: "伏低分散重量", effect: { run_hp: -32, exp: 190 } }, { text: "抛弃重物", effect: { coins: -210 } } ] }
    - { id: fr13, kind: disaster, text: "你的手指开始失去知觉，指甲盖泛着不自然的青。", choices: [ { text: "用体温捂回来", effect: { run_hp: -32 } }, { text: "找雪搓热", effect: { run_hp: -47, exp: 190 } }, { text: "忍着继续走", effect: { run_hp: -63 } } ] }
    # —— gamble（4）——
    - { id: fr14, kind: gamble, text: "冰壁上嵌着一排铜环，传说拉对哪一个就能打开通路。", choices: [ { text: "随便拉一个", effect: { roll: [ { weight: 1, text: "石壁无声地滑开了。", effect: { coins: 210, exp: 285 } }, { weight: 3, text: "只听见空洞的回响。", effect: { run_hp: -32 } }, { weight: 2, text: "墙里有什么东西动了。", effect: { run_hp: -79 } } ] } }, { text: "先看铜环上的刻痕", effect: { roll: [ { weight: 2, text: "你辨认出了规律。", effect: { exp: 285 } }, { weight: 2, text: "刻痕冻得太深，什么也看不出来。", effect: {  } } ] } } ] }
    - { id: fr15, kind: gamble, text: "雪地里坐着一只通体雪白的狐狸，脖子上系着一枚铜铃。", choices: [ { text: "跟它走", effect: { roll: [ { weight: 1, text: "它领你到一处补给点。", effect: { coins: 210, run_hp: 48 } }, { weight: 3, text: "它在雪里消失了，你迷了路。", effect: { run_hp: -63 } } ] } }, { text: "摇它的铜铃", effect: { roll: [ { weight: 1, text: "铃声回荡，山谷亮了一下。", effect: { exp: 380 } }, { weight: 2, text: "狐狸受惊咬了你的手。", effect: { run_hp: -47 } } ] } } ] }
    - { id: fr16, kind: gamble, text: "一口冰封的古井，水面像镜子，映出的却是你不认识的星空。", choices: [ { text: "凝视井中的星空", effect: { roll: [ { weight: 1, text: "你看见了一条从没走过的路。", effect: { exp: 570, coins: 105 } }, { weight: 2, text: "星空开始旋转，你差点栽进去。", effect: { run_hp: -79 } } ] } }, { text: "打一桶井水", effect: { roll: [ { weight: 2, text: "水是温的。", effect: { run_hp: 96 } }, { weight: 1, text: "桶提上来时只剩冰。", effect: {  } } ] } } ] }
    - { id: fr17, kind: gamble, text: "废弃篝火只剩白灰，灰里插着半截未烧尽的蜡烛，烛芯焦黑。", choices: [ { text: "重新点燃", effect: { roll: [ { weight: 2, text: "火光照出一圈影子。", effect: { run_hp: 72, exp: 190 } }, { weight: 1, text: "火苗忽然爆开，燎了你的手。", effect: { run_hp: -47 } } ] } }, { text: "带走蜡烛", effect: { roll: [ { weight: 1, text: "它在包里一直温着。", effect: { coins: 105, run_hp: 48 } }, { weight: 2, text: "它断了。", effect: {  } } ] } } ] }
    # —— trap（4）——
    - { id: fr18, kind: trap, text: "冰棺停在回廊中央，棺中人的睫毛上结着霜，嘴角竟然带着笑。", choices: [ { text: "推开棺盖", effect: { run_hp: -95, exp: 190 } }, { text: "拂去霜读铭文", effect: { exp: 285, coins: 52 } }, { text: "鞠躬后离开", effect: { run_hp: 48 } } ] }
    - { id: fr19, kind: trap, text: "雪原上支着一顶圆顶屋，门帘压着雪，里面炉火噼啪作响。", choices: [ { text: "进去取暖", effect: { run_hp: 96, exp: 95 } }, { text: "先绕屋看一圈", effect: { exp: 190 } }, { text: "搜刮储藏", effect: { coins: 158, run_hp: -47 } } ] }
    - { id: fr20, kind: trap, text: "墙缝里卡着一个布包，绳口封着火漆，火漆上是个陌生的纹章。", choices: [ { text: "拆开", effect: { coins: 158, run_hp: -47 } }, { text: "先看纹章", effect: { exp: 190 } }, { text: "不动", effect: {} } ] }
    - { id: fr21, kind: trap, text: "洞顶垂下的冰钟乳内部封着一只展翅的雪枭，羽毛纤毫毕现。", choices: [ { text: "取下整根", effect: { coins: 210, run_hp: -63 } }, { text: "贴近观察", effect: { exp: 285, run_hp: 24 } }, { text: "敲碎取羽", effect: { coins: 105, run_hp: -32 } } ] }
    # —— peril（3）——
    - { id: fr22, kind: peril, text: "冰桥断口宽约两丈，对面就是向上的阶梯，桥下白雾翻涌。", choices: [ { text: "冲刺跳跃", effect: { run_hp: -95, exp: 570 } }, { text: "掷出抓钩绳", effect: { run_hp: -32, exp: 285 } }, { text: "寻找绕行冰阶", effect: { run_hp: -16, exp: -95 } } ] }
    - { id: fr23, kind: peril, text: "墙上挂着一支冰封的号角，角身缠着褪色的绶带，凑近能听见嗡鸣。", choices: [ { text: "吹响号角", effect: { run_hp: -95, exp: 570, coins: 105 } }, { text: "取走号角", effect: { coins: 210, run_hp: -32 } }, { text: "只解下绶带", effect: { coins: 52, exp: 190 } } ] }
    - { id: fr24, kind: peril, text: "巨大的冰封门扉半掩，门缝里漏出金色的光和细微的乐声。", choices: [ { text: "推门而入", effect: { run_hp: -95, exp: 665 } }, { text: "从门缝偷看", effect: { exp: 380, run_hp: -32 } }, { text: "听完乐声再走", effect: { run_hp: 48, exp: 285 } } ] }
    # —— boon（2）——
    - { id: fr25, kind: boon, text: "冰莲在黑水潭中缓缓开合，每开一次，潭边的霜就化一圈。", choices: [ { text: "摘下冰莲", effect: { run_hp: 120, exp: 380, coins: -52 } }, { text: "守到它开满三轮", effect: { exp: 475, run_hp: 48 } }, { text: "取潭水", effect: { run_hp: 72, coins: 52 } } ] }
    - { id: fr26, kind: boon, text: "王座回廊的尽头，一幅巨大的冰壁画描绘着登塔者失败的九十九种结局。", choices: [ { text: "看完全部壁画", effect: { exp: 570, run_hp: -32 } }, { text: "找画中与你相似的人", effect: { exp: 380, run_hp: -16 } }, { text: "凿下最亮的一角", effect: { coins: 210, run_hp: -47 } } ] }
    # —— flavor（4）——
    - { id: fr27, kind: flavor, text: "呼出的白汽在睫毛上结了一层细霜，眨眼时会掉下来。", choices: [ { text: "对着手心哈气", effect: { run_hp: 6 } } ] }
    - { id: fr28, kind: flavor, text: "成群的冰蝶停在断柱上，翅膀开合间洒下亮晶晶的鳞粉。", choices: [ { text: "拢起双手接", effect: { coins: 21 } }, { text: "屏息等它们飞走", effect: { exp: 38 } }, { text: "挥手赶开", effect: {} } ] }
    - { id: fr29, kind: flavor, text: "冰柱洞里垂着成百上千的冰锥，敲击会发出风铃般的声响。", choices: [ { text: "敲一段旋律", effect: { run_hp: 10 } }, { text: "屏息听回声", effect: { exp: 38 } }, { text: "走过去", effect: {} } ] }
    - { id: fr30, kind: flavor, text: "雪原上散落着人与马的白骨，都朝着同一个方向，没有一具回头。", choices: [ { text: "默数数量", effect: { exp: 38 } }, { text: "为他们立个记号", effect: { run_hp: 10 } }, { text: "快步离开", effect: {} } ] }

  # ============ 深渊回廊（第 81-100 层）============
    # —— elite_fight（1）——
    - { id: fr31, kind: elite_fight, text: "冰壁里封着的东西睁开了眼，冰层从它身上一片片剥落。它的呼吸让空气结出霜花。", choices: [ { text: "摆好架势", effect: { elite_fight: {title: "破冰者"} } }, { text: "在它挣脱前先动手", effect: { elite_fight: {title: "破冰者", stat_bonus: 1.2} } }, { text: "沿冰缝撤离", effect: { run_hp: -50, exp: 60 } } ] }
  abyss:
    # —— blessing（4）——
    - { id: ab01, kind: blessing, text: "虚空中浮着一小团「影尘」，踩上去会印出你此刻最真实的念头。", choices: [ { text: "踩出一句真话", effect: { run_hp: 210, exp: 360 } }, { text: "扫起来收好", effect: { coins: 200 } }, { text: "绕开它", effect: { run_hp: 140 } } ] }
    - { id: ab02, kind: blessing, text: "一段回廊意外地安静，没有低语也没有回声，只有你自己的呼吸。", choices: [ { text: "坐下休息", effect: { run_hp: 280 } }, { text: "趁机整理装备", effect: { run_hp: 140, coins: 100 } }, { text: "默数呼吸", effect: { run_hp: 140, run_mp: 12 } } ] }
    - { id: ab03, kind: blessing, text: "半截沉船悬浮在虚空中，船舱里透着微弱但稳定的灯。", choices: [ { text: "登船取暖", effect: { run_hp: 280 } }, { text: "搜舱", effect: { coins: 200, exp: 180 } }, { text: "研究船的构造", effect: { exp: 360 } } ] }
    - { id: ab04, kind: blessing, text: "一池静止的星光积在低洼处，掬起来会从指缝漏掉，但很暖。", choices: [ { text: "捧一掌焐手", effect: { run_hp: 280 } }, { text: "抹在伤口上", effect: { run_hp: 210, run_mp: 10 } }, { text: "观察它为什么不流走", effect: { exp: 540 } } ] }
    # —— trade（5）——
    - { id: ab05, kind: trade, text: "一个和你一模一样的影子从墙里走出，摊开手心：左手金币，右手旧照片。", choices: [ { text: "接金币", effect: { coins: 200, run_hp: -90, exp: 45 } }, { text: "接照片", effect: { exp: 190, run_hp: -22 } }, { text: "两个都不接", effect: { run_hp: 45, exp: 90 } }, { text: "反问它想要什么", effect: { exp: 135, run_hp: -45 } } ] }
    - { id: ab06, kind: trade, text: "路边支着一顶不属于任何世界的帐篷，帘上写着「用记忆换货物」。", choices: [ { text: "用三天记忆换补给", effect: { run_hp: 350, exp: -540, coins: 200 } }, { text: "用回忆换情报", effect: { exp: 1080, run_hp: -80 } }, { text: "掀帘就走", effect: { run_hp: 70, exp: 360 } } ] }
    - { id: ab07, kind: trade, text: "一座天平立在路中央，左盘放着你的旧伤，右盘空着，等待等重之物。", choices: [ { text: "放上全部补给", effect: { run_hp: 350, exp: 720, coins: -300 } }, { text: "放上一截头发", effect: { run_hp: 140, exp: 900 } }, { text: "把天平掀了", effect: { exp: 900, run_hp: -160, coins: 200 } } ] }
    - { id: ab08, kind: trade, text: "深渊的低语念的全是你会说的语言，句式却错得诡异。", choices: [ { text: "跟它对答", effect: { exp: 1080, run_hp: -200 } }, { text: "默念心法过滤", effect: { run_hp: 140, exp: 540 } }, { text: "用外语骂回去", effect: { exp: 720, run_hp: -80 } } ] }
    - { id: ab09, kind: trade, text: "锁链从虚空垂下，链环上刻着密密麻麻的小字，全是没能说出口的话。", choices: [ { text: "拉动锁链", effect: { exp: 1080, run_hp: -160 } }, { text: "读链环上的字", effect: { exp: 720, run_hp: -80 } }, { text: "解开一节带走", effect: { coins: 400, run_hp: -80, exp: 360 } } ] }
    # —— disaster（4）——
    - { id: ab10, kind: disaster, text: "脚下的平台忽然开始下沉，每踩一块就走低半寸，再不回头。", choices: [ { text: "全速连跳", effect: { run_hp: -160 } }, { text: "稳扎稳打", effect: { run_hp: -80, exp: 360 } }, { text: "掷绳固定", effect: { run_hp: -120, coins: -200 } } ] }
    - { id: ab11, kind: disaster, text: "深渊的低语忽然变得清晰，在念你的名字，一遍比一遍近。", choices: [ { text: "捂住耳朵冲", effect: { run_hp: -120, run_mp: -15 } }, { text: "大声唱回来", effect: { run_hp: -160, exp: 540 } }, { text: "停下与它对视", effect: { run_hp: -200, exp: 720 } } ] }
    - { id: ab12, kind: disaster, text: "黑太阳的日冕闪了一下，你的影子不见了。", choices: [ { text: "立刻找回来", effect: { run_hp: -120, exp: 360 } }, { text: "先适应没有影子", effect: { run_hp: -80 } }, { text: "继续走", effect: { run_hp: -160, run_mp: -10 } } ] }
    - { id: ab13, kind: disaster, text: "空间在前方裂开一道口子，你的身体被轻轻拽长。", choices: [ { text: "锚定自身", effect: { run_hp: -120, exp: 360 } }, { text: "全力后退", effect: { run_hp: -80 } }, { text: "硬扛过去", effect: { run_hp: -200, exp: 540 } } ] }
    # —— gamble（4）——
    - { id: ab14, kind: gamble, text: "一轮黑太阳悬在头顶，日冕是惨白的，照不出影子。", choices: [ { text: "站到原本该有影子的地方", effect: { roll: [ { weight: 1, text: "影子回来了，还带了点东西。", effect: { coins: 400, run_hp: 140 } }, { weight: 3, text: "什么也没发生，只是眼睛酸。", effect: { run_mp: -12 } } ] } }, { text: "闭眼适应", effect: { roll: [ { weight: 1, text: "闭眼时反而看清了路。", effect: { exp: 720 } }, { weight: 2, text: "闭眼后更难辨方向。", effect: { run_hp: -80 } } ] } } ] }
    - { id: ab15, kind: gamble, text: "一只巨大的沙漏横在路中，上半部的沙早已流尽，下半部却纹丝不动。", choices: [ { text: "倒转沙漏", effect: { roll: [ { weight: 1, text: "沙子开始流动，你感觉好些了。", effect: { run_hp: 280, run_mp: 20 } }, { weight: 2, text: "沙子开始流动，你感觉更糟。", effect: { run_hp: -200 } } ] } }, { text: "敲开底座取沙", effect: { roll: [ { weight: 1, text: "沙粒在掌心化成金。", effect: { coins: 600 } }, { weight: 2, text: "沙粒割破了手。", effect: { run_hp: -120 } } ] } } ] }
    - { id: ab16, kind: gamble, text: "虚空中漂着一页页空白的书页，唯有一页写着半句话。", choices: [ { text: "续写下半句", effect: { roll: [ { weight: 1, text: "字迹自己接了下去，你读懂了。", effect: { exp: 1080 } }, { weight: 2, text: "墨迹晕开，什么也没留下。", effect: { run_mp: -15 } } ] } }, { text: "带走那半句", effect: { roll: [ { weight: 1, text: "书页在包里一直发烫。", effect: { coins: 300, exp: 360 } }, { weight: 2, text: "书页在半路化成了灰。", effect: {  } } ] } } ] }
    - { id: ab17, kind: gamble, text: "回声聚成一具骨架的形状，学着你的动作鼓掌，节奏分毫不差。", choices: [ { text: "教它新的动作", effect: { roll: [ { weight: 2, text: "它学会了，还教回你一招。", effect: { exp: 720, run_hp: 140 } }, { weight: 2, text: "它学歪了，拍得你头疼。", effect: { run_mp: -15 } } ] } }, { text: "拆散骨架", effect: { roll: [ { weight: 1, text: "骨架里掉出东西。", effect: { coins: 400 } }, { weight: 2, text: "骨架散了又聚。", effect: { run_hp: -120 } } ] } } ] }
    # —— trap（4）——
    - { id: ab18, kind: trap, text: "虚空中悬着一盏深渊灯火，焰心是反的，火苗朝下燃烧。", choices: [ { text: "取火引燃自己的灯", effect: { exp: 720, run_hp: -160 } }, { text: "以手拢焰取暖", effect: { run_hp: 280, exp: 180 } }, { text: "吹灭它", effect: { exp: 540, run_hp: -160 } } ] }
    - { id: ab19, kind: trap, text: "一面立在虚无里的穿衣镜，镜中的你衣着华贵、神情倨傲，开口说了句话。", choices: [ { text: "听它说什么", effect: { exp: 1080, run_hp: -240 } }, { text: "一拳打碎镜子", effect: { run_hp: -120, exp: 720, coins: 200 } }, { text: "整理衣冠后离开", effect: { run_hp: 140, exp: 540 } } ] }
    - { id: ab20, kind: trap, text: "一株彼岸花开在虚无里，花与叶隔着一步永远无法相触。", choices: [ { text: "摘下花朵", effect: { run_hp: 280, exp: 720, coins: -200 } }, { text: "连土掘起", effect: { coins: 500, run_hp: -160, exp: 180 } }, { text: "替它们挪近一步", effect: { exp: 900, run_hp: -40 } } ] }
    - { id: ab21, kind: trap, text: "失重的墓园里，一座座石碑缓缓自转，碑文朝向四面八方。", choices: [ { text: "读完一百座碑", effect: { exp: 1080, run_hp: -120 } }, { text: "扶正一座碑", effect: { exp: 540, run_hp: 140 } }, { text: "收集碑前供品", effect: { coins: 400, run_hp: -80, exp: -180 } } ] }
    # —— peril（3）——
    - { id: ab22, kind: peril, text: "地面积着一层薄薄的影尘，踩上去会印出你此刻最真实的念头。", choices: [ { text: "踩进最深处", effect: { run_hp: -160, exp: 1080 } }, { text: "踩出一句真话", effect: { exp: 720, run_hp: -40 } }, { text: "擦掉别人的字迹", effect: { run_hp: -120, exp: 720 } } ] }
    - { id: ab23, kind: peril, text: "黑洞的边缘在不远处缓缓转动，你的身体开始被轻轻拽长。", choices: [ { text: "再靠近一步", effect: { run_hp: -280, exp: 1440 } }, { text: "锚定自身稳住", effect: { exp: 720, run_hp: -80 } }, { text: "掠取一圈光丝", effect: { coins: 600, run_hp: -200, exp: 360 } } ] }
    - { id: ab24, kind: peril, text: "终焉之门在回廊尽头合拢又张开，门缝里的光每次开合都换一种颜色。", choices: [ { text: "在最大时穿过", effect: { run_hp: -280, exp: 1440, coins: 200 } }, { text: "数够七次开合", effect: { exp: 900, run_hp: -80 } }, { text: "卡住门缝研究", effect: { coins: 500, exp: 720, run_hp: -160 } } ] }
    # —— boon（2）——
    - { id: ab25, kind: boon, text: "一页页空白的书页忽然齐齐转向你，像是等你写下第一句。", choices: [ { text: "写下自己的名字", effect: { exp: 1260, coins: 200 } }, { text: "只读不写", effect: { exp: 900 } }, { text: "合上它们", effect: { run_hp: 210, exp: 360 } } ] }
    - { id: ab26, kind: boon, text: "一座天平在回廊中央自己缓缓摆动，两盘都空着。", choices: [ { text: "放上自己的一段记忆", effect: { exp: 1440, run_hp: -80 } }, { text: "看着它摆", effect: { exp: 720, run_hp: 140 } }, { text: "按住它", effect: { run_mp: 20, exp: 360 } } ] }
    # —— flavor（4）——
    - { id: ab27, kind: flavor, text: "回廊没有墙壁，栏杆外就是虚无，站久了会分不清上下。", choices: [ { text: "闭眼凭直觉走", effect: { exp: 90 } } ] }
    - { id: ab28, kind: flavor, text: "星星在「下方」组成一条河，缓缓地流。", choices: [ { text: "数一数", effect: { exp: 72 } }, { text: "伸手去够", effect: { run_hp: 28 } }, { text: "看着就好", effect: {} } ] }
    - { id: ab29, kind: flavor, text: "无声的钟悬在空中，指针乱转，靠近时能听见自己被放大的心跳。", choices: [ { text: "听一会儿", effect: { exp: 72 } }, { text: "把手按在钟面", effect: { run_hp: 28 } }, { text: "快步走开", effect: {} } ] }
    - { id: ab30, kind: flavor, text: "虚空中漂着一张烫金请柬，署名只有一个词：「深渊」。", choices: [ { text: "读一遍", effect: { exp: 72 } }, { text: "收进怀里", effect: { run_hp: 28 } }, { text: "任它飘走", effect: {} } ] }
    # —— elite_fight（1）——
    - { id: ab31, kind: elite_fight, text: "虚空里浮出一个轮廓，它模仿你的站姿，却比你高出一个头。它抬手时，你也抬了手。", choices: [ { text: "迎向它", effect: { elite_fight: {title: "镜像侵噬"} } }, { text: "先绕到侧面", effect: { elite_fight: {title: "镜像侵噬", stat_bonus: 1.15, hp_pct: 0.25} } }, { text: "闭眼退开", effect: { run_hp: -90, exp: 110 } } ] }
