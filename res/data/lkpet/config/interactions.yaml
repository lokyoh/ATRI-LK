# 互动效果。喂食自 2026-10-16 起不再区分食物：饥饿恢复取 effects.feed.hunger 固定值。
# 喂食/玩耍/洗澡/休息 的好感收益统一为 3d10（见下方 affection_roll）。

effects:
  feed: { hunger: 30, mood: 0 }
  play: { mood: 10, fatigue: 10 }
  bathe: { cleanliness: 30, mood: -5 }
  rest: { fatigue_recover: 20, mood: 5 }
  train:
    hunger: -15      # 训练消耗饥饿
    fatigue: 15      # 训练增加疲劳
    mood: -10        # 训练降低心情
    exp_base: 500    # 基础经验值
    exp_tiers:       # 根据肉鸽最高层数动态调整经验
      - { floor: 0, exp: 500 }
      - { floor: 21, exp: 1000 }
      - { floor: 41, exp: 2000 }
      - { floor: 61, exp: 5000 }
      - { floor: 81, exp: 10000 }
      - { floor: 100, exp: 20000 }

affection_roll:
  count: 3
  sides: 10
