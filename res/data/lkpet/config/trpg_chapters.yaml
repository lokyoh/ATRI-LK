# 跑团章节剧情（任务书 §13，由 trpg.yaml 的 chapters.file 指向）。
#
# 剧本清单（9 个）：
#   单人 5 个（trpg.yaml chapters.order，按序推进）：
#     c_manor 雨夜庄园 · c_well 雾谷古井 · c_lighthouse 孤港灯塔 · c_train 末班列车 · c_market 雾都夜市
#   多人（组队）3 个（trpg.yaml chapters.party_ids，开团时随机取一）：
#     p_inn 荒村客栈 · p_caravan 商队护送 · p_temple 古庙封印
#   短团本 1 个（short: true，chapters.short_ids）：c_tunnel 废矿探秘
#
# 场景图结构：
#   scenes.<id>.text        场景描述（多句氛围文本）
#   scenes.<id>.choices[]   候选行动（编号应答；组队时由队长代提交）
#     .text                 行动描述
#     .next                 无检定时前往的场景
#     .key: true            关键抉择（写入传记 key_choice）
#     .check                技能检定 { skill, difficulty: 普通|困难|极难, success, failure }
#   scenes.<id>.end: true   章节通关（该场景无 choices）
#
# 难度目标：普通 = 技能值，困难 = 技能值×0.5，极难 = 技能值×0.2；档位展示另按 check 规则。
# 设计约定：每章「回复 1」的最短路径必须 ≤6 步抵达通关场景（编号 1 永远是推进项）；
#          每章 4–7 个结局，非终局场景必须有出路、全部场景从 start 可达。

chapters:
  # ============================================================
  # 单人 · 第一章（6 结局）
  # ============================================================
  c_manor:
    title: 雨夜庄园
    short: false
    start: gate
    scenes:
      gate:
        text: >
          夜雨滂沱，你沿着泥泞的石阶爬上山坡。庄园主屋只亮着一扇窗，
          烛光在雨幕里晕成一团模糊的暖色；铁门虚掩，石阶尽头立着一位撑黑伞的管家，
          他收伞的动作不紧不慢，像是已经等了你很久。
        choices:
          - text: 敲门拜访
            next: hall
            key: true
          - text: 翻越铁门
            check: { skill: 攀爬, difficulty: 困难, success: garden, failure: fence_fall }
          - text: 隔窗窥探
            check: { skill: 侦查, difficulty: 普通, success: hall, failure: corridor }
      fence_fall:
        text: >
          你翻过铁门却踩空半步，整个人摔进冰冷的泥地。窗边打盹的黑猫被惊得竖起背毛，
          冲你嘶了一声；屋里随即传来椅子拖动的声响，有人朝门口走来。
        choices:
          - text: 爬起来走向正门
            next: hall
      garden:
        text: >
          花园里的蔷薇疯长得近乎无礼，肥厚的花瓣沾着雨也懒得抖落。
          侧门虚掩着，门缝里漏出翻书的沙沙声，混着壁炉木柴的噼啪——
          这声音在空庄园里显得过于日常了。
        choices:
          - text: 溜进侧门
            check: { skill: 攀爬, difficulty: 普通, success: library, failure: corridor }
          - text: 走正门会合
            next: hall
      hall:
        text: >
          大厅高得能听见雨声在穹顶回旋。管家垂手立在壁炉旁，火光把他的影子拉得很长；
          他不问你的来意，只淡淡地说：「雨停之前，庄园里的每一扇门都可以打开。」
          壁炉上方挂着十几幅肖像画，画中人的眼睛似乎都朝着同一个方向。
        choices:
          - text: 与管家交谈
            check: { skill: 说服, difficulty: 普通, success: study, failure: corridor }
          - text: 检查壁炉
            check: { skill: 侦查, difficulty: 困难, success: study, failure: corridor }
          - text: 环视大厅的肖像
            check: { skill: 聆听, difficulty: 普通, success: gallery, failure: corridor }
      gallery:
        text: >
          你数到第七幅肖像时停住了——第七幅画里没有人，只有一扇门，
          门上的铜环在你注视的瞬间轻轻晃了一下，仿佛刚有人穿过画面离开。
        choices:
          - text: 凝视画中的那扇门
            check: { skill: 神秘学, difficulty: 普通, success: study, failure: corridor }
            key: true
          - text: 检查画框背后的机关
            check: { skill: 侦查, difficulty: 困难, success: study, failure: corridor }
      corridor:
        text: >
          走廊尽头立着两扇门：左边那扇透出旧书页与皮革的味道；
          右边那扇的门缝里渗出一线冷风，风里有海的咸味——这座山不该靠海。
          脚下的地毯有规律地起伏了一下，像有什么东西从腹下爬过。
        choices:
          - text: 推开书房的门
            next: library
          - text: 推开冷风的门
            next: study
            key: true
      library:
        text: >
          书房四壁都是顶到天花板的藏书，梯凳停在半空，显然有人刚从高处下来。
          桌上摊着一本庄园日记，墨迹在烛光下泛着湿润的光，最后一页停在一个句子的中途：
          「今夜来的这位，和上一位一样带着——」
        choices:
          - text: 阅读日记
            check: { skill: 图书馆, difficulty: 普通, success: ending_clue, failure: ending_no_clue }
            key: true
          - text: 检查书架后的暗格
            check: { skill: 侦查, difficulty: 困难, success: ending_vault, failure: ending_no_clue }
      study:
        text: >
          书房的书架后面藏着一道密门，门上刻满褪色的符文，摸上去像结冰的血管。
          符文的排布你在某本旧书里见过——那本书当时被锁在玻璃柜里，你不曾读完。
          门缝里漏出的冷风带着潮气，像呼吸。
        choices:
          - text: 研读符文开门
            check: { skill: 神秘学, difficulty: 普通, success: ending_seal, failure: ending_trap }
          - text: 后退半步寻找气流的来处
            check: { skill: 侦查, difficulty: 困难, success: ending_passage, failure: ending_trap }
      ending_clue:
        end: true
        outcome: good
        text: >
          日记记载了庄园借雨夜吞没来客的旧事，最后一页写着你进门的时刻。
          你带着线索在黎明前离开了庄园——这一夜，值得记进传记。
      ending_no_clue:
        end: true
        outcome: bad
        text: >
          日记的字迹被水汽晕开，你只读出半句「……他也会成为墙的一部分」。
          你合上书走出庄园，庄园的秘密仍埋在雨里，等下一个敢敲门的人。
      ending_vault:
        end: true
        outcome: good
        text: >
          暗格里是一叠前人的证件，照片上的脸各不相同，最新一张是你。
          你撕下自己的那张带走——庄园从此少了一个名字，多了一个谜。
      ending_seal:
        end: true
        outcome: good
        text: >
          符文应声而开，门后是一间封存着暖光的密室，某件被镇压多年的东西重见天日。
          管家在你身后微微鞠躬：「庄园等的就是你。」从今夜起，你成了它新的守护者。
      ending_trap:
        end: true
        outcome: bad
        text: >
          符文反噬出一道青光，密门轰然闭合，震落书架上的灰。
          你揉着手腕退出书房，记住了这道门的脾气——下次带本《符文入门》再来。
      ending_passage:
        end: true
        outcome: good
        text: >
          气流来自书架后的通风道，你猫腰爬行百米，从庄园后门的排水口钻了出去。
          身后的烛光一盏盏熄灭——它知道你走了，但没有追。

  # ============================================================
  # 单人 · 第二章（5 结局）
  # ============================================================
  c_well:
    title: 雾谷古井
    short: false
    start: cliff
    scenes:
      cliff:
        text: >
          山谷尽头横着一口古井，井沿的凿痕已被岁月磨平。井绳上刻着褪色的符文，
          雾气像呼吸一样从井口一进一出，仿佛井底藏着另一个会喘气的世界。
          井台边丢着半截断绳，断口是被什么利器整齐削断的。
        choices:
          - text: 观察井口
            check: { skill: 侦查, difficulty: 普通, success: ledge, failure: echo }
          - text: 大声呼喊
            next: echo
      echo:
        text: >
          你的喊声坠入井里，半晌，井底传来一个模糊的应答——音节和你刚才说的一模一样，
          却慢了整整两拍，像有人在很认真地、一字一顿地模仿你。
          第三遍时，它开始抢在你前面开口。
        choices:
          - text: 顺绳下井
            check: { skill: 攀爬, difficulty: 困难, success: underground, failure: ledge }
          - text: 等待应答者上来
            next: ledge
      ledge:
        text: >
          你踩着湿滑的石沿稳住身形。井壁上嵌着一枚发光的石片，光随你的呼吸明灭；
          脚边的绳结在轻轻晃动，像在催促你做出决定。石片下方刻着一行小字：「答者得入」。
        choices:
          - text: 撬下石片
            check: { skill: 攀爬, difficulty: 普通, success: underground, failure: ledge_fall }
          - text: 顺着绳索继续下井
            next: underground
            key: true
      ledge_fall:
        text: >
          石片脱落的瞬间你脚下一滑，肩膀重重磕在石阶上。好在离井底只剩一段——
          黑暗里有什么东西接住了你，是水，凉得不像井水，更像有人用手托了一下。
        choices:
          - text: 攀起身继续
            next: underground
      underground:
        text: >
          井底别有洞天：地下水潭中央浮着一颗沉睡的光团，周围悬着细小的水珠，
          像一群屏住呼吸的萤火虫。凑近了能听见它在很慢、很慢地打鼾。
          水潭边缘有一道半淹的暗流口，黑水在口子里打着旋。
        choices:
          - text: 触碰光团
            check: { skill: 神秘学, difficulty: 普通, success: ending_light, failure: ending_dark }
            key: true
          - text: 取一点水样
            next: ending_water
          - text: 潜入水下的暗流
            check: { skill: 生存, difficulty: 困难, success: ending_river, failure: underwater }
      underwater:
        text: >
          黑水裹住你的瞬间，耳膜像被按住。你在水下摸到一条绷直的绳索——
          一端系着什么沉重的东西，另一端通往完全相反的两个方向。
        choices:
          - text: 奋力抓绳上浮
            check: { skill: 生存, difficulty: 普通, success: ending_water, failure: ending_sunk }
          - text: 顺水流漂向深处
            check: { skill: 聆听, difficulty: 困难, success: ending_river, failure: ending_sunk }
            key: true
      ending_light:
        end: true
        outcome: good
        text: >
          光团在你掌心化作暖流，顺着胳膊流进胸口，古井的秘密与你共享。
          谷中的雾散了，阳光第一次照到井底——它一直在等一个敢伸手的人。
      ending_dark:
        end: true
        outcome: bad
        text: >
          光团骤然熄灭，井底陷入彻底的黑暗，只有水声在替你数着心跳。
          你摸索着爬出古井，背后再无应答，只剩雾贴着井口打转。
      ending_water:
        end: true
        outcome: good
        text: >
          你灌满一瓶井水，水在瓶里微微发光。日后它或许能派上用场——
          至少从今天起，你知道了井的位置，也领教了井的脾气。
      ending_river:
        end: true
        outcome: good
        text: >
          黑水把你送到一条地下河的浅滩，河水一路向下、一路向亮。
          你拖着湿透的身体走出谷口——井底的光在你背后轻轻亮了一下，像在道别。
      ending_sunk:
        end: true
        outcome: bad
        text: >
          绳索从指缝间滑走的那一瞬，你明白了「答者得入」的真正意思。
          雾谷恢复了平静，井口的雾一进一出，像什么都没发生过。

  # ============================================================
  # 单人 · 第三章（4 结局）
  # ============================================================
  c_lighthouse:
    title: 孤港灯塔
    short: false
    start: pier
    scenes:
      pier:
        text: >
          暴雨夜，孤港的灯塔已经熄灭三天。断桅的渔船被浪拍在栈桥上，
          缆绳在风里抽打着桅杆发出闷响；灯塔看守人的小屋却透出一线微光——
          而看守人两周前就失踪了，镇上没人敢来。
        choices:
          - text: 喊话报名来意
            check: { skill: 说服, difficulty: 普通, success: keeper_room, failure: beach }
          - text: 冒雨攀上灯塔
            check: { skill: 攀爬, difficulty: 困难, success: light_top, failure: beach }
          - text: 检查码头货箱
            check: { skill: 侦查, difficulty: 普通, success: crate, failure: keeper_room }
      beach:
        text: >
          一个浪头把你拍在滩涂上，咸水灌进领口。礁石缝里卡着半截桅杆，
          桅杆上缠着一绺红布——像是从灯塔旗绳上撕下来的，断口还很新。
          远处的浪墙上，有什么东西正贴着水面移动。
        choices:
          - text: 顺着红布找上灯塔
            next: light_top
            key: true
          - text: 在滩涂上搜寻冲岸物
            next: crate
      crate:
        text: >
          潮水推来一只撬开一半的木箱，里面是油纸包着的航海日志，封面写着看守人的名字。
          最后几页被水泡涨，字迹肿成一团，像有什么东西在纸上爬过。
          箱底压着一枚铜制船徽，背面刻着「值夜者」三个字。
        choices:
          - text: 晾开日志逐页辨读
            check: { skill: 图书馆, difficulty: 普通, success: keeper_room, failure: storm_cellar }
            key: true
          - text: 只翻最后一页
            next: storm_cellar
      keeper_room:
        text: >
          小屋里的茶还温着，桌上摊着同一本航海日志的另一半——原来箱里那本是副本。
          墙上钉着一张海图，出海的航线全被红笔圈掉，只剩通往灯塔的那条还留着；
          海图旁挂着一把黄铜钥匙，标签写着「钟楼」。
        choices:
          - text: 对照两本日志
            check: { skill: 图书馆, difficulty: 困难, success: bell_tower, failure: storm_cellar }
          - text: 搜查看守人的抽屉
            check: { skill: 侦查, difficulty: 普通, success: bell_tower, failure: storm_cellar }
      bell_tower:
        text: >
          钟楼的铜钟蒙着灰，钟绳却被人擦得发亮。墙角的海图筒里塞着一卷纸，
          纸上是船长的笔迹：「灯不亮的第三夜，海会把东西送回来。」
        choices:
          - text: 摇响铜钟为灯塔示警
            check: { skill: 生存, difficulty: 普通, success: light_top, failure: storm_cellar }
            key: true
          - text: 读完海图筒里的纸条
            check: { skill: 图书馆, difficulty: 普通, success: captain_room, failure: storm_cellar }
      captain_room:
        text: >
          塔顶的船长室一切如昨：桌上摊着航海志，最后一页的墨迹停在失踪当晚，
          罗盘的指针却不指向北，而是固执地指着海面。
        choices:
          - text: 读完航海志的最后一页
            check: { skill: 图书馆, difficulty: 普通, success: ending_log, failure: ending_dark }
            key: true
          - text: 收起罗盘离开船长室
            next: ending_dawn
      storm_cellar:
        text: >
          地窖里堆着防风灯和发霉的绳索，最里面的墙上用指甲刻着一行歪斜的字：
          「灯灭的第三夜，海会把东西送回来。」刻痕里还嵌着干涸的血。
          角落有一盏装好的防风灯，灯芯浸在新油里。
        choices:
          - text: 带上防风灯去点灯
            next: light_top
            key: true
      light_top:
        text: >
          灯室的玻璃碎了一角，风雨从破口灌进来，灯芯浸在油里早已熄透。
          你探头望向海面——远处的浪墙上，有什么东西正顺着潮水缓缓靠近岸边，
          它没有眼睛，却明显知道灯塔上站着人。
        choices:
          - text: 立刻重新点灯
            check: { skill: 生存, difficulty: 普通, success: ending_lit, failure: ending_dark }
            key: true
          - text: 先看清海面上的东西
            check: { skill: 侦查, difficulty: 困难, success: ending_lit, failure: ending_dark }
      ending_lit:
        end: true
        outcome: good
        text: >
          灯重新亮起的瞬间，光柱扫过海面，浪墙上的黑影发出一声不甘的呜咽退回深海。
          港湾得救了。你守着这盏灯直到雨停——镇上会记住点灯的人。
      ending_dark:
        end: true
        outcome: bad
        text: >
          你终究没能让灯亮起来。天亮时浪退了，码头上多了几件不属于渔船的东西。
          你看了一眼就转身离开——有些夜，只能靠活着带走答案。
      ending_log:
        end: true
        outcome: good
        text: >
          航海志的最后一页写着看守人自愿留下的原因：「海要一个守夜的人，换一港的晴天。」
          你收起日志走出船长室——这一夜，你替他守完了。
      ending_dawn:
        end: true
        outcome: good
        text: >
          你握着那枚不指北的罗盘离开灯塔。天亮时云散了，
          罗盘的指针转了半圈，从此指向你下一次要去的地方。

  # ============================================================
  # 单人 · 第四章（5 结局）
  # ============================================================
  c_train:
    title: 末班列车
    short: false
    start: platform
    scenes:
      platform:
        text: >
          零点的站台空无一人，末班列车喷着白汽进站，车厢的灯一节比一节暗。
          售票窗的玻璃后面，一只手正慢慢地、慢慢地把找零推出来，硬币在台面上转了很久才停。
          广播里念着一个不存在的终点站名。
        choices:
          - text: 上车找个座位
            next: carriage
            key: true
          - text: 先观察站台动静
            check: { skill: 侦查, difficulty: 普通, success: conductor, failure: carriage }
          - text: 与售票员搭话
            check: { skill: 说服, difficulty: 普通, success: conductor, failure: carriage }
      carriage:
        text: >
          车厢里坐着七位乘客：织毛衣的老妇、抱着空鸟笼的商人、一直盯着窗外的孩子……
          窗外没有风景，只有同样一节车厢的灯光无穷无尽地向后延伸。
          厢门连接处飘来餐车的黄油香，混着一丝不属于食物的铁锈味。
        choices:
          - text: 挨个打量乘客
            check: { skill: 侦查, difficulty: 普通, success: seat, failure: dream }
          - text: 与织毛衣的老妇攀谈
            check: { skill: 说服, difficulty: 普通, success: secret, failure: dream }
          - text: 靠窗闭目养神
            next: dream
          - text: 去餐车透透气
            next: dining
      dining:
        text: >
          餐车里只有一位列车员在擦杯子，吧台上摆着七份冒着热气的宵夜，
          每一份的桌牌都写着同一个姓氏——你的姓氏。
        choices:
          - text: 打听末班车的传闻
            check: { skill: 聆听, difficulty: 普通, success: secret, failure: dream }
          - text: 顺走吧台上的怀表
            check: { skill: 侦查, difficulty: 困难, success: secret, failure: dream }
          - text: 吃完那份写着你姓氏的宵夜
            next: ending_hotmeal
            key: true
      conductor:
        text: >
          查票员站在车厢连接处，制服熨得笔挺，帽檐压得很低。他伸出手：
          「车票，或者一样你舍不得的东西。」他的手套湿漉漉的，像刚从海里捞出来。
        choices:
          - text: 递上一枚旧硬币
            check: { skill: 说服, difficulty: 普通, success: carriage, failure: dream }
          - text: 翻遍口袋找车票
            check: { skill: 图书馆, difficulty: 困难, success: seat, failure: dream }
      seat:
        text: >
          你坐进靠窗的位子，座位下压着前人留下的一张车票，背面写着：
          「下一站是昨天，别下车。」车轮的节奏渐渐和你的心跳重合。
        choices:
          - text: 收好车票坐稳
            check: { skill: 聆听, difficulty: 普通, success: ending_keep, failure: ending_lost }
          - text: 按车票说的做，绝不下车
            next: secret
          - text: 翻上尽头的行李车厢
            check: { skill: 攀爬, difficulty: 困难, success: luggage, failure: ending_lost }
      luggage:
        text: >
          行李车厢里堆着几十只旧皮箱，每只箱子的行李牌上都写着不同的名字，
          只有最新那只写着你。箱缝里漏出不属于这个季节的花香。
        choices:
          - text: 检查那只属于你的箱子
            check: { skill: 图书馆, difficulty: 普通, success: ending_luggage, failure: ending_lost }
            key: true
          - text: 在行李间睡到终点
            next: ending_dawn
      dream:
        text: >
          你昏沉睡去。梦里列车穿过一条由记忆铺成的隧道：站名全是你去过的地方，
          每一站都有人朝你挥手，却没有一张脸是你认识的。
          第七站的站牌上写着你的名字，字迹是新的。
        choices:
          - text: 在梦里数车厢
            check: { skill: 聆听, difficulty: 困难, success: secret, failure: ending_lost }
          - text: 强行睁眼醒来
            check: { skill: 生存, difficulty: 普通, success: seat, failure: ending_lost }
      secret:
        text: >
          老妇把织了一半的毛衣塞给你，针脚里夹着一张字条：「末班车上，看守人比乘客多。」
          她指指车窗——窗外站着一排和车内乘客一模一样的人，正朝你挥手，
          其中一个也在朝你挥手的姿势里，慢慢织着一件一模一样的毛衣。
        choices:
          - text: 拉上窗帘不再看
            check: { skill: 生存, difficulty: 普通, success: ending_keep, failure: ending_lost }
            key: true
          - text: 打开车窗问外面的人
            check: { skill: 说服, difficulty: 困难, success: ending_keep, failure: ending_lost }
      ending_keep:
        end: true
        outcome: good
        text: >
          列车在一个无名小站停下，你抱着毛衣跳下车，身后灯光很快远去。
          手里的车票温热——你带回了昨夜的证物，也带回一段没人肯讲完的故事。
      ending_lost:
        end: true
        outcome: bad
        text: >
          再睁眼时车厢空了，窗外换成你熟悉的站台，仿佛什么都没发生。
          只有口袋里多了一枚湿漉漉的硬币，提醒你末班车载过你一程。
      ending_luggage:
        end: true
        outcome: good
        text: >
          箱子里没有衣物，只有一叠你从未去过的地方的车票，日期全是未来。
          你合上箱子把它留在原处——总有一天，你会用得上其中一张。
      ending_dawn:
        end: true
        outcome: good
        text: >
          你在行李间睡得很沉，醒来时列车停在终点，天光大亮，空无一人。
          站台的广播念出了那个站名——和你梦里第七站的一模一样。
      ending_hotmeal:
        end: true
        outcome: good
        text: >
          你在餐车吃完了那份写着你姓氏的宵夜，味道像很久以前的家。
          列车员收走盘子时说：「下一站，你可以在任何一站下车。」你决定先吃完这顿。

  # ============================================================
  # 单人 · 第五章（5 结局）
  # ============================================================
  c_market:
    title: 雾都夜市
    short: false
    start: gate
    scenes:
      gate:
        text: >
          雾都的夜市只在雾起时开张，灯笼的光被水汽晕成一团团橙色。
          叫卖声、算命的铜铃、糖画刮石板的沙沙声搅在一起——入口却贴着一张新告示：
          「生人莫问价，问价莫回头。」告示的落款日期是明天。
        choices:
          - text: 挤进人群四处看看
            check: { skill: 侦查, difficulty: 普通, success: stalls, failure: guide }
          - text: 找个本地向导带路
            check: { skill: 说服, difficulty: 普通, success: guide, failure: stalls }
          - text: 上屋顶俯瞰全局
            check: { skill: 攀爬, difficulty: 困难, success: rooftop, failure: stalls }
      stalls:
        text: >
          摊位上摆的净是稀奇货：封在琥珀里的夏天、能倒着走的怀表、一摞没有字的旧书。
          卖货老板眼皮都不抬：「看可以，问价之前想清楚你付得起什么。」
          他右手的食指缺了半截，伤口整齐得不像意外。
        choices:
          - text: 和老板讨价还价
            check: { skill: 说服, difficulty: 普通, success: ending_bargain, failure: guide }
          - text: 翻看那摞无字旧书
            check: { skill: 图书馆, difficulty: 困难, success: backroom, failure: guide }
          - text: 盯着摊主缺半截的手指
            check: { skill: 侦查, difficulty: 普通, success: riverbank, failure: alleys }
      guide:
        text: >
          向导是戴鸭舌帽的瘦高个，指节上全是墨渍：「跟紧我，别应陌生人的搭话，
          别接递过来的东西。」他领你穿过三条巷子，前面巷口挂着「内市」的木牌，
          牌下还钉着一张寻人启事——照片上的人和向导长得一模一样。
        choices:
          - text: 跟他进内市
            check: { skill: 聆听, difficulty: 普通, success: backroom, failure: alleys }
          - text: 边走边打听夜市规矩
            check: { skill: 说服, difficulty: 普通, success: rooftop, failure: alleys }
      rooftop:
        text: >
          屋顶的瓦被雾打得发滑，你伏在檐脊上俯瞰：整片夜市呈圆形，
          正中央的摊位没有招牌，只挂了一盏白灯，所有巷子都通向它。
          白灯下没有摊主，只有一把对着空椅子的算盘。
        choices:
          - text: 记下路线再下去
            check: { skill: 侦查, difficulty: 困难, success: backroom, failure: alleys }
            key: true
          - text: 直接跳到白灯摊前
            next: backroom
      alleys:
        text: >
          你和向导走散了。巷子里的灯笼一盏接一盏熄灭，身后的叫卖声退得很远，
          只剩自己的脚步声多出半个拍子——有人在学你走路。
        choices:
          - text: 原地不动等雾散
            check: { skill: 生存, difficulty: 普通, success: stalls, failure: ending_lost }
          - text: 沿地上的湿脚印走
            check: { skill: 侦查, difficulty: 困难, success: backroom, failure: ending_lost }
          - text: 沿河岸寻找后门
            next: riverbank
      riverbank:
        text: >
          沿河的石栏上结着一层滑腻的青苔，河面停着一条乌篷船，船夫戴着斗笠一动不动，
          船头的灯笼上写着「渡」。对岸有扇半开的后门，门缝里漏出白灯的光。
        choices:
          - text: 上船请船夫渡你过河
            check: { skill: 说服, difficulty: 普通, success: backroom, failure: ending_lost }
          - text: 沿岸摸黑找到后门
            check: { skill: 生存, difficulty: 普通, success: backroom, failure: ending_lost }
            key: true
      backroom:
        text: >
          白灯后面是一间没有雾的小屋，柜台后的人戴着鸟喙面具：
          「内市只收两种钱——秘密，和你再也用不到的运气。选一样，换你想要的。」
          柜台玻璃下压着一排字条，每张都是别人换出去的秘密。
        choices:
          - text: 讲一个从未对人说过的秘密
            check: { skill: 说服, difficulty: 普通, success: ending_secret, failure: ending_deal }
            key: true
          - text: 用运气下注换货
            next: ending_deal
          - text: 掀开鸟喙面具看清摊主
            check: { skill: 闪避, difficulty: 困难, success: ending_unmask, failure: ending_deal }
      ending_bargain:
        end: true
        outcome: good
        text: >
          你砍价砍到老板肉痛，最后他多塞给你一枚「问路币」：「下次雾起，
          报我的价码能便宜三成。」你揣着战利品挤出夜市，身后传来他不甘心的吆喝。
      ending_secret:
        end: true
        outcome: good
        text: >
          你说完秘密，面具人沉默了很久，然后递来一只细长木盒：「等价交换。
          盒子会在你最需要它的那天自己打开。」你走出夜市时，雾刚好散了。
      ending_deal:
        end: true
        outcome: bad
        text: >
          你签下内市的契据，指尖有点发凉。交易已经完成，货品确实有用——
          只是契据最后一行小字你没来得及看清：「运气」二字后面，写着偿还的日期。
      ending_unmask:
        end: true
        outcome: good
        text: >
          你掀开面具——面具下是你自己的脸，嘴角挂着你此刻没有的表情：
          「总算有人来替我站柜台了。」你把面具扣回原处，快步离开，
          身后传来一声如释重负的叹息。
      ending_lost:
        end: true
        outcome: bad
        text: >
          雾散时你站在夜市入口，灯笼一盏都不见了，地上只剩湿透的告示：
          「生人莫问价，问价莫回头。」你回头了——好在身后什么都没有。

  # ============================================================
  # 多人（组队）· 剧本一（4 结局；开场第 1 项带检定）
  # ============================================================
  p_inn:
    title: 荒村客栈
    short: false
    start: inn_road
    scenes:
      inn_road:
        text: >
          荒村口唯一的亮光来自「歇脚」二字的灯笼招牌。门板半掩，堂里没有食客的脚步声，
          只有一盏油灯在柜台上摇。队长抬手示意停下——客栈里静得能听见灯芯结花的声音。
          门楣上新贴的对联还泛着墨光，落款日期是一百年以前。
        choices:
          - text: 敲门报名投宿
            check: { skill: 说服, difficulty: 普通, success: counter, failure: hall }
          - text: 绕到后门查看
            check: { skill: 攀爬, difficulty: 普通, success: cellar, failure: hall }
          - text: 先听里面的动静
            check: { skill: 聆听, difficulty: 普通, success: whisper, failure: hall }
      hall:
        text: >
          大堂的桌上摆着七副碗筷，粥还是热的，人却一个都没有。
          楼梯口的阴影里似乎有什么东西在缓缓呼吸，油灯的火苗齐齐偏向同一个方向——
          偏向你们站的位置。
        choices:
          - text: 向柜台高声呼喊
            check: { skill: 说服, difficulty: 普通, success: counter, failure: whisper }
          - text: 摸索着上楼梯
            check: { skill: 侦查, difficulty: 普通, success: stairs, failure: whisper }
          - text: 靠墙守夜听动静
            check: { skill: 聆听, difficulty: 困难, success: whisper, failure: stairs }
      counter:
        text: >
          柜台后的账簿摊开着，墨迹最新的一行写着七个人的名字，入住日期全是今天——
          而备注栏里，七个名字都被同一个符号划掉了。
          账簿旁压着一串铜钥匙，共七把，第七把是新配的。
        choices:
          - text: 翻看整本账簿
            check: { skill: 图书馆, difficulty: 普通, success: cellar, failure: upper }
            key: true
      whisper:
        text: >
          声音来自楼梯下的阴影，像很多人同时在念一串数字，念到第七遍就从头再来。
          你数了数桌上碗筷——正好七副。念数声在你数完的那一刻停了，又从第一遍开始。
        choices:
          - text: 循声靠近阴影
            check: { skill: 神秘学, difficulty: 普通, success: upper, failure: room }
            key: true
      stairs:
        text: >
          木质楼梯在踩上去时发出近乎叹息的吱呀声。二楼走廊比一楼长得多——
          明明是同一栋楼，窗外的村子却已经沉到了窗沿以下。
          走廊尽头有微弱的烛光，烛光里有人在来回踱步。
        choices:
          - text: 快步走上二楼
            next: upper
      upper:
        text: >
          二楼走廊两侧有三扇门：左门缝里漏出灯光，右门下塞着干涸的黑渍，
          尽头那扇门上用粉笔画着一个歪歪扭扭的「七」。
          踮脚看门牌：左房挂着「天字柒号」，右房的门牌被撬走了。
        choices:
          - text: 推开左边亮灯的门
            check: { skill: 闪避, difficulty: 普通, success: room, failure: trap }
          - text: 推开画七的门
            next: cellar
          - text: 对着左房门缝报上名号
            check: { skill: 说服, difficulty: 普通, success: room, failure: trap }
      room:
        text: >
          房里一切整齐得过分：叠好的被褥、摆正的鞋、压在枕下的七封家书，
          信封上的收信人各不相同，寄出日期却都是明天。
          梳妆镜上蒙着布，布下有什么东西在轻微起伏，像在呼吸。
        choices:
          - text: 拆开最上面那封信
            check: { skill: 侦查, difficulty: 普通, success: ending_letters, failure: ending_dawn }
            key: true
          - text: 不动原样退出
            next: ending_dawn
          - text: 掀开梳妆镜上的布
            check: { skill: 聆听, difficulty: 困难, success: ending_mirror, failure: ending_dawn }
      trap:
        text: >
          门轴转动的瞬间地板猛地倾斜，腐朽的横梁发出断裂的闷响——
          你们脚下的走廊正在一节一节塌向黑暗，栏杆在手里像活物一样扭动。
        choices:
          - text: 抓住栏杆荡回楼梯
            check: { skill: 闪避, difficulty: 困难, success: upper, failure: ending_dawn }
      cellar:
        text: >
          地窖里七口大缸整齐排列，缸盖上各刻着一个名字——全是账簿上的名字。
          最右边那口缸的盖子开着一条缝，里面传出微弱的、有节奏的敲击声；
          缸壁的水珠正缓缓向上爬。
        choices:
          - text: 掀开有声音的缸盖
            check: { skill: 神秘学, difficulty: 普通, success: ending_cellar, failure: ending_dawn }
            key: true
          - text: 逐个读缸盖上的刻名
            check: { skill: 图书馆, difficulty: 普通, success: ending_cellar, failure: ending_dawn }
      ending_letters:
        end: true
        outcome: good
        text: >
          家书的字迹尚新，落款人自称「客栈老板」，请收信人替他看住这栋楼到天亮。
          你们把七封信摆回原处，退出房间时，油灯自己亮了一档——它认得新来的守夜人。
      ending_cellar:
        end: true
        outcome: good
        text: >
          缸里没有失踪的客人，只有一叠记满数字的工牌和一口仍在敲击的空碗。
          敲击声在你们离开地窖时停了。荒村客栈的账，从今夜起多了几个还账的人。
      ending_mirror:
        end: true
        outcome: good
        text: >
          布下是一面擦得发亮的镜子，镜里映出你们身后的房间里站着七个人——
          而你们只有五个。镜中人齐齐竖起食指抵住唇边，你们识趣地退了出去。
      ending_dawn:
        end: true
        outcome: bad
        text: >
          天光从窗纸渗进来的瞬间，楼里所有的声音一起消失，像退潮。
          你们在大堂的桌上发现七碗还冒着热气的粥——其中三碗，勺子是湿的。

  # ============================================================
  # 多人（组队）· 剧本二（3 结局；开场第 1 项带检定）
  # ============================================================
  p_caravan:
    title: 商队护送
    short: false
    start: camp
    scenes:
      camp:
        text: >
          出发营地的篝火压得很低，骆驼背上的货箱捆了三道绳。商队队长把地图摊在鞍上：
          「这一趟要穿过狭谷，官道绕远十天，抄近路——诸位的价钱我加两成。」
          火光映着他缺了一截的食指，地图上近路的尽头画着一个叉。
        choices:
          - text: 与队长细谈路线与报酬
            check: { skill: 说服, difficulty: 普通, success: brief, failure: ridge }
          - text: 抽查货箱的封条
            check: { skill: 侦查, difficulty: 普通, success: brief, failure: ridge }
          - text: 先勘察周边地形
            check: { skill: 生存, difficulty: 普通, success: ridge, failure: brief }
      brief:
        text: >
          地图上，狭谷段被队长用指甲掐出两道印：「左边靠崖，右边靠河。
          走河滩能省两个时辰——但上个月有商队在那里失踪，货没丢，人没了。」
          他说这话时，商队里最年轻的骆驼夫低下了头。
        choices:
          - text: 追问失踪队的细节
            check: { skill: 聆听, difficulty: 普通, success: ridge, failure: trail }
            key: true
          - text: 主动请命打头阵
            next: trail
          - text: 清点随队给养与水源
            check: { skill: 生存, difficulty: 普通, success: ridge, failure: trail }
      ridge:
        text: >
          出发前你攀上营地旁的岩脊。月光下，狭谷像一道劈开大地的伤口：
          河滩上反光的东西不像水，更像被丢弃的铠甲碎片；西侧山脊上有移动的火把。
        choices:
          - text: 记下反光物与火把的位置
            check: { skill: 侦查, difficulty: 困难, success: trail, failure: brief }
            key: true
          - text: 辨认风向与水源
            check: { skill: 生存, difficulty: 普通, success: trail, failure: brief }
      trail:
        text: >
          第二天午时，商队鱼贯进入狭谷。两侧崖壁把马蹄声折返成闷响，
          走在最前的驮畜突然止步不肯再走——河滩上横着一具没人收殓的驮架，
          架上的绳结还是商队专用的双环。
        choices:
          - text: 攀上崖壁侦察前方
            check: { skill: 攀爬, difficulty: 困难, success: overlook, failure: ambush }
          - text: 护住货箱加快通过
            next: ambush
            key: true
      overlook:
        text: >
          你在崖壁的突岩上看清了：前方河滩的沙层下埋着绊马索的木桩，
          两侧岩缝里露出半截弓梢——有人提前两天就在这里等商队。
          风把他们的谈话声送上来了：「……等盐队进谷。」
        choices:
          - text: 悄悄折返改道
            check: { skill: 生存, difficulty: 普通, success: oasis, failure: ambush }
            key: true
          - text: 大喊示警并冲下崖
            next: ambush
      ambush:
        text: >
          喊杀声从两侧岩缝里炸开，箭雨掠过货箱砸进沙地。盗匪人数不多，
          却把地形吃得死死的——你们唯一的空当是背后那片乱石。
          对方旗号是去年就该被剿散的那支残部。
        choices:
          - text: 掩护商队开枪还击
            check: { skill: 射击, difficulty: 普通, success: repel, failure: retreat }
          - text: 弃货保人撤向乱石
            next: retreat
      repel:
        text: >
          三轮齐射后盗匪的攻势塌了下去，残余的人拖着伤员退进岩缝。
          沙地上留下的脚印很轻——他们穿的不是草鞋，是军靴。
        choices:
          - text: 追查脚印的来处
            check: { skill: 侦查, difficulty: 困难, success: oasis, failure: retreat }
            key: true
          - text: 清点货物继续赶路
            next: oasis
      retreat:
        text: >
          你们退进乱石堆，箭雨停了。货箱少了两口，但人手齐整。
          河对岸的绿洲在暮色里泛着微光——先活过今晚再说。
        choices:
          - text: 撤向绿洲扎营
            next: oasis
          - text: 押着残货退回最近的镇子
            next: ending_cargo
            key: true
      oasis:
        text: >
          绿洲的水又清又凉，椰枣树下还留着一堆熄灭的篝火灰。
          灰里插着半截没烧完的商队三角旗——和你们的是同一家字号，
          旗角多了三个新鲜的割口。
        choices:
          - text: 取水并检查前队营地
            key: true
            next: camp_night
      camp_night:
        text: >
          夜谈时队长给你倒了半碗酒：「那两口货箱里不是丝绸，是盐——
          官道上的盐引被人截了。送到地方，这条线上所有饿肚子的人都能吃上饭。」
          驼铃在夜里一声一声，像在替他数着还剩几天的路程。
        choices:
          - text: 举碗应下这趟差事
            check: { skill: 说服, difficulty: 普通, success: ending_contract, failure: ending_dust }
            key: true
          - text: 要求加价并立字据
            next: ending_dust
          - text: 留书一封，天亮前独自上路
            check: { skill: 图书馆, difficulty: 普通, success: ending_lonesome, failure: ending_dust }
      ending_contract:
        end: true
        outcome: good
        text: >
          商队在第七天抵达。交接完盐箱，队长把三角旗解下来系在你的行囊上：
          「往后这条线，见旗如见人。」你们的名号从今晚起写进了商路的路引里。
      ending_dust:
        end: true
        outcome: good
        text: >
          货送到了，钱也结清了，双方都觉得自己吃了亏——这大概就是生意。
          商队继续向前，你站在尘土里回头，狭谷的方向已经看不见了。
      ending_lonesome:
        end: true
        outcome: good
        text: >
          你在天亮前独自上路，把营地甩在身后。三天后听说商队在绿洲遇了雨，
          而你走的那条小路恰好干爽——独行有独行的代价，也有独行的运气。
      ending_cargo:
        end: true
        outcome: good
        text: >
          你们带着剩下的货物退回最近的镇子，把损失如实报给了货东。
          货东沉默半晌，递给你一封信：「下一趟，还找你们。」——信任是这样挣来的。

  # ============================================================
  # 多人（组队）· 剧本三（4 结局；开场第 1 项带检定）
  # ============================================================
  p_temple:
    title: 古庙封印
    short: false
    start: temple_gate
    scenes:
      temple_gate:
        text: >
          山腹里的古庙被藤蔓封了大半，正门的门楣上刻着一行被人刻意磨平的铭文，
          只剩最后两个字还辨认得出：「……勿启」。石阶上的香灰积了三寸，
          却一个脚印都没有——香是三天内新烧的。
        choices:
          - text: 读出门楣上的残余铭文
            check: { skill: 图书馆, difficulty: 普通, success: hall, failure: courtyard }
          - text: 绕行侧廊找入口
            check: { skill: 攀爬, difficulty: 普通, success: courtyard, failure: hall }
          - text: 凝视门上的封印纹路
            check: { skill: 神秘学, difficulty: 困难, success: hall, failure: courtyard }
      courtyard:
        text: >
          庭院中央的香炉倾倒在地，炉身内壁布满抓痕。藤蔓下的石板被人撬起过又草草盖回，
          缝隙里透出地底的凉气和一丝若有若无的檀香。
          院墙上的神龛里，神像的头齐刷刷地转向同一个方向。
        choices:
          - text: 拂开藤蔓找正门
            next: hall
            key: true
          - text: 数石阶推算庙宇规模
            check: { skill: 侦查, difficulty: 普通, success: hall, failure: altar }
      hall:
        text: >
          大殿里的金身佛像面目模糊，掌心被凿出一个凹槽，槽底积着黑色的蜡泪。
          供桌下的砖地上刻着密密麻麻的小字，像一篇没写完的祷文，
          最后一句只写了半截：「若七钉俱鸣，则——」
        choices:
          - text: 读碑文与供桌刻字
            check: { skill: 图书馆, difficulty: 普通, success: records, failure: altar }
          - text: 直接摸上祭坛凹槽
            check: { skill: 神秘学, difficulty: 普通, success: altar, failure: records }
            key: true
      records:
        text: >
          经柜里码着七卷《镇煞录》，其中一卷被抽走了大半，断口的纸边还很新。
          残卷里写着：「封以七钉，启以七诵；钉缺其一，诵乱其序，皆为大祸。」
          书页间夹着一片干枯的花瓣，触感却像刚摘下来。
        choices:
          - text: 抄下残卷的关键段落
            check: { skill: 图书馆, difficulty: 困难, success: altar, failure: dusk }
            key: true
          - text: 对照七卷经文补全诵序
            check: { skill: 图书馆, difficulty: 普通, success: altar, failure: dusk }
      dusk:
        text: >
          天色暗得比山外快得多，殿里的影子一寸寸爬上供桌。
          你抄到一半的字迹开始在纸上自行挪动，像要排回原来的位置；
          窗外的暮鼓一声比一声近，可山下并没有寺庙。
        choices:
          - text: 合上残卷直奔祭坛
            next: altar
      altar:
        text: >
          祭坛上嵌着七枚锈钉，其中一枚不见了，钉孔里渗出的不是锈水，是温热的。
          坛面的凹槽正好容一只手按下去——按下去的瞬间，整座庙的呼吸声都停了，
          殿角的风铃开始无风自鸣，一声、两声……数到第七声。
        choices:
          - text: 按古法补齐封印
            check: { skill: 神秘学, difficulty: 普通, success: ending_seal, failure: ending_shatter }
            key: true
          - text: 诵念祷文稳住七钉
            check: { skill: 聆听, difficulty: 普通, success: ending_hold, failure: ending_shatter }
          - text: 趁它没醒立刻撤出
            next: ending_flee
      ending_seal:
        end: true
        outcome: good
        text: >
          你以旧法补齐七钉，殿内檀香复燃，抓痕般的风声一节节平息。
          离庙时石阶上的香灰印出了你们的脚印——古庙重新认得了香客。
      ending_hold:
        end: true
        outcome: good
        text: >
          七段祷文一字不差地诵完，坛面的温热缓缓冷却。封印没有完全修复，
          但它安静了下来——你们约定每年今日回来重诵一遍。这是个长久的约定。
      ending_shatter:
        end: true
        outcome: bad
        text: >
          第七枚钉孔里传出一声轻笑，殿顶的灰簌簌而下。你们几乎是滚出庙门的，
          身后石门自行合拢——门楣上那行磨平的铭文，似乎清晰了一点。
      ending_flee:
        end: true
        outcome: good
        text: >
          你们撤出古庙的瞬间，身后传来锁链拖地的闷响，一步、两步……然后停在门内。
          回望时庙门完好，香炉却端端正正地立回了原位——它在替你们保守秘密。

  # ============================================================
  # 短团本（单场 ≤30 分钟；「回复 1」链 ≤5 步通关）
  # ============================================================
  c_tunnel:
    title: 废矿探秘
    short: true
    start: tunnel_start
    scenes:
      tunnel_start:
        text: >
          废矿入口渗出的冷风带着铁锈味，矿灯照见地上一行新鲜的拖痕——
          拖痕尽头消失在塌方的碎石后，碎石缝里还漏着微弱的光，
          光里有细小的尘粒在打转，像被谁的呼吸搅动。
        choices:
          - text: 沿拖痕前进
            next: tunnel_fork
          - text: 先检查装备
            check: { skill: 生存, difficulty: 普通, success: tunnel_fork, failure: tunnel_fork }
      tunnel_fork:
        text: >
          矿道在此分岔：左边传来滴水与暗河的涌动，右边飘来焦木的气味，
          还夹着一丝布料烧焦的腥气。岩壁上两道刻痕分别指向不同的方向，
          左刻痕旁写着「水」，右刻痕旁的字被凿掉了。
        choices:
          - text: 走左道（水声）
            check: { skill: 聆听, difficulty: 普通, success: tunnel_lake, failure: tunnel_lake }
          - text: 走右道（焦味）
            check: { skill: 侦查, difficulty: 困难, success: tunnel_fire, failure: tunnel_lake }
          - text: 探查塌方段
            check: { skill: 侦查, difficulty: 普通, success: tunnel_collapse, failure: tunnel_lake }
      tunnel_collapse:
        text: >
          塌方处的碎石还在缓缓滑落，缝隙后是一条被截断的旧运输道，
          铁轨从碎石堆下伸出来，轨面的磨损还是新的——最近有人（或有什么）走过。
        choices:
          - text: 从缝隙钻过去
            check: { skill: 闪避, difficulty: 普通, success: tunnel_fire, failure: tunnel_lake }
          - text: 记下位置原路退回
            next: tunnel_lake
      tunnel_lake:
        text: >
          地下水潭黑得像一块墨，水面却纹丝不动。一条手臂粗的锁链横过潭面，
          延伸到看不见的潭心，链环上凝着水珠，另一头绷得很紧，
          像另一端拴着什么还在呼吸的东西。
        choices:
          - text: 拉动锁链
            next: ending_chain
            key: true
          - text: 记录后离开
            next: ending_maps
          - text: 潜水追踪锁链源头
            check: { skill: 生存, difficulty: 困难, success: ending_dive, failure: ending_maps }
      tunnel_fire:
        text: >
          塌方处的余烬还没熄透，火光照出半埋在灰里的矿工工具箱，箱扣已经烧变形。
          头顶的横梁还在噼啪掉火星，这里随时可能再塌一次；
          烟道里灌进来的风把火苗压得忽高忽低。
        choices:
          - text: 取走工具箱
            check: { skill: 侦查, difficulty: 普通, success: ending_tools, failure: ending_burn }
          - text: 灭掉余烬防二次塌方
            next: ending_fire
            key: true
          - text: 顺烟道往上爬
            check: { skill: 攀爬, difficulty: 困难, success: ending_vent, failure: ending_burn }
      ending_chain:
        end: true
        outcome: good
        text: "锁链尽头是一只旧矿箱，箱盖上的锁一碰就开，里面码着成色极好的矿石。你把矿石装满行囊，沿着来时的脚印原路返回——短团本通关！"
      ending_maps:
        end: true
        outcome: good
        text: "你拓下整条矿道图，标注了水脉、塌方点与那条新运输道，卷好塞进怀里，从矿口安全撤出，回头记住这个位置——短团本通关！"
      ending_dive:
        end: true
        outcome: good
        text: "你憋足一口气潜到潭心，发现锁链拴着的是一整箱封存的矿灯，灯油还没耗尽。把箱子拖回地面正好卖个好价钱——短团本通关！"
      ending_tools:
        end: true
        outcome: good
        text: "工具箱里的家伙什完好无损，扳手、撬棍、矿灯一样不少，你拎着它原路返回，脚步比来时轻快得多——短团本通关！"
      ending_burn:
        end: true
        outcome: bad
        text: "余烬复燃逼退了你，浓烟呛得人睁不开眼，但你死死抱着工具箱才得以全身而退，背后的火光映红了半条矿道——短团本通关！"
      ending_fire:
        end: true
        outcome: good
        text: "余烬被你一捧捧沙土压灭，横梁上的火星也跟着灭了，矿道重新安静下来，只有水滴声陪你走出洞口——短团本通关！"
      ending_vent:
        end: true
        outcome: good
        text: "你顺着烟道一路爬出地面，回头一看矿口正在合拢，烟里似乎还站着别的影子——你不打算回头再看，快步离开了——短团本通关！"
